<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5.1 Causative "help" – Flip Cards</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f4;--hd:#1b2540;--muted:#566176;--line:#cdd3de;--red:#8b0000;--redbg:#fbe6e6;--navy:#1b2540;--tab:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--hd:#e8ecf4;--muted:#9aa6bd;--line:#2b3550;--tab:#1b2236}}
:root[data-theme="dark"]{--bg:#0f1420;--hd:#e8ecf4;--muted:#9aa6bd;--line:#2b3550;--tab:#1b2236}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--hd);font-family:Arial,Helvetica,sans-serif}
header{max-width:1100px;margin:0 auto;padding:22px 16px 6px}
h1{margin:0;font:700 22px/1.25 Arial,sans-serif}
.formula{margin-top:8px;font:15px/1.5 Arial;color:var(--muted)}
.formula b{color:var(--red)}
.tabs{max-width:1100px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:600 14px Arial;padding:9px 16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--tab);color:#1b2540;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{background:#e8ecf4;color:#1b2540}}
.bar{max-width:1100px;margin:10px auto 0;padding:0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.bar select{font:13px Arial;padding:5px 8px;border-radius:8px;max-width:280px}
.bar button{font:600 13px Arial;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#111;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{perspective:1200px;height:290px;cursor:pointer;outline:none}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column}
.card:focus-visible .face{box-shadow:0 0 0 3px #4a7bd0}
.front{background:#fff;border:1px solid var(--line)}
.pic{flex:0 0 96px;background:#f1f3f8;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:center;font-size:58px;line-height:1;position:relative}
.num{position:absolute;left:14px;top:10px;font:12px Arial;color:#6b7588}
.txt{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 22px 0;text-align:center}
.en{font:400 23px/1.4 Arial,Helvetica,sans-serif;color:#000;margin:0}
.en b{font-weight:700;color:var(--red)}
.en b.mk{background:var(--redbg);border-radius:4px;padding:0 3px}
.en b.v1{border-bottom:2px dotted var(--red);cursor:help}
.foot{padding:8px 12px 12px;display:flex;justify-content:space-between;align-items:center}
.hint{font-size:12px;color:#6b7588}
.say{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#1b2540;color:#fff;font:600 13px Arial;padding:8px 14px;cursor:pointer}
.say:hover{filter:brightness(1.3)}
.say.on{background:var(--red)}
.back{background:#1b2540;color:#fff;transform:rotateY(180deg);justify-content:center;align-items:center;text-align:center;padding:20px 22px;gap:16px}
.back .th{font:500 24px/1.5 "Noto Sans Thai","Sarabun",Tahoma,Arial,sans-serif;margin:0}
.back .en2{font:300 16px/1.4 Arial;color:#c9d2e3;margin:0;border-top:1px solid #3b4768;padding-top:12px;width:100%}
.back .en2 b{font-weight:700;color:#ff9b9b}
#tip{position:fixed;z-index:10;pointer-events:none;background:#14192b;color:#fff;border:1px solid #4a5578;border-radius:10px;padding:8px 12px;font:500 15px/1.4 "Noto Sans Thai","Sarabun",Tahoma,Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:260px}
#tip.show{opacity:1;transform:none}
#tip small{display:block;font:11px Arial;color:#9fb0d0}
@media (max-width:720px){main{grid-template-columns:1fr}.card{height:300px}.en{font-size:21px}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<header>
  <h1>5.1 Causative verb “help” · Flip cards</h1>
  <div class="formula">Subject + <b>help</b> + someone + <b>V1</b> (base form) &nbsp;·&nbsp; ชี้เมาส์ที่ V1 (ตัวหนามีเส้นประ) เพื่อดูความหมาย · คลิกการ์ดเพื่อดูคำแปล</div>
</header>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="bar">
  <label for="voice">Voice:</label><select id="voice"></select>
  <button id="flipAll" type="button">Flip all</button>
  <span id="vnote"></span>
</div>
<main id="grid"></main>
<div id="tip" role="tooltip"></div>
<script>
const DATA = [{"en": "I help my mother cook dinner every evening.", "th": "ฉันช่วยแม่ทำอาหารเย็นทุกเย็น", "mk": 1, "v1": 4, "base": "cook", "mean": "ทำอาหาร", "emo": "👩‍🍳"}, {"en": "She helps her brother study English.", "th": "เธอช่วยพี่ชายเรียนภาษาอังกฤษ", "mk": 1, "v1": 4, "base": "study", "mean": "เรียน / ศึกษา", "emo": "📖"}, {"en": "He helps his father wash the car.", "th": "เขาช่วยพ่อล้างรถ", "mk": 1, "v1": 4, "base": "wash", "mean": "ล้าง", "emo": "🚿"}, {"en": "We help our neighbors clean their yard.", "th": "พวกเราช่วยเพื่อนบ้านทำความสะอาดสนาม", "mk": 1, "v1": 4, "base": "clean", "mean": "ทำความสะอาด", "emo": "🧹"}, {"en": "They help the teacher prepare the classroom.", "th": "พวกเขาช่วยครูเตรียมห้องเรียน", "mk": 1, "v1": 4, "base": "prepare", "mean": "เตรียม", "emo": "🍳"}, {"en": "I help my friend carry the boxes.", "th": "ฉันช่วยเพื่อนยกกล่อง", "mk": 1, "v1": 4, "base": "carry", "mean": "ถือ / ยก / ขน", "emo": "🧳"}, {"en": "She helps her daughter practice the piano.", "th": "เธอช่วยลูกสาวฝึกเปียโน", "mk": 1, "v1": 4, "base": "practice", "mean": "ฝึกซ้อม", "emo": "🎹"}, {"en": "He helps his son build a model airplane.", "th": "เขาช่วยลูกชายประกอบเครื่องบินจำลอง", "mk": 1, "v1": 4, "base": "build", "mean": "สร้าง / ประกอบ", "emo": "🏗️"}, {"en": "We help our parents plant vegetables.", "th": "พวกเราช่วยพ่อแม่ปลูกผัก", "mk": 1, "v1": 4, "base": "plant", "mean": "ปลูก", "emo": "🌱"}, {"en": "They help tourists find the train station.", "th": "พวกเขาช่วยนักท่องเที่ยวหาสถานีรถไฟ", "mk": 1, "v1": 3, "base": "find", "mean": "ค้นหา / หา", "emo": "🔍"}, {"en": "I help my sister choose a dress.", "th": "ฉันช่วยน้องสาวเลือกชุด", "mk": 1, "v1": 4, "base": "choose", "mean": "เลือก", "emo": "👆"}, {"en": "She helps her grandmother walk across the street.", "th": "เธอช่วยคุณยายเดินข้ามถนน", "mk": 1, "v1": 4, "base": "walk", "mean": "เดิน", "emo": "🚶"}, {"en": "He helps his team finish the project.", "th": "เขาช่วยทีมทำโครงการให้เสร็จ", "mk": 1, "v1": 4, "base": "finish", "mean": "ทำให้เสร็จ", "emo": "🏁"}, {"en": "We help our classmates understand the lesson.", "th": "พวกเราช่วยเพื่อนร่วมชั้นเข้าใจบทเรียน", "mk": 1, "v1": 4, "base": "understand", "mean": "เข้าใจ", "emo": "💡"}, {"en": "They help the manager organize the meeting.", "th": "พวกเขาช่วยผู้จัดการจัดการประชุม", "mk": 1, "v1": 4, "base": "organize", "mean": "จัด / จัดระเบียบ", "emo": "🗂️"}, {"en": "I help my cousin move to a new apartment.", "th": "ฉันช่วยลูกพี่ลูกน้องย้ายบ้าน", "mk": 1, "v1": 4, "base": "move", "mean": "ย้าย / เคลื่อนย้าย", "emo": "📦"}, {"en": "She helps her friend solve the problem.", "th": "เธอช่วยเพื่อนแก้ปัญหา", "mk": 1, "v1": 4, "base": "solve", "mean": "แก้ (ปัญหา)", "emo": "🧩"}, {"en": "He helps his wife decorate the house.", "th": "เขาช่วยภรรยาตกแต่งบ้าน", "mk": 1, "v1": 4, "base": "decorate", "mean": "ตกแต่ง", "emo": "🎄"}, {"en": "We help the coach train the younger players.", "th": "พวกเราช่วยโค้ชฝึกนักกีฬารุ่นน้อง", "mk": 1, "v1": 4, "base": "train", "mean": "ฝึก / ฝึกอบรม", "emo": "🏋️"}, {"en": "They help children learn to read.", "th": "พวกเขาช่วยเด็ก ๆ เรียนอ่านหนังสือ", "mk": 1, "v1": 3, "base": "learn", "mean": "เรียนรู้", "emo": "🎓"}, {"en": "I help my father repair the fence.", "th": "ฉันช่วยพ่อซ่อมรั้ว", "mk": 1, "v1": 4, "base": "repair", "mean": "ซ่อมแซม", "emo": "🛠️"}, {"en": "She helps her mother bake cookies.", "th": "เธอช่วยแม่อบคุกกี้", "mk": 1, "v1": 4, "base": "bake", "mean": "อบ", "emo": "🍪"}, {"en": "He helps his uncle paint the wall.", "th": "เขาช่วยลุงทาสีกำแพง", "mk": 1, "v1": 4, "base": "paint", "mean": "ทาสี / วาด", "emo": "🎨"}, {"en": "We help our friends pack their luggage.", "th": "พวกเราช่วยเพื่อนจัดกระเป๋าเดินทาง", "mk": 1, "v1": 4, "base": "pack", "mean": "จัดกระเป๋า / บรรจุ", "emo": "🎒"}, {"en": "They help the doctor treat patients.", "th": "พวกเขาช่วยหมอรักษาผู้ป่วย", "mk": 1, "v1": 4, "base": "treat", "mean": "รักษา", "emo": "🩺"}, {"en": "I help my neighbor mow the lawn.", "th": "ฉันช่วยเพื่อนบ้านตัดหญ้า", "mk": 1, "v1": 4, "base": "mow", "mean": "ตัด (หญ้า)", "emo": "🚜"}, {"en": "She helps her son tie his shoes.", "th": "เธอช่วยลูกชายผูกเชือกรองเท้า", "mk": 1, "v1": 4, "base": "tie", "mean": "ผูก", "emo": "👟"}, {"en": "He helps the mechanic fix the motorcycle.", "th": "เขาช่วยช่างซ่อมรถจักรยานยนต์", "mk": 1, "v1": 4, "base": "fix", "mean": "ซ่อม", "emo": "🔧"}, {"en": "We help our teacher collect the papers.", "th": "พวกเราช่วยครูเก็บเอกสาร", "mk": 1, "v1": 4, "base": "collect", "mean": "รวบรวม / เก็บ", "emo": "📥"}, {"en": "They help the chef serve the food.", "th": "พวกเขาช่วยเชฟเสิร์ฟอาหาร", "mk": 1, "v1": 4, "base": "serve", "mean": "เสิร์ฟ", "emo": "🍽️"}, {"en": "I help my niece draw pictures.", "th": "ฉันช่วยหลานสาววาดรูป", "mk": 1, "v1": 4, "base": "draw", "mean": "วาด", "emo": "✏️"}, {"en": "She helps her brother drive to the airport.", "th": "เธอช่วยพี่ชายขับรถไปสนามบิน", "mk": 1, "v1": 4, "base": "drive", "mean": "ขับรถ", "emo": "🚗"}, {"en": "He helps his parents shop for groceries.", "th": "เขาช่วยพ่อแม่ซื้อของชำ", "mk": 1, "v1": 4, "base": "shop", "mean": "ซื้อของ / ช้อปปิ้ง", "emo": "🛒"}, {"en": "We help the volunteers distribute food.", "th": "พวกเราช่วยอาสาสมัครแจกอาหาร", "mk": 1, "v1": 4, "base": "distribute", "mean": "แจก / กระจาย", "emo": "🍲"}, {"en": "They help visitors understand the museum exhibits.", "th": "พวกเขาช่วยผู้เข้าชมเข้าใจนิทรรศการ", "mk": 1, "v1": 3, "base": "understand", "mean": "เข้าใจ", "emo": "💡"}, {"en": "I help my classmate finish the assignment.", "th": "ฉันช่วยเพื่อนร่วมชั้นทำการบ้านให้เสร็จ", "mk": 1, "v1": 4, "base": "finish", "mean": "ทำให้เสร็จ", "emo": "🏁"}, {"en": "She helps her father install a new shelf.", "th": "เธอช่วยพ่อติดตั้งชั้นวางใหม่", "mk": 1, "v1": 4, "base": "install", "mean": "ติดตั้ง", "emo": "🔌"}, {"en": "He helps the gardener water the plants.", "th": "เขาช่วยคนสวนรดน้ำต้นไม้", "mk": 1, "v1": 4, "base": "water", "mean": "รดน้ำ", "emo": "💧"}, {"en": "We help our grandparents harvest vegetables.", "th": "พวกเราช่วยปู่ย่าตายายเก็บผัก", "mk": 1, "v1": 4, "base": "harvest", "mean": "เก็บเกี่ยว", "emo": "🌾"}, {"en": "They help their coworkers complete difficult tasks.", "th": "พวกเขาช่วยเพื่อนร่วมงานทำงานยากให้เสร็จ", "mk": 1, "v1": 4, "base": "complete", "mean": "ทำให้เสร็จสมบูรณ์", "emo": "✅"}, {"en": "I help my mother carry the groceries.", "th": "ฉันช่วยแม่ถือของชำ", "mk": 1, "v1": 4, "base": "carry", "mean": "ถือ / ยก / ขน", "emo": "🧳"}, {"en": "She helps her sister decorate the living room.", "th": "เธอช่วยพี่สาวตกแต่งห้องนั่งเล่น", "mk": 1, "v1": 4, "base": "decorate", "mean": "ตกแต่ง", "emo": "🎄"}, {"en": "He helps his daughter read storybooks.", "th": "เขาช่วยลูกสาวอ่านนิทาน", "mk": 1, "v1": 4, "base": "read", "mean": "อ่าน", "emo": "📚"}, {"en": "We help the staff arrange the chairs.", "th": "พวกเราช่วยพนักงานจัดเก้าอี้", "mk": 1, "v1": 4, "base": "arrange", "mean": "จัดเรียง / จัด", "emo": "💐"}, {"en": "They help the police find the missing dog.", "th": "พวกเขาช่วยตำรวจหาสุนัขที่หาย", "mk": 1, "v1": 4, "base": "find", "mean": "ค้นหา / หา", "emo": "🔍"}, {"en": "I help my friend improve his pronunciation.", "th": "ฉันช่วยเพื่อนพัฒนาการออกเสียง", "mk": 1, "v1": 4, "base": "improve", "mean": "ปรับปรุง / พัฒนา", "emo": "📈"}, {"en": "She helps her teacher check the homework.", "th": "เธอช่วยครูตรวจการบ้าน", "mk": 1, "v1": 4, "base": "check", "mean": "ตรวจ", "emo": "✔️"}, {"en": "He helps his neighbor paint the garage.", "th": "เขาช่วยเพื่อนบ้านทาสีโรงรถ", "mk": 1, "v1": 4, "base": "paint", "mean": "ทาสี / วาด", "emo": "🎨"}, {"en": "We help our community keep the park clean.", "th": "พวกเราช่วยชุมชนรักษาความสะอาดของสวนสาธารณะ", "mk": 1, "v1": 4, "base": "keep", "mean": "รักษา / คงไว้", "emo": "🌳"}, {"en": "They help everyone enjoy the event.", "th": "พวกเขาช่วยให้ทุกคนสนุกกับงาน", "mk": 1, "v1": 3, "base": "enjoy", "mean": "สนุก / เพลิดเพลิน", "emo": "😄"}, {"en": "I help my father install a new air conditioner.", "th": "ฉันช่วยพ่อติดตั้งเครื่องปรับอากาศเครื่องใหม่", "mk": 1, "v1": 4, "base": "install", "mean": "ติดตั้ง", "emo": "🔌"}, {"en": "She helps her mother organize the kitchen.", "th": "เธอช่วยแม่จัดระเบียบห้องครัว", "mk": 1, "v1": 4, "base": "organize", "mean": "จัด / จัดระเบียบ", "emo": "🗂️"}, {"en": "He helps his brother prepare for the exam.", "th": "เขาช่วยพี่ชายเตรียมตัวสอบ", "mk": 1, "v1": 4, "base": "prepare", "mean": "เตรียม", "emo": "🍳"}, {"en": "We help our teacher decorate the classroom.", "th": "พวกเราช่วยครูตกแต่งห้องเรียน", "mk": 1, "v1": 4, "base": "decorate", "mean": "ตกแต่ง", "emo": "🎄"}, {"en": "They help their neighbors remove fallen branches.", "th": "พวกเขาช่วยเพื่อนบ้านเก็บกิ่งไม้ที่ล้ม", "mk": 1, "v1": 4, "base": "remove", "mean": "เก็บออก / ขจัด", "emo": "🧹"}, {"en": "I help my sister wash the dishes after dinner.", "th": "ฉันช่วยน้องสาวล้างจานหลังอาหารเย็น", "mk": 1, "v1": 4, "base": "wash", "mean": "ล้าง", "emo": "🚿"}, {"en": "She helps her friend choose a birthday gift.", "th": "เธอช่วยเพื่อนเลือกของขวัญวันเกิด", "mk": 1, "v1": 4, "base": "choose", "mean": "เลือก", "emo": "👆"}, {"en": "He helps his son finish his science project.", "th": "เขาช่วยลูกชายทำโครงงานวิทยาศาสตร์ให้เสร็จ", "mk": 1, "v1": 4, "base": "finish", "mean": "ทำให้เสร็จ", "emo": "🏁"}, {"en": "We help the new employee learn the system.", "th": "พวกเราช่วยพนักงานใหม่เรียนรู้ระบบ", "mk": 1, "v1": 5, "base": "learn", "mean": "เรียนรู้", "emo": "🎓"}, {"en": "They help the visitors locate the information desk.", "th": "พวกเขาช่วยผู้มาเยือนหาจุดประชาสัมพันธ์", "mk": 1, "v1": 4, "base": "locate", "mean": "ค้นหาตำแหน่ง / หาเจอ", "emo": "📍"}, {"en": "I help my cousin decorate her apartment.", "th": "ฉันช่วยลูกพี่ลูกน้องตกแต่งอพาร์ตเมนต์", "mk": 1, "v1": 4, "base": "decorate", "mean": "ตกแต่ง", "emo": "🎄"}, {"en": "She helps her grandmother water the flowers.", "th": "เธอช่วยคุณยายรดน้ำดอกไม้", "mk": 1, "v1": 4, "base": "water", "mean": "รดน้ำ", "emo": "💧"}, {"en": "He helps the chef cook lunch.", "th": "เขาช่วยเชฟทำอาหารกลางวัน", "mk": 1, "v1": 4, "base": "cook", "mean": "ทำอาหาร", "emo": "👩‍🍳"}, {"en": "We help our parents paint the house.", "th": "พวกเราช่วยพ่อแม่ทาสีบ้าน", "mk": 1, "v1": 4, "base": "paint", "mean": "ทาสี / วาด", "emo": "🎨"}, {"en": "They help the coach organize the sports event.", "th": "พวกเขาช่วยโค้ชจัดการแข่งขันกีฬา", "mk": 1, "v1": 4, "base": "organize", "mean": "จัด / จัดระเบียบ", "emo": "🗂️"}, {"en": "I help my friend install new software.", "th": "ฉันช่วยเพื่อนติดตั้งโปรแกรมใหม่", "mk": 1, "v1": 4, "base": "install", "mean": "ติดตั้ง", "emo": "🔌"}, {"en": "She helps her brother fix his bicycle.", "th": "เธอช่วยพี่ชายซ่อมจักรยาน", "mk": 1, "v1": 4, "base": "fix", "mean": "ซ่อม", "emo": "🔧"}, {"en": "He helps his mother carry the shopping bags.", "th": "เขาช่วยแม่ถือถุงช้อปปิ้ง", "mk": 1, "v1": 4, "base": "carry", "mean": "ถือ / ยก / ขน", "emo": "🧳"}, {"en": "We help the children cross the road safely.", "th": "พวกเราช่วยเด็ก ๆ ข้ามถนนอย่างปลอดภัย", "mk": 1, "v1": 4, "base": "cross", "mean": "ข้าม", "emo": "🚸"}, {"en": "They help the elderly use smartphones.", "th": "พวกเขาช่วยผู้สูงอายุใช้สมาร์ตโฟน", "mk": 1, "v1": 4, "base": "use", "mean": "ใช้", "emo": "📱"}, {"en": "I help my teacher set up the projector.", "th": "ฉันช่วยครูติดตั้งเครื่องฉายภาพ", "mk": 1, "v1": 4, "base": "set", "mean": "ติดตั้ง / ตั้ง (set up = จัดเตรียม)", "emo": "📽️"}, {"en": "She helps her parents clean the garage.", "th": "เธอช่วยพ่อแม่ทำความสะอาดโรงรถ", "mk": 1, "v1": 4, "base": "clean", "mean": "ทำความสะอาด", "emo": "🧹"}, {"en": "He helps his classmate understand grammar.", "th": "เขาช่วยเพื่อนร่วมชั้นเข้าใจไวยากรณ์", "mk": 1, "v1": 4, "base": "understand", "mean": "เข้าใจ", "emo": "💡"}, {"en": "We help the librarian shelve the books.", "th": "พวกเราช่วยบรรณารักษ์เก็บหนังสือขึ้นชั้น", "mk": 1, "v1": 4, "base": "shelve", "mean": "เก็บขึ้นชั้น", "emo": "📚"}, {"en": "They help the nurses move medical equipment.", "th": "พวกเขาช่วยพยาบาลเคลื่อนย้ายอุปกรณ์การแพทย์", "mk": 1, "v1": 4, "base": "move", "mean": "ย้าย / เคล h": "เขาช่วยเพื่อนฝึกบทสนทนาภาษาอังกฤษ", "mk": 1, "v1": 4, "base": "practice", "mean": "ฝึกซ้อม", "emo": "🎹"}, {"en": "We help the staff welcome the guests.", "th": "พวกเราช่วยพนักงานต้อนรับแขก", "mk": 1, "v1": 4, "base": "welcome", "mean": "ต้อนรับ", "emo": "👋"}, {"en": "They help new students adjust to school life.", "th": "พวกเขาช่วยนักเรียนใหม่ปรับตัวกับชีวิตในโรงเรียน", "mk": 1, "v1": 4, "base": "adjust", "mean": "ปรับตัว", "emo": "🔄"}, {"en": "I help my brother replace the light bulb.", "th": "ฉันช่วยพี่ชายเปลี่ยนหลอดไฟ", "mk": 1, "v1": 4, "base": "replace", "mean": "เปลี่ยน / แทนที่", "emo": "💡"}, {"en": "She helps her coworker complete the presentation.", "th": "เธอช่วยเพื่อนร่วมงานทำงานนำเสนอให้เสร็จ", "mk": 1, "v1": 4, "base": "complete", "mean": "ทำให้เสร็จสมบูรณ์", "emo": "✅"}, {"en": "He helps the customer carry heavy packages.", "th": "เขาช่วยลูกค้าถือพัสดุหนัก", "mk": 1, "v1": 4, "base": "carry", "mean": "ถือ / ยก / ขน", "emo": "🧳"}, {"en": "We help the farmers grow organic vegetables.", "th": "พวกเราช่วยเกษตรกรปลูกผักออร์แกนิก", "mk": 1, "v1": 4, "base": "grow", "mean": "ปลูก / เติบโต", "emo": "🥬"}, {"en": "They help the children develop reading skills.", "th": "พวกเขาช่วยเด็ก ๆ พัฒนาทักษะการอ่าน", "mk": 1, "v1": 4, "base": "develop", "mean": "พัฒนา", "emo": "🌟"}, {"en": "I help my grandparents prepare breakfast.", "th": "ฉันช่วยปู่ย่าตายายเตรียมอาหารเช้า", "mk": 1, "v1": 4, "base": "prepare", "mean": "เตรียม", "emo": "🍳"}, {"en": "She helps her aunt arrange the flowers.", "th": "เธอช่วยป้าจัดดอกไม้", "mk": 1, "v1": 4, "base": "arrange", "mean": "จัดเรียง / จัด", "emo": "💐"}, {"en": "He helps his team achieve its goals.", "th": "เขาช่วยทีมให้บรรลุเป้าหมาย", "mk": 1, "v1": 4, "base": "achieve", "mean": "บรรลุ", "emo": "🏆"}, {"en": "We help our community protect the environment.", "th": "พวกเราช่วยชุมชนปกป้องสิ่งแวดล้อม", "mk": 1, "v1": 4, "base": "protect", "mean": "ปกป้อง", "emo": "🛡️"}, {"en": "They help everyone succeed in their work.", "th": "พวกเขาช่วยให้ทุกคนประสบความสำเร็จในการทำงาน", "mk": 1, "v1": 3, "base": "succeed", "mean": "ประสบความสำเร็จ", "emo": "🥇"}];
const PER = 20, TABS = Math.ceil(DATA.length/PER);
let tab = 0, voices = [], chosen = null;
const grid=document.getElementById('grid'), tabsEl=document.getElementById('tabs'), tip=document.getElementById('tip');

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function mark(d,withV1){
  return d.en.split(' ').map((w,i)=>{
    const m=w.match(/^([^A-Za-z']*)([A-Za-z'’-]+)(.*)$/);
    if(!m) return esc(w);
    if(i===d.mk) return esc(m[1])+'<b class="mk">'+esc(m[2])+'</b>'+esc(m[3]);
    if(i===d.v1){
      return esc(m[1])+(withV1?`<b class="v1" tabindex="0" data-base="${esc(d.base)}" data-mean="${esc(d.mean)}">${esc(m[2])}</b>`:'<b>'+esc(m[2])+'</b>')+esc(m[3]);
    }
    return esc(w);
  }).join(' ');
}
function showTip(el){
  tip.innerHTML=`<small>V1 · ${esc(el.dataset.base)}</small>${el.dataset.mean}`;
  tip.classList.add('show');
  const r=el.getBoundingClientRect(), t=tip.getBoundingClientRect();
  let x=r.left+r.width/2-t.width/2; x=Math.max(8,Math.min(x,innerWidth-t.width-8));
  let y=r.top-t.height-8; if(y<8) y=r.bottom+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){tip.classList.remove('show')}
function render(){
  hideTip(); grid.innerHTML='';
  const s=tab*PER;
  DATA.slice(s,s+PER).forEach((d,k)=>{
    const n=s+k+1, el=document.createElement('div');
    el.className='card'; el.tabIndex=0; el.setAttribute('role','button');
    el.setAttribute('aria-label','Card '+n+': '+d.en+' (press to flip)');
    el.innerHTML=`<div class="inner">
      <div class="face front"><div class="pic" aria-hidden="true"><span class="num">${n}</span>${d.emo}</div>
        <div class="txt"><p class="en">${mark(d,true)}</p></div>
        <div class="foot"><button class="say" type="button" aria-label="Read sentence aloud">🔊 Listen</button><span class="hint">คลิกเพื่อดูคำแปล</span></div>
      </div>
      <div class="face back"><p class="th">${esc(d.th)}</p><p class="en2">${mark(d,false)}</p></div>
    </div>`;
    el.addEventListener('click',()=>{hideTip();el.classList.toggle('flipped')});
    el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===el){e.preventDefault();el.classList.toggle('flipped')}});
    const b=el.querySelector('.say');
    b.addEventListener('click',e=>{e.stopPropagation();speak(d.en,b)});
    b.addEventListener('keydown',e=>e.stopPropagation());
    const v=el.querySelector('.v1');
    v.addEventListener('mouseenter',()=>showTip(v));
    v.addEventListener('mouseleave',hideTip);
    v.addEventListener('focus',()=>showTip(v));
    v.addEventListener('blur',hideTip);
    v.addEventListener('click',e=>{e.stopPropagation();tip.classList.contains('show')&&tip.dataset.for===String(n)?hideTip():(showTip(v),tip.dataset.for=String(n))});
    v.addEventListener('keydown',e=>e.stopPropagation());
    grid.appendChild(el);
  });
  tabsEl.innerHTML='';
  for(let t=0;t<TABS;t++){
    const b=document.createElement('button');
    b.setAttribute('role','tab'); b.setAttribute('aria-selected',t===tab);
    b.textContent=`Tab ${t+1} (${t*PER+1}–${Math.min((t+1)*PER,DATA.length)})`;
    b.onclick=()=>{tab=t;render();window.scrollTo({top:0})};
    tabsEl.appendChild(b);
  }
}
document.addEventListener('click',e=>{if(!e.target.closest('.v1'))hideTip()});
window.addEventListener('scroll',hideTip,{passive:true});
document.getElementById('flipAll').onclick=()=>{
  const cs=[...grid.children],on=cs.every(c=>c.classList.contains('flipped'));
  cs.forEach(c=>c.classList.toggle('flipped',!on));
};

/* ---- Speech: pick the clearest English voice available ---- */
function score(v){
  const n=v.name.toLowerCase(); let s=0;
  if(/natural|neural|online|enhanced|premium/.test(n)) s+=12;
  if(/en[-_]us/i.test(v.lang)) s+=4; else if(/en[-_]gb/i.test(v.lang)) s+=3;
  if(/google us english|google uk english|samantha|ava|allison|aria|jenny|guy|ryan|daniel|serena|libby/.test(n)) s+=5;
  if(/espeak|compact|novelty|bad news|whisper|bells|boing|cellos|zarvox/.test(n)) s-=15;
  if(v.localService===false) s+=1;
  return s;
}
function pickVoice(){
  voices=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  voices.sort((a,b)=>score(b)-score(a));
  const sel=document.getElementById('voice'); sel.innerHTML='';
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
  chosen=voices[0]||null;
  document.getElementById('vnote').textContent=chosen?'':'No English voice found on this device.';
}
document.getElementById('voice').onchange=e=>{chosen=voices[+e.target.value]};
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let active=null;
function speak(text,btn){
  if(!window.speechSynthesis){alert('This browser does not support speech.');return}
  speechSynthesis.cancel(); if(active)active.classList.remove('on');
  const u=new SpeechSynthesisUtterance(text);
  u.lang=chosen?chosen.lang:'en-US'; if(chosen)u.voice=chosen; u.rate=0.9;
  btn.classList.add('on'); active=btn;
  u.onend=u.onerror=()=>btn.classList.remove('on');
  speechSynthesis.speak(u);
}
render();
</script>
