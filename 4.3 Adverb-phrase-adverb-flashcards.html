<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Adverb Phrase (Adverb) Flashcards</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf8ff;--tx:#3b3550}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun',sans-serif;padding:16px}
h1{font:700 20px Calibri,'Sarabun',sans-serif;text-align:center;margin:4px 0 2px}
.sub{text-align:center;font:15px 'Times New Roman',serif;color:#7a7390;margin-bottom:12px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;border-radius:20px;padding:8px 16px;background:#ece6f7;font:700 14px 'Sarabun';cursor:pointer;color:var(--tx)}
.tabs button.on{background:#b9a6e8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:0 auto}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{perspective:800px;height:190px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 8px #0001}
.back{transform:rotateY(180deg)}
.emo{font-size:40px}
.w{font:700 16px Calibri,sans-serif;margin:4px 0}
.ipa{font:14px 'Times New Roman',serif;color:#5d5675}
.th{font:700 15px 'Sarabun'}
.s{font:14px Calibri,sans-serif;margin:4px 0}
.st{font:13px 'Sarabun';color:#5d5675}
.r{color:#9b1c1c;font-weight:700}.g{color:#14532d}
.sp{border:0;background:#fff9;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;margin-top:4px}
table{border-collapse:collapse;max-width:760px;width:100%;margin:22px auto 0;background:#fff;border-radius:12px;overflow:hidden;font:14px Calibri,'Sarabun',sans-serif}
td,th{padding:7px 9px;border-bottom:1px solid #eee;text-align:left}th{background:#ece6f7}
td.t{font-family:'Sarabun'}
.wrap{overflow-x:auto;max-width:760px;margin:0 auto}
</style></head><body>
<h1>Adverb Phrase to describe an Adverb</h1><div class="sub">Click a card to flip • 🔊 to listen</div>
<div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="wrap"><table id="tb"></table></div>
<script>
const C=[["With + Noun 💬", "#fde2e4", [["beautifully with incredible *ease*", "/ˈbjuːtɪfəli wɪð ɪnˈkredəbl iːz/", "ไพเราะด้วยความง่ายดายอย่างเหลือเชื่อ", "She sings beautifully with incredible ease.", "เธอร้องเพลงไพเราะอย่างง่ายดายเหลือเชื่อ", "🎤"], ["quickly with great *confidence*", "/ˈkwɪkli wɪð ɡreɪt ˈkɒnfɪdəns/", "อย่างรวดเร็วด้วยความมั่นใจสูง", "He responded quickly with great confidence.", "เขาตอบอย่างรวดเร็วและมั่นใจมาก", "💨"], ["sweetly with genuine *warmth*", "/ˈswiːtli wɪð ˈdʒenjuɪn wɔːmθ/", "อย่างหวานด้วยความอบอุ่นจริงใจ", "She smiled sweetly with genuine warmth.", "เธอยิ้มหวานด้วยความอบอุ่นจริงใจ", "😊"], ["slowly with deliberate *movements*", "/ˈsləʊli wɪð dɪˈlɪbərət ˈmuːvmənts/", "ช้าๆ ด้วยท่าทางที่จงใจ", "He eats slowly with deliberate movements.", "เขากินช้าๆ ด้วยท่าทางที่ตั้งใจ", "🍽️"], ["neatly with consistent *spacing*", "/ˈniːtli wɪð kənˈsɪstənt ˈspeɪsɪŋ/", "เรียบร้อยด้วยระยะห่างสม่ำเสมอ", "She writes neatly with consistent spacing.", "เธอเขียนเรียบร้อยด้วยระยะห่างสม่ำเสมอ", "✍️"], ["rapidly with amazing *accuracy*", "/ˈræpɪdli wɪð əˈmeɪzɪŋ ˈækjərəsi/", "อย่างรวดเร็วด้วยความแม่นยำน่าทึ่ง", "She typed rapidly with amazing accuracy.", "เธอพิมพ์เร็วและแม่นยำน่าทึ่ง", "⌨️"], ["loudly with pure *joy*", "/ˈlaʊdli wɪð pjʊə dʒɔɪ/", "เสียงดังด้วยความสุขล้วนๆ", "They sang loudly with pure joy.", "พวกเขาร้องเพลงเสียงดังด้วยความสุขล้วนๆ", "🎉"], ["angrily with a tone of *frustration*", "/ˈæŋɡrɪli wɪð ə təʊn əv frʌˈstreɪʃn/", "อย่างโกรธด้วยน้ำเสียงหงุดหงิด", "He replied angrily with a tone of frustration.", "เขาตอบอย่างโกรธด้วยน้ำเสียงหงุดหงิด", "😤"], ["enthusiastically with bright *smiles*", "/ɪnˌθjuːziˈæstɪkli wɪð braɪt smaɪlz/", "อย่างกระตือรือร้นด้วยรอยยิ้มสดใส", "They applauded enthusiastically with bright smiles.", "พวกเขาปรบมือกระตือรือร้นพร้อมรอยยิ้มสดใส", "👏"], ["briskly with a sense of *purpose*", "/ˈbrɪskli wɪð ə sens əv ˈpɜːpəs/", "เร็วว่องไวอย่างมีเป้าหมาย", "He walked briskly with a sense of purpose.", "เขาเดินเร็วอย่างมีเป้าหมาย", "🚶"], ["warmly with motherly *affection*", "/ˈwɔːmli wɪð ˈmʌðəli əˈfekʃn/", "อย่างอบอุ่นด้วยความรักแบบแม่", "She smiled warmly with motherly affection.", "เธอยิ้มอย่างอบอุ่นด้วยความรักแบบแม่", "🤱"], ["quickly with amazing *efficiency*", "/ˈkwɪkli wɪð əˈmeɪzɪŋ ɪˈfɪʃnsi/", "อย่างรวดเร็วด้วยประสิทธิภาพน่าทึ่ง", "She cleaned quickly with amazing efficiency.", "เธอทำความสะอาดเร็วและมีประสิทธิภาพน่าทึ่ง", "🧹"]]], ["Like + Noun 🔍", "#dff3e4", [["swiftly like a trained *athlete*", "/ˈswɪftli laɪk ə treɪnd ˈæθliːt/", "อย่างรวดเร็วเหมือนนักกีฬาฝึกมา", "He runs swiftly like a trained athlete.", "เขาวิ่งรวดเร็วเหมือนนักกีฬาที่ผ่านการฝึก", "🏃"], ["gracefully like a professional *ballerina*", "/ˈɡreɪsfəli laɪk ə prəˈfeʃnəl ˌbæləˈriːnə/", "อย่างสง่างามเหมือนนักบัลเลต์มืออาชีพ", "She danced gracefully like a professional ballerina.", "เธอเต้นอย่างสง่างามเหมือนนักบัลเลต์มืออาชีพ", "🩰"], ["softly like a gentle *breeze*", "/ˈsɒftli laɪk ə ˈdʒentl briːz/", "เบาๆ เหมือนสายลมอ่อน", "She whispered softly like a gentle breeze.", "เธอกระซิบเบาๆ เหมือนสายลมอ่อน", "🍃"], ["quickly like a seasoned *expert*", "/ˈkwɪkli laɪk ə ˈsiːznd ˈekspɜːt/", "อย่างรวดเร็วเหมือนผู้เชี่ยวชาญเก๋า", "He solved the puzzle quickly like a seasoned expert.", "เขาแก้ปริศนาเร็วเหมือนผู้เชี่ยวชาญตัวจริง", "🧠"], ["nervously like *someone* unsure of himself", "/ˈnɜːvəsli laɪk ˈsʌmwʌn ʌnˈʃɔːr əv hɪmˈself/", "อย่างประหม่าเหมือนคนไม่มั่นใจในตัวเอง", "He blinked nervously like someone unsure of himself.", "เขากะพริบตาอย่างประหม่าเหมือนคนไม่มั่นใจ", "👀"], ["stealthily like *shadows* in the night", "/ˈstelθɪli laɪk ˈʃædəʊz ɪn ðə naɪt/", "อย่างลับๆ เหมือนเงาในยามค่ำคืน", "They moved stealthily like shadows in the night.", "พวกเขาเคลื่อนไหวอย่างลับๆ เหมือนเงาในยามค่ำคืน", "🥷"], ["gracefully like a *deer* across a field", "/ˈɡreɪsfəli laɪk ə dɪə əˈkrɒs ə fiːld/", "อย่างสง่างามเหมือนกวางข้ามทุ่ง", "She ran gracefully like a deer across a field.", "เธอวิ่งสง่างามเหมือนกวางข้ามทุ่ง", "🦌"], ["excitedly like a *kid* on Christmas morning", "/ɪkˈsaɪtɪdli laɪk ə kɪd ɒn ˈkrɪsməs ˈmɔːnɪŋ/", "อย่างตื่นเต้นเหมือนเด็กในเช้าวันคริสต์มาส", "He jumped excitedly like a kid on Christmas morning.", "เขากระโดดตื่นเต้นเหมือนเด็กในเช้าวันคริสต์มาส", "🎄"], ["quietly like a *cat* in the dark", "/ˈkwaɪətli laɪk ə kæt ɪn ðə dɑːk/", "อย่างเงียบเหมือนแมวในความมืด", "He moved quietly like a cat in the dark.", "เขาเคลื่อนไหวเงียบเหมือนแมวในความมืด", "🐈‍⬛"], ["softly like a *lullaby* in the wind", "/ˈsɒftli laɪk ə ˈlʌləbaɪ ɪn ðə wɪnd/", "เบาๆ เหมือนเพลงกล่อมเด็กในสายลม", "She sang softly like a lullaby in the wind.", "เธอร้องเบาๆ เหมือนเพลงกล่อมเด็กในสายลม", "🌬️"], ["slowly like *someone* in pain", "/ˈsləʊli laɪk ˈsʌmwʌn ɪn peɪn/", "ช้าๆ เหมือนคนที่เจ็บปวด", "She moved slowly like someone in pain.", "เธอเคลื่อนไหวช้าๆ เหมือนคนที่เจ็บปวด", "🤕"], ["quickly like their *lives* depended on it", "/ˈkwɪkli laɪk ðeə laɪvz dɪˈpendɪd ɒn ɪt/", "อย่างรวดเร็วเหมือนชีวิตขึ้นอยู่กับมัน", "They ran quickly like their lives depended on it.", "พวกเขาวิ่งเร็วเหมือนเอาชีวิตเป็นเดิมพัน", "💥"]]], ["Without / Under 🌗", "#dcebfb", [["loudly without *hesitation*", "/ˈlaʊdli wɪðˈaʊt ˌhezɪˈteɪʃn/", "เสียงดังโดยไม่ลังเล", "They spoke loudly without hesitation.", "พวกเขาพูดเสียงดังโดยไม่ลังเล", "📣"], ["quietly without drawing any *attention*", "/ˈkwaɪətli wɪðˈaʊt ˈdrɔːɪŋ ˈeni əˈtenʃn/", "เงียบๆ โดยไม่เรียกความสนใจ", "He worked quietly without drawing any attention.", "เขาทำงานเงียบๆ โดยไม่เรียกความสนใจ", "🤫"], ["quickly without saying *goodbye*", "/ˈkwɪkli wɪðˈaʊt ˈseɪɪŋ ɡʊdˈbaɪ/", "อย่างรวดเร็วโดยไม่บอกลา", "They left quickly without saying goodbye.", "พวกเขาจากไปอย่างรวดเร็วโดยไม่บอกลา", "👋"], ["calmly under *pressure*", "/ˈkɑːmli ˈʌndə ˈpreʃə/", "อย่างสงบภายใต้แรงกดดัน", "She reacted calmly under pressure.", "เธอรับมืออย่างสงบภายใต้แรงกดดัน", "😌"], ["calmly despite the *chaos* around them", "/ˈkɑːmli dɪˈspaɪt ðə ˈkeɪɒs əˈraʊnd ðem/", "อย่างสงบแม้ความโกลาหลรอบตัว", "They responded calmly despite the chaos around them.", "พวกเขาตอบสนองอย่างสงบแม้ความวุ่นวายรอบตัว", "🌪️"], ["carefully with both *hands* on the wheel", "/ˈkeəfəli wɪð bəʊθ hændz ɒn ðə wiːl/", "อย่างระมัดระวังโดยมือสองข้างจับพวงมาลัย", "She drove carefully with both hands on the wheel.", "เธอขับรถอย่างระมัดระวังโดยจับพวงมาลัยสองมือ", "🚗"], ["foolishly without thinking of the *consequences*", "/ˈfuːlɪʃli wɪðˈaʊt ˈθɪŋkɪŋ əv ðə ˈkɒnsɪkwənsɪz/", "อย่างโง่เขลาโดยไม่คิดถึงผลที่ตามมา", "He acted foolishly without thinking of the consequences.", "เขาทำอย่างโง่เขลาโดยไม่คิดถึงผลที่ตามมา", "🤡"], ["patiently with *hope* in his heart", "/ˈpeɪʃntli wɪð həʊp ɪn hɪz hɑːt/", "อย่างอดทนด้วยความหวังในใจ", "He waited patiently with hope in his heart.", "เขารออย่างอดทนด้วยความหวังในใจ", "⏳"], ["silently through the *night*", "/ˈsaɪləntli θruː ðə naɪt/", "อย่างเงียบงันตลอดทั้งคืน", "She worked silently through the night.", "เธอทำงานเงียบๆ ตลอดทั้งคืน", "🌙"], ["cautiously on the icy *pavement*", "/ˈkɔːʃəsli ɒn ði ˈaɪsi ˈpeɪvmənt/", "อย่างระวังบนทางเท้าที่เป็นน้ำแข็ง", "He walked cautiously on the icy pavement.", "เขาเดินอย่างระวังบนทางเท้าที่เป็นน้ำแข็ง", "🧊"], ["quietly from a *distance*", "/ˈkwaɪətli frɒm ə ˈdɪstəns/", "อย่างเงียบๆ จากระยะไกล", "They watched quietly from a distance.", "พวกเขามองอย่างเงียบๆ จากระยะไกล", "🔭"], ["respectfully through the entire *speech*", "/rɪˈspektfəli θruː ði enˈtaɪə spiːtʃ/", "อย่างเคารพตลอดทั้งสุนทรพจน์", "They listened respectfully through the entire speech.", "พวกเขาฟังอย่างเคารพตลอดทั้งสุนทรพจน์", "🎙️"]]]];
let V=null;
function voice(){const a=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));return a.find(v=>/natural|google|online|premium|enhanced/i.test(v.name))||a[0]||null}
function say(t,e){e&&e.stopPropagation();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}
const plain=p=>p.replace(/\*/g,''),hl=p=>p.replace(/\*(.+?)\*/,'<span class=g>$1</span>');
const sent=r=>r[3].replace(plain(r[0]),'<b class=r>'+hl(r[0])+'</b>');
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),tb=document.getElementById('tb');
function show(i){
 [...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));
 const [,col,rows]=C[i];grid.innerHTML='';
 rows.forEach((r,k)=>{const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class=in><div class=face style="background:${col}"><div class=emo>${r[5]}</div><div class=w>${hl(r[0])}</div><div class=ipa>${r[1]}</div><button class=sp>🔊</button></div><div class="face back" style="background:#fff8e1"><div class=th>${r[2]}</div><div class=s>${sent(r)}</div><div class=st>${r[4]}</div><button class=sp>🔊</button></div></div>`;
  d.onclick=()=>d.classList.toggle('f');
  d.querySelectorAll('.sp')[0].onclick=e=>say(plain(r[0]),e);
  d.querySelectorAll('.sp')[1].onclick=e=>say(r[3],e);
  grid.appendChild(d)});
 tb.innerHTML='<tr><th>#</th><th>Vocabulary</th><th>ไทย</th><th>Sentence</th><th>🔊</th></tr>';
 rows.forEach((r,k)=>{const tr=tb.insertRow();tr.innerHTML=`<td>${k+1}</td><td>${hl(r[0])}<br><span class=ipa>${r[1]}</span></td><td class=t>${r[2]}</td><td>${sent(r)}<br><span class=st>${r[4]}</span></td><td><button class=sp>🔊</button></td>`;tr.querySelector('.sp').onclick=e=>say(r[3],e)});
}
C.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c[0];b.onclick=()=>show(i);tabs.appendChild(b)});
speechSynthesis.onvoiceschanged=()=>{};show(0);
</script></body></html>
