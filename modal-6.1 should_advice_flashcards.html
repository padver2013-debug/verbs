html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}

.bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{max-width:1100px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.flip{perspective:1200px;cursor:pointer;min-height:300px;outline:none}
.flip:focus-visible .inner{box-shadow:0 0 0 3px var(--accent)}
.inner{position:relative;width:100%;height:100%;min-height:300px;transition:transform .55s;transform-style:preserve-3d;border-radius:14px}
.flip.turned .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.back{transform:rotateY(180deg);background:#f3f7ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{background:#e8effa}}
.no{position:absolute;top:8px;left:12px;font-size:12px;color:#6b7280}
.pic{font-size:clamp(48px,9vw,84px);line-height:1;margin:6px 0 10px}
.en{font-family:Arial,Helvetica,sans-serif;font-weight:300;color:#000;font-size:clamp(15px,2.3vw,22px);line-height:1.35;margin:0 0 8px}
.en b{font-weight:700;color:var(--verb)}
.en mark{background:var(--mark);color:#000;font-weight:700;padding:0 3px;border-radius:3px}
.ipa{font-family:"Times New Roman",Times,serif;color:#222;font-size:clamp(13px,2vw,18px);line-height:1.4;margin:0 0 10px}
.th{font-size:clamp(17px,2.6vw,24px);line-height:1.6;color:#000;margin:0 0 10px}
.enSmall{font-family:Arial,sans-serif;font-weight:300;font-size:14px;color:#444}
.enSmall b{font-weight:700;color:var(--verb)}
.say{position:absolute;right:10px;top:8px;border:1px solid #c2c9d4;background:#fff;color:#000;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.say:hover{background:#eef3fb}
.say.playing{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{font-size:11px;color:#6b7280;margin-top:auto}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>

const PER=50, pages=Math.ceil(D.length/PER);
let page=0, voices=[], chosen=null;
const grid=document.getElementById('grid'), pager=document.getElementById('pager');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function html(en,verb){
  const i=en.indexOf(' should '), pre=esc(en.slice(0,i)), rest=en.slice(i+8);
  const body=rest.startsWith(verb)?'<b>'+esc(verb)+'</b>'+esc(rest.slice(verb.length)):esc(rest);
  return {front:pre+' <mark>should</mark> '+body, back:pre+' <b>should</b> '+body};
}
function render(){
  grid.innerHTML='';
  const start=page*PER, items=D.slice(start,start+PER);
  items.forEach((r,i)=>{
    const [en,verb,ipa,pic,th]=r, h=html(en,verb);
    const el=document.createElement('div');
    el.className='flip'; el.tabIndex=0; el.setAttribute('role','button');
    el.setAttribute('aria-label','Flip card '+(start+i+1));
    el.innerHTML=`<div class="inner">
      <div class="face front"><span class="no">${start+i+1}</span>
        <button class="say" type="button" aria-label="Read aloud">🔊 อ่าน</button>
        <div class="pic" aria-hidden="true">${pic}</div>
        <p class="en">${h.front}</p>
        <p class="ipa">${esc(ipa)}</p>
        <span class="hint">คลิกเพื่อดูคำแปล</span></div>
      <div class="face back"><span class="no">${start+i+1}</span>
        <p class="th">${esc(th)}</p>
        <p class="enSmall">${h.back}</p>
        <span class="hint">คลิกเพื่อกลับด้านหน้า</span></div></div>`;
    const btn=el.querySelector('.say');
    btn.addEventListener('click',e=>{e.stopPropagation();speak(en,btn);});
    el.addEventListener('click',()=>el.classList.toggle('turned'));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.classList.toggle('turned');}});
    grid.appendChild(el);
  });
  pager.innerHTML='';
  for(let p=0;p<pages;p++){
    const b=document.createElement('button');
    const a=p*PER+1,z=Math.min((p+1)*PER,D.length);
    b.textContent=`หน้า ${p+1} (${a}–${z})`; if(p===page)b.className='on';
    b.onclick=()=>{page=p;render();window.scrollTo({top:0});};
    pager.appendChild(b);
  }
}

/* ---------- Voice: prefer UK male ---------- */
const FEMALE=/female|woman|susan|hazel|kate|serena|libby|sonia|maisie|fiona|moira|karen|samantha|victoria|zira|helen|catherine|amy|emma|joanna|olivia/i;
const MALE_PREF=['Google UK English Male','Daniel','Microsoft George','Microsoft Ryan','Ryan','George','Oliver','Arthur','Thomas','Rishi','Microsoft Thomas'];
function score(v){
  let s=0;
  if(/^en[-_]GB/i.test(v.lang))s+=50; else if(/^en/i.test(v.lang))s+=10;
  const i=MALE_PREF.findIndex(n=>v.name.includes(n)); if(i>=0)s+=40-i;
  if(/male/i.test(v.name)&&!/female/i.test(v.name))s+=30;
  if(/natural|neural|online/i.test(v.name))s+=8;
  if(FEMALE.test(v.name))s-=60;
  return s;
}
function loadVoices(){
  voices=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  voices.sort((a,b)=>score(b)-score(a));
  const sel=document.getElementById('voiceSel'); sel.innerHTML='';
  if(!voices.length){sel.innerHTML='<option>ไม่พบเสียงภาษาอังกฤษในอุปกรณ์</option>';return;}
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${v.name} (${v.lang})`;sel.appendChild(o);});
  chosen=voices[0];
}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
document.getElementById('voiceSel').onchange=e=>{chosen=voices[+e.target.value];};

let playing=null;
function speak(text,btn){
  if(!window.speechSynthesis){alert('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');return;}
  speechSynthesis.cancel();
  if(playing)playing.classList.remove('playing');
  const u=new SpeechSynthesisUtterance(text);
  if(chosen){u.voice=chosen;u.lang=chosen.lang;}else u.lang='en-GB';
  u.rate=parseFloat(document.getElementById('rate').value);
  u.pitch=0.9;
  btn.classList.add('playing');playing=btn;
  u.onend=u.onerror=()=>btn.classList.remove('playing');
  speechSynthesis.speak(u);
}
document.getElementById('flipAll').onclick=()=>{
  const cards=[...document.querySelectorAll('.flip')];
  const anyFront=cards.some(c=>!c.classList.contains('turned'));
  cards.forEach(c=>c.classList.toggle('turned',anyFront));
};
render();
</script>
