function sp(o){const l=o.e.toLowerCase(),x=l.indexOf(o.c.toLowerCase()),y=l.indexOf(" to "+o.v.toLowerCase(),x);return x<0||y<0?null:{x,y,ob:o.e.slice(x+o.c.length,y)}}
function hl(o){const s=sp(o);if(!s)return o.e;return o.e.slice(0,s.x)+`<mark><span class="mv">${o.e.substr(s.x,o.c.length)}</span><span class="ob">${s.ob}</span> to <span class="v1" data-t="${o.vt}">${o.v}</span></mark>`+o.e.slice(s.y+4+o.v.length)}

const NT={advis:"แนะนำให้ (ใคร) ทำ",ask:"ขอให้ (ใคร) ทำ",encourag:"สนับสนุน/ให้กำลังใจให้ (ใคร) ทำ",invit:"เชิญ/ชวน (ใคร) ให้ทำ",persuad:"โน้มน้าวให้ (ใคร) ทำ",remind:"เตือนให้ (ใคร) ทำ",told:"บอกให้ (ใคร) ทำ",warn:"เตือนให้ (ใคร) ระวัง/ทำ",expect:"คาดหวังให้ (ใคร) ทำ",allow:"อนุญาตให้ (ใคร) ทำ",order:"สั่งให้ (ใคร) ทำ",forc:"บังคับให้ (ใคร) ทำ"};

let voice=null;function pick(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
const pref=[/natural/i,/google us english/i,/aria|jenny|guy/i,/samantha|ava|allison/i,/google/i,/en[-_]US/i];
for(const p of pref){const f=vs.find(v=>p.test(v.name)||p.test(v.lang));if(f){voice=f;return}}voice=vs[0]||null}
if("speechSynthesis"in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,ev){ev.stopPropagation();if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}
