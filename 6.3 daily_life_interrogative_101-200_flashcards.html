const DATA = RAW.map(line=>{
  const [en,ipa,th,emo] = line.split("|");
  const plain = en.replace(/[{}]/g,"");
  const html = en.replace(/\{([^}]+)\}/g,"<b>$1</b>");
  const pics = Array.from(emo.trim().matchAll(/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu)).map(m=>m[0]);
  return {plain,html,ipa,th,pics};
});

const PER_PAGE = 50;
const OFFSET = 100;
const PAGES = Math.ceil(DATA.length/PER_PAGE);
let page = 0;

const grid = document.getElementById("grid");
const tabs = document.getElementById("tabs");
const pager = document.getElementById("pager");
const voiceSel = document.getElementById("voice");
const hint = document.getElementById("hint");

/* ---------- Speech ---------- */
let voices = [];
const MALE_HINTS = ["ryan","google uk english male","daniel","george","arthur","oliver","thomas","james","male"];
const FEMALE_HINTS = ["female","susan","hazel","libby","sonia","kate","serena","martha","amy","emma","samantha","karen","moira","fiona","victoria"];
function rankVoice(v){
  const n = v.name.toLowerCase(); let s = 0;
  if (/^en[-_]gb/i.test(v.lang)) s += 50; else if (/^en/i.test(v.lang)) s += 10;
  const mi = MALE_HINTS.findIndex(h=>n.includes(h));
  if (mi>=0) s += 40 - mi;
  if (FEMALE_HINTS.some(h=>n.includes(h))) s -= 60;
  if (/natural|online|neural/.test(n)) s += 15;
  return s;
}
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  voices.sort((a,b)=>rankVoice(b)-rankVoice(a));
  voiceSel.innerHTML = "";
  voices.forEach((v,i)=>{ const o=document.createElement("option"); o.value=i; o.textContent=v.name+" ("+v.lang+")"; voiceSel.appendChild(o); });
  if(!voices.length){ hint.textContent="อุปกรณ์นี้ยังไม่มีเสียงภาษาอังกฤษให้เลือก — ลองเปิดด้วย Chrome / Edge / Safari"; }
  else if(rankVoice(voices[0])<60){ hint.textContent="ไม่พบเสียงผู้ชายอังกฤษ (UK) บนอุปกรณ์นี้ — เลือกเสียงอื่นจากเมนู “เสียงอ่าน” ได้"; }
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let activeBtn = null;
function speak(text, btn){
  if(!("speechSynthesis" in window)) return;
  const same = activeBtn===btn && speechSynthesis.speaking;
  speechSynthesis.cancel();
  if(activeBtn){ activeBtn.classList.remove("on"); activeBtn=null; }
  if(same) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = voices[+voiceSel.value||0];
  if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-GB";
  u.rate = 0.88; u.pitch = 0.9;
  u.onend = u.onerror = ()=>{ btn.classList.remove("on"); if(activeBtn===btn) activeBtn=null; };
  btn.classList.add("on"); activeBtn = btn;
  speechSynthesis.speak(u);
}

/* ---------- Render ---------- */
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function makeCard(item, idx){
  const card = el("div","card"); card.tabIndex=0; card.setAttribute("role","button");
  card.setAttribute("aria-label","การ์ดที่ "+(idx+1+OFFSET)+" กดเพื่อพลิก");
  const inner = el("div","inner");

  const front = el("div","face front");
  const pic = el("div","pic");
  pic.appendChild(el("span","num", String(idx+1+OFFSET)));
  item.pics.slice(0,2).forEach(p=>pic.appendChild(el("span","",p)));
  const text = el("div","text");
  text.appendChild(el("p","en",item.html));
  text.appendChild(el("p","ipa","/"+item.ipa+"/"));
  const foot = el("div","foot");
  foot.appendChild(el("span","tap","แตะการ์ดเพื่อดูคำแปล"));
  const sb = el("button","say",ICON+"ฟังเสียง"); sb.type="button";
  sb.addEventListener("click",e=>{e.stopPropagation(); speak(item.plain,sb);});
  foot.appendChild(sb);
  front.append(pic,text,foot);

  const back = el("div","face back");
  back.appendChild(el("div","th",item.th));
  const bfoot = el("div","foot");
  bfoot.appendChild(el("span","tap","แตะเพื่อกลับไปด้านหน้า"));
  const sb2 = el("button","say",ICON+"ฟังเสียง"); sb2.type="button";
  sb2.addEventListener("click",e=>{e.stopPropagation(); speak(item.plain,sb2);});
  bfoot.appendChild(sb2);
  back.appendChild(bfoot);

  inner.append(front,back); card.appendChild(inner);
  const flip = ()=>card.classList.toggle("flipped");
  card.addEventListener("click",flip);
  card.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target===card){ e.preventDefault(); flip(); }});
  return card;
}

function render(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  grid.innerHTML="";
  const start = page*PER_PAGE;
  DATA.slice(start,start+PER_PAGE).forEach((it,i)=>grid.appendChild(makeCard(it,start+i)));
  [...tabs.children].forEach((b,i)=>b.setAttribute("aria-selected",i===page));
  window.scrollTo({top:0,behavior:"auto"});
}
function goto(p){ page=p; render(); }

for(let p=0;p<PAGES;p++){
  const a = p*PER_PAGE+1+OFFSET, b = Math.min((p+1)*PER_PAGE, DATA.length)+OFFSET;
  const t = el("button","tab","หน้า "+(p+1)+" · "+a+"–"+b); t.setAttribute("role","tab");
  t.addEventListener("click",()=>goto(p)); tabs.appendChild(t);
  const pb = el("button","","หน้า "+(p+1)); pb.addEventListener("click",()=>goto(p)); pager.appendChild(pb);
}
render();
</script>
</body>
</html>
