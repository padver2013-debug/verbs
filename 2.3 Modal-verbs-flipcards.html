#Modal Phrases

might want to reconsider|maɪt wɒnt tə ˌriːkənˈsɪdə|🔄|น่าจะทบทวน|You might want to reconsider that decision.|คุณน่าจะทบทวนการตัดสินใจนั้นอีกครั้ง
may need|meɪ niːd|🙋‍♀️|อาจจะต้องการ|He may need your help to solve the issue.|เขาอาจจะต้องการความช่วยเหลือจากคุณเพื่อแก้ปัญหา
might be able to come|maɪt bi ˈeɪbl tə kʌm|🎈|อาจจะมาได้|She might be able to come to the event after all.|เธออาจจะมางานได้ก็ได้

may not be able to attend|meɪ nɒt bi ˈeɪbl tu əˈtend|📆|อาจจะเข้าร่วมไม่ได้|They may not be able to attend due to a scheduling conflict.|พวกเขาอาจจะเข้าร่วมไม่ได้เพราะตารางงานชนกัน
should probably call|ʃʊd ˈprɒbəbli kɔːl|☎️|น่าจะโทรไปก่อน|We should probably call ahead to make reservations.|เราน่าจะโทรไปจองล่วงหน้า
should focus|ʃʊd ˈfəʊkəs|🎯|ควรโฟกัส|We should focus on one task at a time for better efficiency.|เราควรโฟกัสทีละงานเพื่อประสิทธิภาพที่ดีกว่า
should plan|ʃʊd plæn|🌴|ควรวางแผน|We should plan a vacation for next summer.|เราควรวางแผนไปพักร้อนในหน้าร้อนปีหน้า
might want to check|maɪt wɒnt tə tʃek|📬|น่าจะตรวจ|You might want to check your email for the latest updates.|คุณน่าจะเช็กอีเมลเพื่อดูข้อมูลล่าสุด
might want to double-check|maɪt wɒnt tə ˌdʌbl ˈtʃek|📆|น่าจะตรวจซ้ำ|You might want to double-check the dates before confirming.|คุณน่าจะตรวจสอบวันที่ซ้ำก่อนยืนยัน
might want to get|maɪt wɒnt tə ɡet|🧑‍⚕️|น่าจะขอ|You might want to get a second opinion on that idea.|คุณน่าจะขอความเห็นที่สองเกี่ยวกับไอเดียนั้น
should definitely try|ʃʊd ˈdefɪnətli traɪ|☕|ควรลองแน่ๆ|We should definitely try that new café next time.|ครั้งหน้าเราควรลองคาเฟ่ใหม่นั้นแน่ๆ`;
const PAL=['#fde2e4','#e2f0cb','#d6e6ff','#fff1c9','#e8dcf7','#d4f1ec'];
const cats=[];let cur;
RAW.split('\n').forEach(l=>{if(l[0]=='#'){cur={n:l.slice(1),r:[]};cats.push(cur)}else{const a=l.split('|');cur.r.push({p:a[0],i:a[1],e:a[2],t:a[3],s:a[4],ts:a[5]})}});
const tabs=[];cats.forEach(c=>{for(let k=0;k<c.r.length;k+=25)tabs.push({n:c.n,r:c.r.slice(k,k+25)})});
let voice;
function pick(){try{const v=speechSynthesis.getVoices(),g=v.filter(x=>/en[-_]GB/i.test(x.lang));voice=g.find(x=>/natural|online|google|sonia|libby|serena|daniel/i.test(x.name))||g[0]||v.find(x=>/^en/i.test(x.lang))}catch(e){}}
try{speechSynthesis.onvoiceschanged=pick;pick()}catch(e){}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-GB';u.rate=r;speechSynthesis.speak(u)}catch(e){}}
const hl=p=>{const w=p.split(' '),l=w.pop();return (w.length?`<span class="d">${w.join(' ')}</span> `:'')+`<span class="n">${l}</span>`};
let T=0;
function show(i){T=i;
document.getElementById('tabs').innerHTML=tabs.map((t,k)=>`<button class="${k==i?'on':''}" onclick="show(${k})">${t.n} (${t.r.length})</button>`).join('');
const R=tabs[i].r;
document.getElementById('grid').innerHTML=R.map((x,k)=>`<div class="c" onclick="this.classList.toggle('f')"><div class="in">
<div class="s" style="background:${PAL[k%6]}"><div class="em">${x.e}</div><div class="p">${hl(x.p)}</div><div class="ipa">/${x.i}/</div><button class="sp" data-w="${k}" aria-label="Play word">🔊</button></div>
<div class="s b" style="background:${PAL[(k+3)%6]}"><div class="lab">Modal Verbs (optional)</div><div class="lab2">Modal Verbs (optional) in English Sentences</div><div class="th">${x.t}</div><div class="se">${x.s}</div><div class="st">${x.ts}</div><button class="sp" data-s="${k}" aria-label="Play sentence">🔊</button></div>
</div></div>`).join('');
document.getElementById('tb').innerHTML=R.map((x,k)=>`<tr><td>${k+1}</td><td><b>${hl(x.p)}</b></td><td class="i">/${x.i}/</td><td class="t">${x.t}</td><td>${x.s}<div class="tp">${x.ts}</div></td><td><button class="sp" data-s="${k}" aria-label="Play sentence">🔊</button></td></tr>`).join('');fit()}
document.addEventListener('click',e=>{const b=e.target.closest('.sp');if(!b)return;e.stopPropagation();const R=tabs[T].r;
if(b.dataset.w!=null)say(R[b.dataset.w].p,.8);else say(R[b.dataset.s].s,.9)},true);
function fit(){document.querySelectorAll('.s').forEach(f=>{let k=1;f.style.setProperty('--k',1);const H=()=>[...f.children].reduce((a,c)=>a+c.offsetHeight+3,0)+14;while(H()>f.clientHeight-6&&k>.5){k-=.04;f.style.setProperty('--k',k.toFixed(2))}})}
addEventListener('resize',fit);try{document.fonts.ready.then(fit)}catch(e){}
show(0);
