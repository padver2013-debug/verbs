<script>

didn’t attend|ˈdɪdnt əˈtend|📅|ไม่ได้เข้าร่วม|She didn’t attend the meeting yesterday.|เธอไม่ได้เข้าร่วมประชุมเมื่อวาน

didn’t understand|ˈdɪdnt ˌʌndəˈstænd|❓|ไม่เข้าใจ|I didn’t understand what you meant by that.|ฉันไม่เข้าใจสิ่งที่คุณหมายถึง

didn’t follow|ˈdɪdnt ˈfɒləʊ|📋|ไม่ได้ทำตาม|They didn’t follow the instructions correctly.|พวกเขาไม่ได้ทำตามคำแนะนำอย่างถูกต้อง

#Isn’t / Aren’t

aren’t sure|ɑːnt ʃɔː|🤔|ไม่แน่ใจ|We aren’t sure if we can make it on time.|เราไม่แน่ใจว่าจะไปทันเวลาหรือเปล่า
aren’t interested|ɑːnt ˈɪntrəstɪd|😑|ไม่สนใจ|They aren’t interested in the offer.|พวกเขาไม่สนใจข้อเสนอ
aren’t ready|ɑːnt ˈredi|⏳|ยังไม่พร้อม|They aren’t ready to make a decision yet.|พวกเขายังไม่พร้อมตัดสินใจ
aren’t allowed|ɑːnt əˈlaʊd|🅿️|ไม่ได้รับอนุญาต|We aren’t allowed to park here.|เราไม่ได้รับอนุญาตให้จอดรถที่นี่
isn’t aware|ˈɪznt əˈweə|🙈|ไม่ทราบ|He isn’t aware of the changes that were made.|เขาไม่ทราบเรื่องการเปลี่ยนแปลงที่เกิดขึ้น
isn’t feeling well|ˈɪznt ˈfiːlɪŋ wel|🤒|ไม่สบาย|She isn’t feeling well today, so she stayed home.|วันนี้เธอไม่สบายเลยอยู่บ้าน
aren’t going|ɑːnt ˈɡəʊɪŋ|🦁|ไม่ไป|We aren’t going to the zoo after all.|สุดท้ายเราไม่ได้ไปสวนสัตว์แล้ว

haven’t replied|ˈhævnt rɪˈplaɪd|📧|ยังไม่ได้ตอบ|They haven’t replied to my email yet.|พวกเขายังไม่ได้ตอบอีเมลของฉัน
haven’t received|ˈhævnt rɪˈsiːvd|📥|ยังไม่ได้รับ|I haven’t received any updates from the team.|ฉันยังไม่ได้รับข้อมูลอัปเดตจากทีมเลย
haven’t decided|ˈhævnt dɪˈsaɪdɪd|🏖️|ยังไม่ได้ตัดสินใจ|We haven’t decided on a vacation destination yet.|เรายังไม่ได้ตัดสินใจเลือกที่เที่ยว
haven’t seen|ˈhævnt siːn|🎞️|ยังไม่เคยดู|I haven’t seen that movie before.|ฉันไม่เคยดูหนังเรื่องนั้นมาก่อน
haven’t made|ˈhævnt meɪd|📉|ยังไม่ได้ทำ|They haven’t made any progress on the project yet.|พวกเขายังไม่คืบหน้าในโครงการเลย
haven’t heard|ˈhævnt hɜːd|📞|ยังไม่ได้ยิน|I haven’t heard anything from them yet.|ฉันยังไม่ได้ข่าวอะไรจากพวกเขาเลย
haven’t been to|ˈhævnt biːn tuː|🍽️|ไม่เคยไป|I haven’t been to that restaurant before.|ฉันไม่เคยไปร้านอาหารนั้นมาก่อน
haven’t been able to reach|ˈhævnt biːn ˈeɪbl tə riːtʃ|📱|ยังติดต่อไม่ได้|I haven’t been able to reach him by phone.|ฉันยังติดต่อเขาทางโทรศัพท์ไม่ได้
#Can’t
can’t find|kɑːnt faɪnd|🔑|หาไม่เจอ|He can’t find his keys anywhere.|เขาหากุญแจไม่เจอเลย
can’t afford|kɑːnt əˈfɔːd|🚗|ไม่มีปัญญาซื้อ|We can’t afford a new car right now.|ตอนนี้เราไม่มีปัญญาซื้อรถใหม่
can’t speak|kɑːnt spiːk|🇫🇷|พูดไม่ได้|He can’t speak French very well.|เขาพูดภาษาฝรั่งเศสได้ไม่ค่อยดี
can’t believe|kɑːnt bɪˈliːv|❄️|ไม่อยากเชื่อ|I can’t believe how much snow there is outside.|ฉันไม่อยากเชื่อว่าข้างนอกมีหิมะเยอะขนาดนี้
can’t make it|kɑːnt meɪk ɪt|🗓️|ไปไม่ได้|She can’t make it to the meeting this afternoon.|บ่ายนี้เธอไปประชุมไม่ได้
can’t remember|kɑːnt rɪˈmembə|📱|จำไม่ได้|He can’t remember where he left his phone.|เขาจำไม่ได้ว่าวางโทรศัพท์ไว้ที่ไหน
can’t join|kɑːnt dʒɔɪn|📋|ร่วมไม่ได้|He can’t join us; he has another appointment.|เขามาร่วมกับเราไม่ได้ เขามีนัดอื่น

can’t eat|kɑːnt iːt|🧀|กินไม่ได้|She can’t eat dairy, so she avoids cheese.|เธอกินผลิตภัณฑ์นมไม่ได้ เลยเลี่ยงชีส
#Won’t & Shouldn’t
won’t be attending|wəʊnt biː əˈtendɪŋ|🚷|จะไม่เข้าร่วม|We won’t be attending the meeting tomorrow.|พรุ่งนี้เราจะไม่เข้าร่วมประชุม
won’t be able to join|wəʊnt biː ˈeɪbl tə dʒɔɪn|🍝|จะไม่สามารถมาร่วมได้|They won’t be able to join us for dinner.|พวกเขาจะไม่สามารถมาร่วมมื้อเย็นกับเราได้
won’t finish|wəʊnt ˈfɪnɪʃ|⏰|จะไม่เสร็จ|They won’t finish the work by tomorrow.|พวกเขาจะทำงานไม่เสร็จภายในพรุ่งนี้
won’t be able to attend|wəʊnt biː ˈeɪbl tu əˈtend|💒|จะไม่สามารถเข้าร่วมได้|She won’t be able to attend the wedding.|เธอจะไม่สามารถไปงานแต่งงานได้
shouldn’t worry|ˈʃʊdnt ˈwʌri|😌|ไม่ควรกังวล|You shouldn’t worry about it too much.|คุณไม่ควรกังวลเรื่องนี้มากเกินไป
shouldn’t eat|ˈʃʊdnt iːt|🍟|ไม่ควรกิน|You shouldn’t eat too much junk food.|คุณไม่ควรกินอาหารขยะมากเกินไป

shouldn’t speak|ˈʃʊdnt spiːk|🗯️|ไม่ควรพูด|You shouldn’t speak to her like that.|คุณไม่ควรพูดกับเธอแบบนั้น

shouldn’t have eaten|ˈʃʊdnt həv ˈiːtn|🍰|ไม่น่ากิน (แต่กินไปแล้ว)|I shouldn’t have eaten so much cake.|ฉันไม่น่ากินเค้กเยอะขนาดนี้เลย`;
const PAL=['#fde2e4','#e2f0cb','#d6e6ff','#fff1c9','#e8dcf7','#d4f1ec'];
const cats=[];let cur;
RAW.split('\n').forEach(l=>{if(l[0]=='#'){cur={n:l.slice(1),r:[]};cats.push(cur)}else{const a=l.split('|');cur.r.push({p:a[0],i:a[1],e:a[2],t:a[3],s:a[4],ts:a[5]})}});
const tabs=[];cats.forEach(c=>{for(let k=0;k<c.r.length;k+=25)tabs.push({n:c.n,r:c.r.slice(k,k+25)})});
let voice;
function pick(){try{const v=speechSynthesis.getVoices(),g=v.filter(x=>/en[-_]GB/i.test(x.lang));voice=g.find(x=>/natural|online|google|sonia|libby|serena|daniel/i.test(x.name))||g[0]||v.find(x=>/^en/i.test(x.lang))}catch(e){}}
try{speechSynthesis.onvoiceschanged=pick;pick()}catch(e){}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-GB';u.rate=r;speechSynthesis.speak(u)}catch(e){}}
const hl=p=>{const w=p.split(' '),l=w.pop();return (w.length?`<span class="d">${w.join(' ')}</span> `:'')+`<span class="n">${l}</span>`};
let T=0;
function show(i){T=i;
document.getElementById('tabs').innerHTML=tabs.map((t,k)=>`<button class="${k==i?'on':''}" onclick="show(${k})">${t.n} (${t.r.length})</button>`).join('');
const R=tabs[i].r;
document.getElementById('grid').innerHTML=R.map((x,k)=>`<div class="c" onclick="this.classList.toggle('f')"><div class="in">
<div class="s" style="background:${PAL[k%6]}"><div class="em">${x.e}</div><div class="p">${hl(x.p)}</div><div class="ipa">/${x.i}/</div><button class="sp" data-w="${k}" aria-label="Play word">🔊</button></div>
<div class="s b" style="background:${PAL[(k+3)%6]}"><div class="lab">Negation (optional)</div><div class="lab2">Negation (optional) in English Sentences</div><div class="th">${x.t}</div><div class="se">${x.s}</div><div class="st">${x.ts}</div><button class="sp" data-s="${k}" aria-label="Play sentence">🔊</button></div>
</div></div>`).join('');
document.getElementById('tb').innerHTML=R.map((x,k)=>`<tr><td>${k+1}</td><td><b>${hl(x.p)}</b></td><td class="i">/${x.i}/</td><td class="t">${x.t}</td><td>${x.s}<div class="tp">${x.ts}</div></td><td><button class="sp" data-s="${k}" aria-label="Play sentence">🔊</button></td></tr>`).join('');fit()}
document.addEventListener('click',e=>{const b=e.target.closest('.sp');if(!b)return;e.stopPropagation();const R=tabs[T].r;
