<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9.1 Semi-modal "ought to" – Moral Obligation Flashcards</title>
<style>
:root{
  --bg:#eef1f5; --ink:#15181d; --muted:#5a6270; --line:#d3d9e2;
  --card:#ffffff; --verb:#8b0000; --would:#ffe066; --accent:#1f4e79; --back:#1f4e79; --backink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12161c; --ink:#e8ecf2; --muted:#9aa4b2; --line:#2b3340; --accent:#7fb2e5; --back:#243a52; }
}
:root[data-theme="dark"]{ --bg:#12161c; --ink:#e8ecf2; --muted:#9aa4b2; --line:#2b3340; --accent:#7fb2e5; --back:#243a52; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",Tahoma,Arial,sans-serif}
header{max-width:1120px;margin:0 auto;padding:22px 16px 10px}
h1{margin:0 0 4px;font-size:clamp(20px,3.2vw,28px);font-weight:700}
.sub{margin:0;color:var(--muted);font-size:15px}
.legend{margin-top:10px;font-size:15px;color:var(--muted)}
.legend .w{background:var(--would);color:#000;padding:1px 6px;border-radius:3px;font-family:Arial,sans-serif}
.legend .v{color:#c23b3b;font-weight:700;font-family:Arial,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab,.ghost{font:inherit;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0b1119}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0b1119}}
.ghost{margin-left:auto}
.tab:focus-visible,.ghost:focus-visible,.spk:focus-visible,.card:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
main{max-width:1120px;margin:0 auto;padding:16px 16px 48px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.grid{grid-template-columns:1fr}}

.card{perspective:1200px;height:300px;cursor:pointer;border-radius:16px}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.inner{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;padding:16px 18px 14px;overflow:hidden}
.front{background:var(--card);border:1px solid #cfd6e0;box-shadow:0 1px 2px rgba(20,30,50,.08)}
.back{background:var(--back);color:var(--backink);transform:rotateY(180deg);justify-content:center;align-items:center;text-align:center}
.num{position:absolute;top:10px;left:14px;font:12px Arial,sans-serif;color:#7a8494}
.pic{flex:0 0 auto;text-align:center;font-size:64px;line-height:1.1;padding-top:8px;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.txt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:4px 2px}
.en{margin:0;color:#000;font-family:"Arial Nova Light","Helvetica Neue",Arial,sans-serif;font-weight:300;font-size:clamp(16px,1.7vw,19px);line-height:1.45}
.en b{font-weight:700;color:var(--verb)}
.en mark{background:var(--would);color:#000;font-weight:400;padding:0 3px;border-radius:3px}
.ipa{margin:0;color:#000;font-family:"Times New Roman",Times,serif;font-size:clamp(15px,1.5vw,17px);line-height:1.4}
.spk{position:absolute;right:10px;top:10px;width:42px;height:42px;border-radius:50%;border:1px solid #c5cdd9;background:#f4f6fa;color:#1f4e79;font-size:20px;cursor:pointer;display:grid;place-items:center}
.spk:hover{background:#e6ecf5}
.spk.on{background:#1f4e79;color:#fff}
.hint{position:absolute;bottom:8px;right:14px;font-size:12px;color:#8b95a5}
.th{font-size:clamp(18px,2vw,22px);line-height:1.6;margin:0;padding:0 8px}
.th-small{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#b9cbe0}
.note{color:var(--muted);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<header>
  <h1>9.1 Semi-modal "ought to" — Moral Obligation</h1>
  <p class="sub">ฝึกอ่านและแปลประโยค · 100 ประโยค · หน้าละ 50 ประโยค (แถวละ 2 การ์ด)</p>
  <p class="legend"><span class="w">ought to</span> = ไฮไลต์ &nbsp; <span class="v">verb</span> = กริยาหลัก (ตัวหนา สีแดงเข้ม) &nbsp;|&nbsp; กดการ์ดเพื่อดูคำแปล · กดปุ่ม 🔊 เพื่อฟังเสียงผู้ชาย</p>
</header>
<div class="bar"><div class="bar-in" role="tablist" aria-label="เลือกหน้า">
  <button class="tab" role="tab" id="t0" aria-selected="true">หน้า 1 · ประโยค 1–50</button>
  <button class="tab" role="tab" id="t1" aria-selected="false">หน้า 2 · ประโยค 51–100</button>
  <button class="ghost" id="reset">พลิกกลับทั้งหมด</button>
</div></div>
<main>
  <div class="grid" id="grid"></div>
  <p class="note" id="voiceNote"></p>
</main>

<script>
const DATA = [{"en": "You ought to respect your elders.", "th": "คุณควรเคารพผู้ใหญ่", "e": "🙏", "ipa": "/juː ˈɔːt tə rɪspˈɛkt jɔːr ˈɛldəz/"}, {"en": "Children ought to listen to their parents.", "th": "เด็กๆ ควรเชื่อฟังพ่อแม่ของพวกเขา", "e": "👂", "ipa": "/tʃˈɪldrən ˈɔːt tə lˈɪsən tə ðeə pˈeərənts/"}, {"en": "We ought to help the homeless people in our city.", "th": "เราควรช่วยเหลือคนไร้บ้านในเมืองของเรา", "e": "🤲", "ipa": "/wiː ˈɔːt tə hˈɛlp ðə hˈəʊmləs pˈiːpəl ɪn ˌaʊə sˈɪti/"}, {"en": "Citizens ought to obey the law.", "th": "พลเมืองควรปฏิบัติตามกฎหมาย", "e": "⚖️", "ipa": "/sˈɪtɪzənz ˈɔːt tʊ əʊbˈeɪ ðə lˈɔː/"}, {"en": "She ought to apologize for her rude behavior.", "th": "เธอควรกล่าวคำขอโทษสำหรับพฤติกรรมหยาบคายของเธอ", "e": "🙇‍♀️", "ipa": "/ʃiː ˈɔːt tʊ ɐpˈɒlədʒˌaɪz fɔː hɜː rˈuːd bɪhˈeɪvjə/"}, {"en": "He ought to return the wallet he found to its owner.", "th": "เขาควรคืนกระเป๋าเงินที่เขาเก็บได้ให้กับเจ้าของ", "e": "👛", "ipa": "/hiː ˈɔːt tə rɪtˈɜːn ðə wˈɒlɪt hiː fˈaʊnd tʊ ɪts ˈəʊnə/"}, {"en": "Students ought to tell the truth to their teachers.", "th": "นักเรียนควรพูดความจริงกับคุณครู", "e": "🗣️", "ipa": "/stjˈuːdənts ˈɔːt tə tˈɛl ðə trˈuːθ tə ðeə tˈiːtʃəz/"}, {"en": "We ought to protect the environment for future generations.", "th": "เราควรปกป้องสิ่งแวดล้อมสำหรับคนรุ่นหลัง", "e": "🌿", "ipa": "/wiː ˈɔːt tə prətˈɛkt ðɪ ɛnvˈaɪrənmənt fɔː fjˈuːtʃə dʒˌɛnərˈeɪʃənz/"}, {"en": "Drivers ought to yield to pedestrians at crosswalks.", "th": "ผู้ขับขี่ควรให้ทางคนเดินถนนตรงทางม้าลาย", "e": "🚸", "ipa": "/drˈaɪvəz ˈɔːt tə jˈiːld tə pədˈɛstriənz at krˈɒswɔːks/"}, {"en": "You ought to keep your promises.", "th": "คุณควรทำตามสัญญาของคุณ", "e": "🤞", "ipa": "/juː ˈɔːt tə kˈiːp jɔː prˈɒmɪsɪz/"}, {"en": "We ought to take care of our aging parents.", "th": "เราควรดูแลพ่อแม่ที่แก่ชราของเรา", "e": "👴", "ipa": "/wiː ˈɔːt tə tˈeɪk kˈeər ɒv ˌaʊər ˈeɪdʒɪŋ pˈeərənts/"}, {"en": "Society ought to support underprivileged children.", "th": "สังคมควรสนับสนุนเด็กที่ด้อยโอกาส", "e": "🧒", "ipa": "/səs const PER = 50;
let page = 0;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Highlight "would" and the main verb that follows it (skipping "always")
function markup(sentence){
  const parts = sentence.split(" ");
  const wi = parts.findIndex((p,i)=> /^ought$/i.test(p) && /^to$/i.test(parts[i+1]||""));
  if(wi < 0) return esc(sentence);
  const vi = wi + 2;
  const out = [];
  for(let i=0;i<parts.length;i++){
    if(i===wi){ out.push("<mark>"+esc(parts[i])+" "+esc(parts[i+1])+"</mark>"); i++; continue; }
    if(i===vi){
      const m = parts[i].match(/^([A-Za-z'-]+)(.*)$/);
      out.push(m ? "<b>"+esc(m[1])+"</b>"+esc(m[2]) : esc(parts[i]));
      continue;
    }
    out.push(esc(parts[i]));
  }
  return out.join(" ");
}

function render(){
  const grid = document.getElementById("grid");
  const start = page*PER;
  grid.innerHTML = DATA.slice(start, start+PER).map((d,i)=>`
    <div class="card" tabindex="0" role="button" aria-label="การ์ดที่ ${start+i+1} กดเพื่อพลิก">
      <div class="inner">
        <div class="face front">
          <span class="num">${start+i+1}</span>
          <button class="spk" data-i="${start+i}" aria-label="อ่านออกเสียงประโยค" title="ฟังเสียง">🔊</button>
          <div class="pic" aria-hidden="true">${d.e}</div>
          <div class="txt">
            <p class="en">${markup(d.en)}</p>
            <p class="ipa">${esc(d.ipa)}</p>
          </div>
          <span class="hint">กดเพื่อดูคำแปล</span>
        </div>
        <div class="face back">
          <p class="th">${esc(d.th)}</p>
          <span class="th-small">กดเพื่อกลับ</span>
        </div>
      </div>
    </div>`).join("");
  document.getElementById("t0").setAttribute("aria-selected", page===0);
  document.getElementById("t1").setAttribute("aria-selected", page===1);
  window.scrollTo({top:0});
}

// ---------- Speech: prefer a British male voice ----------
let voice = null;
const MALE_HINTS = ["google uk english male","daniel","microsoft ryan","microsoft george","microsoft thomas","oliver","arthur","male"];
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const gb = vs.filter(v=>/en[-_]GB/i.test(v.lang));
  const en = vs.filter(v=>/^en/i.test(v.lang));
  const lower = v => v.name.toLowerCase();
  for(const h of MALE_HINTS){
    const hit = gb.find(v=>lower(v).includes(h)) || en.find(v=>lower(v).includes(h) && /en[-_]GB/i.test(v.lang));
    if(hit){voice=hit;break;}
  }
  if(!voice) voice = gb[0] || en.find(v=>/male|david|mark|james|guy|alex/i.test(v.name)) || en[0] || null;
  const n = document.getElementById("voiceNote");
  n.textContent = voice ? "เสียงที่ใช้: " + voice.name + " (" + voice.lang + ") — คุณภาพขึ้นกับเสียงที่มีในอุปกรณ์ของคุณ" : "ไม่พบเสียงภาษาอังกฤษในอุปกรณ์นี้";
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, btn){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll(".spk.on").forEach(b=>b.classList.remove("on"));
  const u = new SpeechSynthesisUtterance(text);
  if(voice){u.voice = voice; u.lang = voice.lang;} else u.lang = "en-GB";
  u.rate = 0.88; u.pitch = 0.9;
  u.onstart = ()=>btn.classList.add("on");
  u.onend = u.onerror = ()=>btn.classList.remove("on");
  speechSynthesis.speak(u);
}

// ---------- Events ----------
document.getElementById("grid").addEventListener("click", e=>{
  const spk = e.target.closest(".spk");
  if(spk){ e.stopPropagation(); speak(DATA[+spk.dataset.i].en, spk); return; }
  const card = e.target.closest(".card");
  if(card) card.classList.toggle("flipped");
});
document.getElementById("grid").addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("card")){
    e.preventDefault(); e.target.classList.toggle("flipped");
  }
});
document.getElementById("t0").onclick = ()=>{page=0;render();};
document.getElementById("t1").onclick = ()=>{page=1;render();};
document.getElementById("reset").onclick = ()=>document.querySelectorAll(".card.flipped").forEach(c=>c.classList.remove("flipped"));
render();
</script>
</body>
</html>
