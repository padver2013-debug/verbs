<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipping Cards – Learning & Study Actions</title>
<style>
:root{--bg:#dff1ff;--tx:#12365a;--f1:#ffffff;--f2:#e3f3ff;--b1:#2f9bef;--b2:#5ec2ff;--sh:rgba(40,120,190,.35);--pill:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Thai",system-ui,sans-serif;padding:12px}
h1{font-size:clamp(1.1rem,3.2vw,1.6rem);margin:4px 0 10px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:10px}
.pill{background:var(--pill);padding:8px 14px;border-radius:999px;font-weight:700;box-shadow:0 3px 8px var(--sh)}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;padding:9px 16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 4px 10px var(--sh)}
button.c{background:linear-gradient(135deg,#ff6b6b,#d63a5a)}
button:active{transform:scale(.96)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--pill);color:var(--tx);box-shadow:0 2px 6px var(--sh)}
.tabs button.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.6vw,16px);max-width:1000px;margin:0 auto}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{perspective:800px;aspect-ratio:4/3;cursor:pointer;-webkit-tap-highlight-color:transparent}
.in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.card.fl .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:clamp(14px,2.4vw,24px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;
box-shadow:0 10px 18px var(--sh),inset 0 2px 4px rgba(255,255,255,.6),inset 0 -6px 10px rgba(60,150,220,.15);background:linear-gradient(160deg,var(--f1),var(--f2))}
.bk{transform:rotateY(180deg);background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff}
.w{font-weight:800;font-size:clamp(.9rem,2.6vw,1.6rem);word-break:break-word}
.p{font-size:clamp(.6rem,1.5vw,.85rem);opacity:.7;margin-top:3px}
.th{font-size:clamp(.95rem,2.6vw,1.5rem);font-weight:700}
.sp{position:absolute;right:5px;bottom:5px;width:28px;height:28px;padding:0;font-size:.8rem;line-height:28px}
.done .fc:not(.bk){outline:2px solid #3ccf8e}
#msg{text-align:center;margin-top:12px;font-weight:700;min-height:1.4em}
.em{font-size:clamp(1.5rem,5.2vw,2.8rem);line-height:1.1;margin-bottom:2px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}.bk .em{font-size:clamp(1.1rem,3.4vw,1.8rem)}.w{font-size:clamp(.8rem,2.2vw,1.35rem)}</style></head><body>
<h1>10. Learning & Study Actions | การเรียนรู้และการศึกษา</h1>
<div class="bar">
<span class="pill">⏱ <span id="t">00:00</span></span>
<span class="pill">⭐ <span id="s">0</span>/<span id="n"></span></span>
<button id="rs">▶ เริ่มเล่น</button><button id="cc" class="c">✖ ยกเลิก</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="g"></div>
<div id="msg">คลิกการ์ดเพื่อฟังเสียงและพลิกดูคำแปล (ได้ 1 คะแนนต่อการ์ดที่เปิดครั้งแรก)</div>
<script>
const RAW=`absorb|əbˈzɔːb|ดูดซับ / ซึมซับ|🧽
analyze|ˈæn.əl.aɪz|วิเคราะห์|🔍
apply|əˈplaɪ|นำไปใช้ / สมัคร|📤
attend|əˈtend|เข้าร่วม|🏫
brainstorm|ˈbreɪn.stɔːm|ระดมสมอง|🌩️
calculate|ˈkæl.kjə.leɪt|คำนวณ|🧮
certify|ˈsɜː.tɪ.faɪ|รับรอง|📜
cite|saɪt|อ้างอิง|📎
clarify|ˈklær.ɪ.faɪ|ทำให้กระจ่าง|💡
classify|ˈklæs.ɪ.faɪ|จัดประเภท|🗂️
coach|kəʊtʃ|ฝึกสอน|🏅
collaborate|kəˈlæb.ə.reɪt|ร่วมมือ|🤝
collect|kəˈlekt|รวบรวม|🧺
communicate|kəˈmjuː.nɪ.keɪt|สื่อสาร|💬
compare|kəmˈpeər|เปรียบเทียบ|⚖️
compile|kəmˈpaɪl|รวบรวม / เรียบเรียง|📚
comprehend|ˌkɒm.prɪˈhend|เข้าใจอย่างถ่องแท้|🧠
compute|kəmˈpjuːt|คำนวณ / ประมวลผล|💻
concentrate|ˈkɒn.sən.treɪt|ตั้งสมาธิ|🎯
conceptualize|kənˈsep.tʃu.ə.laɪz|สร้างแนวคิด|💭
conclude|kənˈkluːd|สรุป|🏁
consult|kənˈsʌlt|ปรึกษา|🗣️
contemplate|ˈkɒn.təm.pleɪt|ใคร่ครวญ|🧘
cram|kræm|อ่านหนังสือแบบเร่งด่วน|📖
critique|krɪˈtiːk|วิจารณ์|📝
cuddle|ˈkʌd.əl|กอด|🤗
debate|dɪˈbeɪt|โต้วาที|🎙️
deduce|dɪˈdjuːs|อนุมาน|🕵️
define|dɪˈfaɪn|ให้คำจำกัดความ|📘
demonstrate|ˈdem.ən.streɪt|สาธิต|👩‍🏫
derive|dɪˈraɪv|สืบทอด / ได้มา|🧬
design|dɪˈzaɪn|ออกแบบ|📐
detect|dɪˈtekt|ตรวจพบ|📡
determine|dɪˈtɜː.mɪn|กำหนด / ตัดสินใจ|⚖️
develop|dɪˈvel.əp|พัฒนา|🌱
diagnose|ˌdaɪ.əɡˈnəʊz|วินิจฉัย|🩺
discern|dɪˈsɜːn|สังเกตเห็น / แยกแยะ|👁️
discover|dɪˈskʌv.ər|ค้นพบ|🔭
discuss|dɪˈskʌs|อภิปราย|💬
distinguish|dɪˈstɪŋ.ɡwɪʃ|แยกแยะความต่าง|🔎
document|ˈdɒk.jʊ.ment|บันทึกเป็นเอกสาร|📄
drill|drɪl|ฝึกซ้ำ ๆ|🔩
edit|ˈed.ɪt|แก้ไข|✏️
educate|ˈedʒ.u.keɪt|ให้การศึกษา|🎓
elucidate|ɪˈluː.sɪ.deɪt|อธิบายให้กระจ่าง|🔦
emphasize|ˈem.fə.saɪz|เน้นย้ำ|❗
enquire|ɪnˈkwaɪər|สอบถาม|❓
enroll|ɪnˈrəʊl|ลงทะเบียนเรียน|✍️
essay|ˈes.eɪ|เขียนเรียงความ / ลองทำ|📃
evaluate|ɪˈvæl.ju.eɪt|ประเมินผล|📊
examine|ɪɡˈzæm.ɪn|ตรวจสอบ / สอบ|📝
exchange|ɪksˈtʃeɪndʒ|แลกเปลี่ยน|🔄
exercise|ˈek.sə.saɪz|ฝึกหัด / ออกกำลัง|🏋️
exhibit|ɪɡˈzɪb.ɪt|จัดแสดง|🖼️
expand|ɪkˈspænd|ขยาย|↔️
expect|ɪkˈspekt|คาดหวัง|⏳
experiment|ɪkˈsper.ɪ.ment|ทดลอง|🧪
explain|ɪkˈspleɪn|อธิบาย|🗨️
explore|ɪkˈsplɔːr|สำรวจ|🧭
express|ɪkˈspres|แสดงออก|😮
extract|ɪkˈstrækt|สกัด / ดึงออก|🧲
extrapolate|ɪkˈstræp.ə.leɪt|คาดการณ์จากข้อมูล|📈
familiarize|fəˈmɪl.i.ə.raɪz|ทำให้คุ้นเคย|🤝
focus|ˈfəʊ.kəs|โฟกัส / มุ่งความสนใจ|🔭
formulate|ˈfɔː.mjə.leɪt|กำหนดสูตร / วางหลักการ|🧬
gather|ˈɡæð.ər|รวบรวม|👥
generalize|ˈdʒen.ər.əl.aɪz|สรุปโดยรวม|🌐
grasp|ɡrɑːsp|เข้าใจ / จับ|✊
guess|ɡes|เดา|🎲
highlight|ˈhaɪ.laɪt|ไฮไลต์ / เน้น|🖍️
hypothesis|haɪˈpɒθ.ə.sɪs|สมมติฐาน|🤔
identify|aɪˈden.tɪ.faɪ|ระบุ|🪪
illustrate|ˈɪl.ə.streɪt|ยกตัวอย่างประกอบ|🖼️
imitate|ˈɪm.ɪ.teɪt|เลียนแบบ|🦜
immerse|ɪˈmɜːs|จมดิ่ง / ดื่มด่ำ|🤿
improve|ɪmˈpruːv|ปรับปรุงให้ดีขึ้น|📈
inquire|ɪnˈkwɪər|สอบถาม|🙋
inspect|ɪnˈspekt|ตรวจตรา|🔍
inspire|ɪnˈspaɪər|สร้างแรงบันดาลใจ|✨
interpret|ɪnˈtɜː.prɪt|ตีความ|🈂️
interview|ˈɪn.tə.vjuː|สัมภาษณ์|🎤
investigate|ɪnˈves.tɪ.ɡeɪt|สืบสวน / ค้นคว้า|🕵️
iterate|ˈɪt.ə.reɪt|ทำซ้ำเพื่อปรับปรุง|🔁
jot|dʒɒt|จดสั้น ๆ|✏️
keep|kiːp|เก็บ / รักษาไว้|🗄️
learn|lɜːn|เรียนรู้|🧠
lecture|ˈlek.tʃər|บรรยาย|👨‍🏫
listen|ˈlɪs.ən|ฟัง|👂
locate|ləʊˈkeɪt|ระบุตำแหน่ง|📍
master|ˈmɑː.stə|เชี่ยวชาญ|🥇
memorize|ˈmem.ə.raɪz|ท่องจำ|🧠
mentor|ˈmen.tɔːr|เป็นที่ปรึกษา|🧑‍🏫
model|ˈmɒd.əl|สร้างแบบจำลอง|🧍
monitor|ˈmɒn.ɪ.tər|เฝ้าติดตาม|🖥️
motivate|ˈməʊ.tɪ.veɪt|กระตุ้นแรงจูงใจ|🔥
note|nəʊt|จดบันทึก|🗒️
observe|əbˈzɜːv|สังเกต|👀
outline|ˈaʊt.laɪn|ร่างโครงเรื่อง|📋
overcome|ˌəʊ.vəˈkʌm|เอาชนะ|🏔️`.split("\n").map(l=>{const[a,b,c,e]=l.split("|");return{w:a,p:"/"+b+"/",t:c,e:e}});
let data=RAW.slice(),tab=0,seen=new Set(),score=0,sec=0,timer=null,voice=null;
const $=id=>document.getElementById(id),g=$("g");
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]GB/i.test(x.lang));
voice=v.find(x=>/daniel|oliver|arthur|google uk english male|male/i.test(x.name))||v[0]||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang))||null}
if("speechSynthesis"in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(w){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";if(voice)u.voice=voice;u.pitch=1.15;u.rate=.85;speechSynthesis.speak(u)}
function fmt(){$("t").textContent=String(sec/60|0).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function start(){clearInterval(timer);timer=setInterval(()=>{sec++;fmt()},1000)}
function render(){g.innerHTML="";data.slice(tab*25,tab*25+25).forEach(d=>{
const c=document.createElement("div");c.className="card"+(seen.has(d.w)?" done":"");
c.innerHTML=`<div class="in"><div class="fc"><div class="em">${d.e}</div><div class="w">${d.w}</div><div class="p">${d.p}</div><button class="sp" title="ฟังเสียง">🔊</button></div><div class="fc bk"><div class="em">${d.e}</div><div class="th">${d.t}</div><div class="p">${d.w}</div></div></div>`;
c.querySelector(".sp").onclick=e=>{e.stopPropagation();say(d.w)};
c.onclick=()=>{const f=c.classList.toggle("fl");say(d.w);
if(f&&!seen.has(d.w)){if(!timer)start();seen.add(d.w);score++;$("s").textContent=score;c.classList.add("done");
if(score===RAW.length){clearInterval(timer);$("msg").textContent="🎉 ครบทุกคำ! ใช้เวลา "+$("t").textContent}}};
g.appendChild(c)})}
function tabs(){const t=$("tabs");t.innerHTML="";for(let i=0;i<Math.ceil(RAW.length/25);i++){const b=document.createElement("button");b.textContent=`Tab ${i+1} (${i*25+1}-${Math.min(i*25+25,RAW.length)})`;b.className=i===tab?"on":"";b.onclick=()=>{tab=i;tabs();render()};t.appendChild(b)}}
function reset(shuffle){clearInterval(timer);timer=null;speechSynthesis.cancel();sec=0;score=0;seen.clear();fmt();$("s").textContent=0;
data=RAW.slice();if(shuffle)for(let i=data.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[data[i],data[j]]=[data[j],data[i]]}
$("msg").textContent=shuffle?"เริ่มแล้ว! พลิกการ์ดให้ครบ":"ยกเลิกแล้ว กดเริ่มเล่นเพื่อเล่นใหม่";render()}
$("rs").onclick=()=>{reset(true);start();$("rs").textContent="↻ เริ่มใหม่"};
$("cc").onclick=()=>{reset(false);$("rs").textContent="▶ เริ่มเล่น"};
$("n").textContent=RAW.length;tabs();render();
</script></body></html>
