<script>
const DATA = [{"en": "When I was a child, my grandfather would tell us amazing stories before bed.", "th": "สมัยที่ฉันยังเป็นเด็ก คุณปู่มักจะเล่านิทานสนุกๆ ให้พวกเราฟังก่อนนอนเสมอ", "e": "📖", "ipa": "/wˌɛn aɪ wʌzɐ tʃˈaɪld maɪ grˈandfɑːðə wʊd tˈɛl ˌʌs ɐmˈeɪzɪŋ stˈɔːriz bɪfˌɔː bˈɛd/"}, {"en": "Every summer, we would travel to the countryside to visit our relatives.", "th": "ทุกๆ ฤดูร้อน พวกเรามักจะเดินทางไปต่างจังหวัดเพื่อเยี่ยมญาติผู้ใหญ่", "e": "🧳", "ipa": "/ˈɛvrɪ sˈʌmə wiː wʊd trˈavəl tə ðə kˈʌntrɪsˌaɪd tə vˈɪzɪt ˌaʊə rˈɛlətˌɪvz/"}, {"en": "On weekends, my father would wake up early to cook breakfast for everyone.", "th": "ในวันหยุดสุดสัปดาห์ คุณพ่อมักจะตื่นแต่เช้ามาทำอาหารเช้าให้ทุกคนทาน", "e": "⏰", "ipa": "/ˌɒn wiːkˈɛndz maɪ fˈɑːðə wʊd wˈeɪk ˌʌp ˈɜːlɪ tə kˈʊk brˈɛkfəst fɔːr ˈɛvrɪwˌɒn/"}, {"en": "After school, we would play football in the backyard until sunset.", "th": "พอเลิกเรียน พวกเรามักจะไปเตะฟุตบอลกันที่สนามหลังบ้านจนกระทั่งพระอาทิตย์ตกดิน", "e": "⚽", "ipa": "/ˈaftə skˈuːl wiː wʊd plˈeɪ fˈʊtbɔːl ɪnðə bˈakjɑːd ʌntˈɪl sˈʌnsɛt/"}, {"en": "During winter evenings, we would sit around the fireplace and drink hot cocoa.", "th": "ในช่วงค่ำคืนฤดูหนาว พวกเรามักจะมานั่งล้อมวงรอบเตาผิงและดื่มโกโก้ร้อนๆ", "e": "🔥", "ipa": "/djˈʊərɪŋ wˈɪntər ˈiːvnɪŋz wiː wʊd sˈɪt ɐrˈaʊnd ðə fˈaɪəpleɪs and drˈɪŋk hˈɒt kˈəʊkəʊ/"}, {"en": "Whenever it rained, my mother would bake delicious chocolate chip cookies.", "th": "ทุกครั้งที่ฝนตก คุณแม่มักจะอบคุกกี้ช็อกโกแลตชิปแสนอร่อยให้กิน", "e": "🍪", "ipa": "/wɛnˌɛvər ɪt rˈeɪnd maɪ mˈʌðə wʊd bˈeɪk dɪlˈɪʃəs tʃˈɒklət tʃˈɪp kˈʊkiz/"}, {"en": "In the old days, people would write handwritten letters to communicate.", "th": "ในอดีตผู้คนมักจะเขียนจดหมายด้วยลายมือเพื่อติดต่อสื่อสารกัน", "e": "✉️", "ipa": "/ɪnðɪ ˈəʊld dˈeɪz pˈiːpəl wʊd rˈaɪt hˈandrɪtən lˈɛtəz tə kəmjˈuːnɪkˌeɪt/"}, {"en": "As a teenager, she would spend hours talking on the phone with friends.", "th": "สมัยเป็นวัยรุ่น เธอมักจะใช้เวลาคุยโทรศัพท์กับเพื่อนๆ นานหลายชั่วโมง", "e": "📞", "ipa": "/az ɐ tˈiːneɪdʒə ʃiː wʊd spˈɛnd ˈaʊəz tˈɔːkɪŋ ɒnðə fˈəʊn wɪð frˈɛndz/"}, {"en": "Every Sunday morning, my dog would wait by the front door for our walk.", "th": "ทุกเช้าวันอาทิตย์ เจ้าสุนัขของฉันมักจะไปนั่งรอที่ประตูหน้าบ้านเพื่อรอไปเดินเล่น", "e": "🐕", "ipa": "/ˈɛvrɪ sˈʌndeɪ mˈɔːnɪŋ maɪ dˈɒg wʊd wˈeɪt baɪ ðə frˈʌnt dˈɔː fɔːr ˌaʊə wˈɔːk/"}, {"en": "My grandmother would sing traditional lullabies until I fell asleep.", "th": "คุณยายมักจะร้องเพลงกล่อมเด็กโบราณจนกระทั่งฉันหลับไป", "e": "🎤", "ipa": "/maɪ grˈandmʌðə wʊd sˈɪŋ trɐdˈɪʃənəl lˈʌləbˌaɪz ʌntˈɪl aɪ fˈɛl ɐslˈiːp/"}, {"en": "Years ago, we would gather at this café every single Friday.", "th": "หลายปีก่อน พวกเรามักจะมารวมตัวกันที่คาเฟ่แห่งนี้ทุกๆ วันศุกร์ไม่เคยขาด", "e": "☕", "ipa": "/jˈiəz ɐgˈəʊ wiː wʊd gˈaðər at ðɪs kafˈeɪ ˈɛvrɪ sˈɪŋgəl frˈaɪdeɪ/"}, {"en": "Whenever I visited my aunt, she would prepare a huge feast.", "th": "ทุกครั้งที่ฉันไปเยี่ยมคุณป้า ท่านมักจะเตรียมอาหารเลี้ยงชุดใหญ่อย่างอลังการ", "e": "🍽️", "ipa": "/wɛnˌɛvər aɪ vˈɪzɪtɪd maɪ ˈant ʃiː wʊd prɪpˈeər ɐ hjˈuːdʒ fˈiːst/"}, {"en": "Back then, my friends and I would ride our bicycles all over town.", "th": "ยุคนั้น เพื่อนๆ และฉันมักจะขี่จักรยานเที่ยวเล่นไปทั่วเมืองเลย", "e": "🚲", "ipa": "/bˈak ðˈɛn maɪ frˈɛndz and aɪ wʊd rˈaɪd ˌaʊə bˈaɪsɪkəlz ˈɔːl ˌəʊvə tˈaʊn/"}, {"en": "During school breaks, he would read comic books for hours.", "th": "ในช่วงเวลาพักที่โรงเรียน เขามักจะนั่งอ่านหนังสือการ์ตูนติดต่อกันเป็นชั่วโมง", "e": "📚", "ipa": "/djˈʊərɪŋ skˈuːl brˈeɪks hiː wʊd rˈiːd kˈɒmɪk bˈʊks fɔːr ˈaʊəz/"}, {"en": "My cat would sleep on my keyboard whenever I tried to type.", "th": "แมวของฉันมักจะมานอนขดบนคีย์บอร์ดทุกครั้งที่ฉันพยายามพิมพ์งาน", "e": "🐈", "ipa": "/maɪ kˈat wʊd slˈiːp ˌɒn maɪ kˈiːbɔːd wɛnˌɛvər aɪ trˈaɪd tə tˈaɪp/"}, {"en": "In those days, my brother would practice playing the guitar until late.", "th": "ในสมัยนั้น พี่ชายของฉันมักจะฝึกซ้อมเล่นกีตาร์จนดึกดื่น", "e": "🎸", "ipa": "/ɪn ðəʊz dˈeɪz maɪ brˈʌðə wʊd prˈaktɪs plˈeɪɪŋ ðə gɪtˈɑːr ʌntˈɪl lˈeɪt/"}, {"en": "Every evening, we would take a long walk around the neighborhood.", "th": "ทุกๆ เย็น พวกเรามักจะเดินเล่นผ่อนคลายรอบๆ ละแวกบ้านเป็นระยะทางไกล", "e": "🚶", "ipa": "/ˈɛvrɪ ˈiːvnɪŋ wiː wʊd tˈeɪk ɐ lˈɒŋ wˈɔːk ɐrˈaʊnd ðə nˈeɪbəhˌʊd/"}, {"en": "When we went camping, my father would build a large campfire.", "th": "เวลาที่เราไปตั้งแคมป์ คุณพ่อมักจะก่อกองไฟขนาดใหญ่ไว้ให้เสมอ", "e": "🏕️", "ipa": "/wˌɛn wiː wɛnt kˈampɪŋ maɪ fˈɑːðə wʊd bˈɪld ɐ lˈɑːdʒ kˈampfaɪə/"}, {"en": "She would always forget where she left her house keys.", "th": "เธอมักจะหลงลืมและวางกุญแจบ้านทิ้งไว้ผิดที่ผิดทางอยู่เป็นประจำ", "e": "🔑", "ipa": "/ʃiː wʊd ˈɔːlweɪz fəgˈɛt wˌeə ʃiː lˈɛft hɜː hˈaʊs kˈiːz/"}, {"en": "On rainy afternoons, we would build forts out of couch cushions.", "th": "ในยามบ่ายที่ฝนตก พวกเรามักจะเอาหมอนอิงโซฟามาต่อสร้างเป็นบ้านจำลอง", "e": "🛋️", "ipa": "/ˌɒn rˈeɪni ˌaftənˈuːnz wiː wʊd bˈɪld fˈɔːts ˌaʊtəv kˈaʊtʃ kˈʊʃənz/"}, {"en": "My uncle would bring us fresh fruit from his orchard every week.", "th": "คุณลุงมักจะหิ้วผลไม้สดๆ จากสวนของท่านมาฝากพวกเราทุกสัปดาห์", "e": "🍎", "ipa": "/maɪ ˈʌŋkəl wʊd brˈɪŋ ˌʌs frˈɛʃ frˈuːt frɒm hɪz ˈɔːtʃəd ˈɛvrɪ wˈiːk/"}, {"en": "Back in college, we would stay up all night studying before exams.", "th": "สมัยเรียนมหาวิทยาลัย พวกเรามักจะโต้รุ่งอ่านหนังสือเตรียมสอบกันข้ามคืน", "e": "🌙", "ipa": "/bˈak ɪn kˈɒlɪdʒ wiː wʊd stˈeɪ ˌʌp ˈɔːl nˈaɪt stˈʌdiɪŋ bɪfˌɔːr ɛgzˈamz/"}, {"en": "Whenever I felt sad, my mother would hug me tightly.", "th": "ทุกครั้งที่ฉันรู้สึกเศร้า คุณแม่มักจะสวมกอดปลอบโยนฉันแน่นๆ", "e": "🤗", "ipa": "/wɛnˌɛvər aɪ fˈɛlt sˈad maɪ mˈʌðə wʊd hˈʌg mˌiː tˈaɪtli/"}, {"en": "In the summer months, we would swim in the river near our house.", "th": "ในช่วงเดือนฤดูร้อน พวกเรามักจะลงไปว่ายน้ำเล่นในแม่น้ำใกล้บ้าน", "e": "🏊", "ipa": "/ɪnðə sˈʌmə mˈʌnθs wiː wʊd swˈɪm ɪnðə rˈɪvə nˌiər ˌaʊə hˈaʊs/"}, {"en": "My teacher would give us stickers for getting good grades.", "th": "คุณครูมักจะแจกสติ๊กเกอร์เป็นรางวัลให้กับคนที่ทำคะแนนสอบได้ดี", "e": "⭐", "ipa": " จำทุกสัปดาห์", "e": "📱", "ipa": "/wˌɛn aɪ lˈɪvd ɐbrˈɔːd maɪ fˈamɪli wʊd kˈɔːl mˌiː wˈiːkli/"}, {"en": "My grandfather would carve wooden toys for us.", "th": "คุณปู่มักจะใช้มีดแกะสลักของเล่นทำจากไม้ให้พวกเราเล่น", "e": "🪵", "ipa": "/maɪ grˈandfɑːðə wʊd kˈɑːv wˈʊdən tˈɔɪz fɔːr ˌʌs/"}, {"en": "During recess, we would jump rope in the courtyard.", "th": "ช่วงเวลาพักกลางวัน พวกเรามักจะออกไปกระโดดเชือกกันที่ลานกลางแจ้ง", "e": "🤸", "ipa": "/djˈʊərɪŋ rˈiːsɛs wiː wʊd dʒˈʌmp rˈəʊp ɪnðə kˈɔːtjɑːd/"}, {"en": "My sister would always organize tea parties for dolls.", "th": "พี่สาวของฉันมักจะชอบจัดปาร์ตี้จิบน้ำชายามบ่ายให้กับตุ๊กตาเสมอ", "e": "🫖", "ipa": "/maɪ sˈɪstə wʊd ˈɔːlweɪz ˈɔːgənˌaɪz tˈiː pˈɑːtiz fɔː dˈɒlz/"}, {"en": "Years ago, we would fish at the lake on weekends.", "th": "หลายปีก่อน พวกเรามักจะไปนั่งตกปลากันที่ริมทะเลสาบในวันหยุด", "e": "🎣", "ipa": "/jˈiəz ɐgˈəʊ wiː wʊd fˈɪʃ at ðə lˈeɪk ˌɒn wiːkˈɛndz/"}, {"en": "My teacher would tell fascinating historical myths.", "th": "คุณครูมักจะเล่าเรื่องราวตำนานประวัติศาสตร์ที่น่าตื่นตาตื่นใจให้ฟัง", "e": "🏺", "ipa": "/maɪ tˈiːtʃə wʊd tˈɛl fˈasɪnˌeɪtɪŋ hɪstˈɒrɪkəl mˈɪθs/"}, {"en": "In winter, we would wear thick woolen sweaters.", "th": "ในช่วงฤดูหนาว พวกเรามักจะสวมเสื้อกันหนาวไหมพรมเนื้อหนาเตอะ", "e": "🧥", "ipa": "/ɪn wˈɪntə wiː wʊd wˈeə θˈɪk wˈʊlən swˈɛtəz/"}, {"en": "My brother would build complex puzzles for hours.", "th": "พี่ชายของฉันมักจะนั่งต่อตัวต่อจิ๊กซอว์ยากๆ ติดต่อกันหลายชั่วโมง", "e": "🧩", "ipa": "/maɪ brˈʌðə wʊd bˈɪld kˈɒmplɛks pˈʌzəlz fɔːr ˈaʊəz/"}, {"en": "On long car trips, we would play alphabet games.", "th": "เวลาเดินทางด้วยรถยนต์ทางไกล พวกเรามักจะเล่นเกมต่อคำศัพท์สนุกๆ", "e": "🔤", "ipa": "/ˌɒn lˈɒŋ kˈɑː trˈɪps wiː wʊd plˈeɪ ˈalfəbˌɛt gˈeɪmz/"}, {"en": "My aunt would bake fruit tarts for every birthday.", "th": "คุณป้าของฉันมักจะอบทาร์ตผลไม้สดสำหรับงานวันเกิดทุกๆ ปี", "e": "🎂", "ipa": "/maɪ ˈant wʊd bˈeɪk frˈuːt tˈɑːts fɔːr ˈɛvrɪ bˈɜːθdeɪ/"}, {"en": "When I was sad, my friend would cheer me up.", "th": "ยามที่ฉันเศร้าหมอง เพื่อนสนิทมักจะคอยพูดจาปลอบใจให้ฉันยิ้มได้", "e": "😊", "ipa": "/wˌɛn aɪ wɒz sˈad maɪ frˈɛnd wʊd tʃˈiə mˌiː ˈʌp/"}, {"en": "Every evening, we would check the locks before sleep.", "th": "ทุกๆ ค่ำคืน พวกเรามักจะตรวจตราเช็คกลอนประตูก่อนเข้านอนเสมอ", "e": "🔒", "ipa": "/ˈɛvrɪ ˈiːvnɪŋ wiː wʊd tʃˈɛk ðə lˈɒks bɪfˌɔː slˈiːp/"}, {"en": "Back then, students would carry heavy backpacks.", "th": "สมัยก่อนเด็กนักเรียนมักจะสะพายเป้ใส่หนังสือเรียนใบใหญ่หนักอึ้ง", "e": "🎒", "ipa": "/bˈak ðˈɛn stjˈuːdənts wʊd kˈari hˈɛvi bˈakpaks/"}, {"en": "My cat would sleep on my lap while I studied.", "th": "แมวของฉันมักจะมานอนขดซุกบนตักเวลาที่ฉันกำลังนั่งอ่านหนังสือ", "e": "😴", "ipa": "/maɪ kˈat wʊd slˈiːp ˌɒn maɪ lˈap wˌaɪl aɪ stˈʌdid/"}, {"en": "In the past, people would use maps for driving.", "th": "ในอดีตผู้คนมักจะต้องกางแผนที่กระดาษเพื่อนำทางขับรถเดินทาง", "e": "🗺️", "ipa": "/ɪnðə pˈast pˈiːpəl wʊd jˈuːz mˈaps fɔː drˈaɪvɪŋ/"}, {"en": "On weekends, my father would garden outdoors.", "th": "ในวันหยุดสุดสัปดาห์ คุณพ่อมักจะออกไปทำสวนปลูกต้นไม้กลางแจ้ง", "e": "🌱", "ipa": "/ˌɒn wiːkˈɛndz maɪ fˈɑːðə wʊd gˈɑːdən aʊtdˈɔːz/"}, {"en": "My grandmother would tell stories of her youth.", "th": "คุณยายมักจะเล่าเรื่องราวความทรงจำในวัยสาวให้พวกเราฟัง", "e": "👵", "ipa": "/maɪ grˈandmʌðə wʊd tˈɛl stˈɔːriz ɒv hɜː jˈuːθ/"}, {"en": "During lunch, we would discuss interesting books.", "th": "ระหว่างมื้อเที่ยง พวกเรามักจะหยิบหนังสือเล่มโปรดมาพูดคุยแลกเปลี่ยนกัน", "e": "💬", "ipa": "/djˈʊərɪŋ lˈʌntʃ wiː wʊd dɪskˈʌs ˈɪntrɛstɪŋ bˈʊks/"}, {"en": "Every spring, we would clean the house thoroughly.", "th": "ทุกๆ ฤดูใบไม้ผลิ พวกเรามักจะช่วยกันทำความสะอาดบ้านครั้งใหญ่", "e": "🧹", "ipa": "/ˈɛvrɪ sprˈɪŋ wiː wʊd klˈiːn ðə hˈaʊs θˈʌrəli/"}, {"en": "My friends would visit my house on holidays.", "th": "เพื่อนๆ ของฉันมักจะเดินทางมาเยี่ยมเยียนที่บ้านในวันหยุดยาว", "e": "👋", "ipa": "/maɪ frˈɛndz wʊd vˈɪzɪt maɪ hˈaʊs ˌɒn hˈɒlɪdˌeɪz/"}, {"en": "My uncle would bring souvenirs from his trips.", "th": "คุณลุงมักจะมีของฝากของที่ระลึกติดไม้ติดมือกลับมาจากทริปเดินทางเสมอ", "e": "🎁", "ipa": "/maɪ ˈʌŋkəl wʊd brˈɪŋ sˌuːvənˈiəz frɒm hɪz trˈɪps/"}, {"en": "In those days, we would stargaze all night long.", "th": "ในสมัยนั้น พวกเรามักจะพากันนอนแหงนมองดูหมู่ดาวประกายพรึกกันข้ามคืน", "e": "🌌", "ipa": "/ɪn ðəʊz dˈeɪz wiː wʊd stˈɑːgeɪz ˈɔːl nˈaɪt lˈɒŋ/"}];
const PER = 50;
let page = 0;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Highlight "would" and the main verb that follows it (skipping "always")
function markup(sentence){
  const parts = sentence.split(" ");
  const wi = parts.findIndex(p => /^would$/i.test(p.replace(/[^A-Za-z']/g,"")));
  if(wi < 0) return esc(sentence);
  let vi = wi + 1;
  if(parts[vi] && /^always$/i.test(parts[vi])) vi++;
  return parts.map((p,i)=>{
    if(i===wi) return "<mark>"+esc(p)+"</mark>";
    if(i===vi) {
      const m = p.match(/^([A-Za-z']+)(.*)$/);
      return m ? "<b>"+esc(m[1])+"</b>"+esc(m[2]) : esc(p);
    }
    return esc(p);
  }).join(" ");
}

function render(){
  const grid = document.getElementById("grid");
  const start = page*PER;
  grid.innerHTML = DATA.slice(start, start+PER).map((d,i)=>`
    <div class="card" tabindex="0" role="button" aria-label="การ์ดที่ ${start+i+1} กดเพื่อพลิก">
      <div class="inner">
        <div class="face front">
          <span class="num">${start+i+1}</span>
          <button class="spk" data-i="${start+i}" aria-label="อ่านออกเสียงประโยค" title="ฟังเสียง">🔊</button>
          <div class="pic" aria-hidden="true">${d.e}</div>
          <div class="txt">
            <p class="en">${markup(d.en)}</p>
            <p class="ipa">${esc(d.ipa)}</p>
          </div>
          <span class="hint">กดเพื่อดูคำแปล</span>
        </div>
        <div class="face back">
          <p class="th">${esc(d.th)}</p>
          <span class="th-small">กดเพื่อกลับ</span>
        </div>
      </div>
    </div>`).join("");
  document.getElementById("t0").setAttribute("aria-selected", page===0);
  document.getElementById("t1").setAttribute("aria-selected", page===1);
  window.scrollTo({top:0});
}

// ---------- Speech: prefer a British male voice ----------
let voice = null;
const MALE_HINTS = ["google uk english male","daniel","microsoft ryan","microsoft george","microsoft thomas","oliver","arthur","male"];
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const gb = vs.filter(v=>/en[-_]GB/i.test(v.lang));
  const en = vs.filter(v=>/^en/i.test(v.lang));
  const lower = v => v.name.toLowerCase();
  for(const h of MALE_HINTS){
    const hit = gb.find(v=>lower(v).includes(h)) || en.find(v=>lower(v).includes(h) && /en[-_]GB/i.test(v.lang));
    if(hit){voice=hit;break;}
  }
  if(!voice) voice = gb[0] || en.find(v=>/male|david|mark|james|guy|alex/i.test(v.name)) || en[0] || null;
  const n = document.getElementById("voiceNote");
  n.textContent = voice ? "เสียงที่ใช้: " + voice.name + " (" + voice.lang + ") — คุณภาพขึ้นกับเสียงที่มีในอุปกรณ์ของคุณ" : "ไม่พบเสียงภาษาอังกฤษในอุปกรณ์นี้";
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, btn){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  document.querySelectorAll(".spk.on").forEach(b=>b.classList.remove("on"));
  const u = new SpeechSynthesisUtterance(text);
  if(voice){u.voice = voice; u.lang = voice.lang;} else u.lang = "en-GB";
  u.rate = 0.88; u.pitch = 0.9;
  u.onstart = ()=>btn.classList.add("on");
  u.onend = u.onerror = ()=>btn.classList.remove("on");
  speechSynthesis.speak(u);
}

// ---------- Events ----------
document.getElementById("grid").addEventListener("click", e=>{
  const spk = e.target.closest(".spk");
  if(spk){ e.stopPropagation(); speak(DATA[+spk.dataset.i].en, spk); return; }
  const card = e.target.closest(".card");
  if(card) card.classList.toggle("flipped");
});
document.getElementById("grid").addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("card")){
    e.preventDefault(); e.target.classList.toggle("flipped");
  }
});
document.getElementById("t0").onclick = ()=>{page=0;render();};
document.getElementById("t1").onclick = ()=>{page=1;render();};
document.getElementById("reset").onclick = ()=>document.querySelectorAll(".card.flipped").forEach(c=>c.classList.remove("flipped"));
render();
