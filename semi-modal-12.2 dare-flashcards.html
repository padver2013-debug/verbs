<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12.2 Semi-modal "dare" – Flip Cards</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef3;--ink:#111;--muted:#52606d;--card:#fff;--tile:#eef2f6;--line:#cfd8e0;--red:#8b0000;--redbg:#fbe9e9;--btn:#14213d;--btnink:#fff;--back:#14213d;--backink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141b;--ink:#111;--muted:#9fb0c0;--line:#2a3846;--btn:#14213d;--back:#1d3557}}
:root[data-theme="dark"]{--bg:#0e141b;--ink:#111;--muted:#9fb0c0;--line:#2a3846;--btn:#14213d;--back:#1d3557}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{max-width:1100px;margin:0 auto;padding:22px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font:700 22px/1.2 Arial,sans-serif;color:var(--hd,#14213d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hd:#e6edf3}}
:root[data-theme="dark"]{--hd:#e6edf3}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.pager{display:flex;gap:8px;flex-wrap:wrap}
.pager button{font:600 14px Arial,sans-serif;padding:9px 16px;border-radius:999px;border:1.5px solid var(--btn);background:transparent;color:var(--hd,#14213d);cursor:pointer}
.pager button[aria-current="true"]{background:var(--btn);color:var(--btnink)}
.bar{max-width:1100px;margin:0 auto;padding:6px 16px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.bar select{font:13px Arial;padding:5px 8px;border-radius:8px;max-width:260px}
.bar button{font:600 13px Arial;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:#111;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{perspective:1200px;height:300px;cursor:pointer;outline:none}
.inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.front{background:var(--card);border:1px solid var(--line)}
.card:focus-visible .front,.card:focus-visible .back{box-shadow:0 0 0 3px #4a7bd0}
.pic{flex:0 0 112px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:68px;line-height:1;border-bottom:1px solid var(--line);position:relative}
.pic small{position:absolute;left:12px;top:8px;font:12px Arial;color:#52606d}
.txt{flex:1;padding:12px 18px 0;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center}
.en{font:300 21px/1.35 Arial,Helvetica,sans-serif;color:#000;margin:0}
.en b{font-weight:700;color:var(--red)}
.en b.dare{background:var(--redbg);border-radius:4px;padding:0 3px}
.ipa{font:400 16px/1.4 "Times New Roman",Times,serif;color:#333;margin:0}
.foot{padding:8px 12px 12px;display:flex;justify-content:space-between;align-items:center}
.hint{font-size:12px;color:#52606d}
.say{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--btn);color:#fff;font:600 13px Arial;padding:8px 14px;cursor:pointer}
.say:hover{filter:brightness(1.25)}
.say.on{background:var(--red)}
.back{background:var(--back);color:var(--backink);transform:rotateY(180deg);justify-content:center;align-items:center;padding:24px;text-align:center;gap:14px}
.back .th{font:500 24px/1.55 "Noto Sans Thai","Sarabun",Tahoma,Arial,sans-serif;margin:0}
.back .en2{font:300 14px/1.4 Arial;opacity:.75;margin:0}
.back .hint{color:#c8d3e0}
@media (max-width:720px){main{grid-template-columns:1fr}.card{height:310px}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>

<header>
  <div>
    <h1>12.2 Semi-modal “dare” · Boldness</h1>
    <div class="sub">คลิกการ์ดเพื่อดูคำแปล · กดปุ่มลำโพงเพื่อฟังเสียง (UK)</div>
  </div>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
</header>
<div class="bar">
  <label for="voice">Voice:</label><select id="voice"></select>
  <button id="flipAll" type="button">Flip all</button>
  <span id="vnote"></span>
</div>
<main id="grid"></main>
<script>
const DATA = [{"en": "Few people dare speak out against the corruption.", "th": "มีคนเพียงไม่กี่คนที่กล้าพูดต่อต้านการทุจริต", "ipa": "fjˈuː pˈiːpəl dˈeə spˈiːk ˈaʊt ɐɡˈɛnst ðə kəɹˈʌpʃən", "dare": 2, "verb": 3, "emo": "🗣️"}, {"en": "She had the dare to question the expert's thesis.", "th": "เธอกล้าพอที่จะตั้งคำถามกับวิทยานิพนธ์ของผู้เชี่ยวชาญ", "ipa": "ʃiː had ðə dˈeə tə kwˈɛstʃən ðɪ ˈɛkspɜːts θˈiːsɪs", "dare": 3, "verb": 5, "emo": "❓"}, {"en": "He dare to dream big despite his humble background.", "th": "กล้าที่จะฝันให้ยิ่งใหญ่แม้ว่าจะมีพื้นเพที่ยากจนก็ตาม", "ipa": "hiː dˈeə tə dɹˈiːm bˈɪɡ dɪspˈaɪt hɪz hˈʌmbəl bˈakɡɹaʊnd", "dare": 1, "verb": 3, "emo": "💭"}, {"en": "Who would dare to climb that treacherous mountain peak?", "th": "ใครจะกล้าปีนป่ายยอดเขาที่อันตรายลูกนั้น", "ipa": "hˌuː wʊd dˈeə tə klˈaɪm ðat tɹˈɛtʃəɹəs mˈaʊntɪn pˈiːk", "dare": 2, "verb": 4, "emo": "🧗"}, {"en": "They dare to innovate in a conservative industry.", "th": "พวกเขากล้าที่จะสร้างสรรค์นวัตกรรมใหม่ในอุตสาหกรรมที่อนุรักษ์นิยม", "ipa": "ðeɪ dˈeə tʊ ˈɪnəvˌeɪt ɪn ɐ kənsˈɜːvətˌɪv ˈɪndʌstɹi", "dare": 1, "verb": 3, "emo": "💡"}, {"en": "You must dare to take risks if you want to succeed.", "th": "คุณต้องกล้าที่จะเสี่ยงหากคุณต้องการประสบความสำเร็จ", "ipa": "juː mˈʌst dˈeə tə tˈeɪk ɹˈɪsks ɪf juː wˈɒnt tə səksˈiːd", "dare": 2, "verb": 4, "emo": "🎲"}, {"en": "She dare to wear unconventional fashion styles.", "th": "เธอกล้าที่จะสวมใส่แฟชั่นสไตล์แหวกแนว", "ipa": "ʃiː dˈeə tə wˈeəɹ ʌŋkənvˈɛnʃənəl fˈaʃən stˈaɪlz", "dare": 1, "verb": 3, "emo": "👔"}, {"en": "He had the dare to invest his entire life savings.", "th": "เขากล้าพอที่จะลงทุนเงินเก็บทั้งชีวิตของเขา", "ipa": "hiː had ðə dˈeə tʊ ɪnvˈɛst hɪz ɛntˈaɪə lˈaɪf sˈeɪvɪŋz", "dare": 3, "verb": 5, "emo": "💰"}, {"en": "We dare to challenge the status quo every day.", "th": "พวกเรากล้าที่จะท้าทายสภาพที่เป็นอยู่ทุกวัน", "ipa": "wiː dˈeə tə tʃˈalɪndʒ ðə stˈeɪtəs kwˈəʊ ˈɛvɹɪ dˈeɪ", "dare": 1, "verb": 3, "emo": "🥊"}, {"en": "Only a few explorers dare to explore the deep cave.", "th": "มีเพียงนักสำรวจไม่กี่คนที่กล้าสำรวจถ้ำลึกนั้น", "ipa": "ˈəʊnli ɐ fjˈuː ɛksplˈɔːɹəz dˈeə tʊ ɛksplˈɔː ðə dˈiːp kˈeɪv", "dare": 4, "verb": 6, "emo": "🔍"}, {"en": "She dare to propose a radical new company policy.", "th": "เธอกล้าที่จะเสนอนโยบายบริษัทใหม่แบบพลิกโฉม", "ipa": "ʃiː dˈeə tə pɹəpˈəʊz ɐ ɹˈadɪkəl njˈuː kˈʌmpəni pˈɒlɪsi", "dare": 1, "verb": 3, "emo": "📝"}, {"en": "He had the dare to defend his friends in danger.", "th": "เขากล้าพอที่จะปกป้องเพื่อน ๆ ของเขาที่กำลังตกอยู่ในอันตราย", "ipa": "hiː had ðə dˈeə tə dɪfˈɛnd hɪz fɹˈɛndz ɪn dˈeɪndʒə", "dare": 3, "verb": 5, "emo": "🛡️"}, {"en": "They dare to pursue their passions against all odds.", "th": "พวกเขากล้าที่จะทำตามความหลงใหลของตนเองท่ามกลางอุปสรรคทั้งปวง", "ipa": "ðeɪ dˈeə tə pəsjˈuː ðeə pˈaʃənz ɐɡˈɛnst ˈɔːl ˈɒdz", "dare": 1, "verb": 3, "emo": "🎯"}, {"en": "You dare to stand up for what you believe in.", "th": "คุณกล้าที่จะยืนหยัดเพื่อสิ่งที่คุณเชื่อมั่น", "ipa": "juː dˈeə tə stˈand ˌʌp fɔː wɒt juː bɪlˈiːv ˈɪn", "dare": 1, "verb": 3, "emo": "🧍"}, {"en": "She dare to confront her deepest inner fears.", "th": "เธอกล้าที่จะเผชิญหน้ากับความกลัวลึก ๆ ภายในใจของเธอ", "ipa": "ʃiː dˈeə tə kənfɹˈʌnt hɜː dˈiːpɪst ˈɪnə fˈiəz", "dare": 1, "verb": 3, "emo": "😠"}, {"en": "He had the dare to quit his stable job to start a business.", "th": "เขากล้าพอที่จะลาออกจากงานที่มั่นคงเพื่อมาทำธุรกิจ", "ipa": "hiː had ðə dˈeə tə kwˈɪt hɪz stˈeɪbəl dʒˈɒb tə stˈɑːt ɐ bˈɪznəs", "dare": 3, "verb": 5, "emo": "🚪"}, {"en": "We dare to imagine a sustainable future.", "th": "พวกเรากล้าที่จะจินตนาการถึงอนาคตที่ยั่งยืน", "ipa": "wiː dˈeə tʊ ɪmˈadʒɪn ɐ səstˈeɪnəbəl fjˈuːtʃə", "dare": 1, "verb": 3, "emo": "🌈"}, {"en": "They dare to experiment with unusual ingredients.", "th": "พวกเขากล้าที่จะทดลองใช้วัตถุดิบแปลกใหม่", "ipa": "ðeɪ dˈeə tʊ ɛkspˈɛɹɪmənt wɪð ʌnjˈuːʒuːəl ɪŋɡɹˈiːdiənts", "dare": 1, "verb": 3, "emo": "⚗️"}, {"en": "She dare to express her unique artistic vision.", "th": "เธอกล้าที่จะแสดงวิสัยทัศน์ทางศิลปะที่เป็นเอกลักษณ์ขอ "th": "เธอกล้าพอที่จะริเริ่มขับเคลื่อนการเคลื่อนไหวทางศิลปะระดับโลก", "ipa": "ʃiː had ðə dˈeə tə lˈɔːntʃ ɐ ɡlˈəʊbəl ˈɑːts mˈuːvmənt", "dare": 3, "verb": 5, "emo": "🚀"}, {"en": "He dare to express unpopular political opinions.", "th": "เขากล้าที่จะแสดงความคิดเห็นทางการเมืองที่ไม่เป็นที่นิยม", "ipa": "hiː dˈeə tʊ ɛkspɹˈɛs ʌnpˈɒpjʊlə pəlˈɪtɪkəl əpˈɪniənz", "dare": 1, "verb": 3, "emo": "💬"}, {"en": "They had the dare to defend minority communities.", "th": "พวกเขากล้าพอที่จะปกป้องกลุ่มชนกลุ่มน้อย", "ipa": "ðeɪ had ðə dˈeə tə dɪfˈɛnd maɪnˈɒɹɪti kəmjˈuːnɪtiz", "dare": 3, "verb": 5, "emo": "🛡️"}, {"en": "We dare to pursue groundbreaking medical research.", "th": "พวกเรากล้าที่จะศึกษาวิจัยทางการแพทย์ที่ก้าวล้ำ", "ipa": "wiː dˈeə tə pəsjˈuː ɡɹˈaʊndbɹeɪkɪŋ mˈɛdɪkəl ɹɪsˈɜːtʃ", "dare": 1, "verb": 3, "emo": "🎯"}, {"en": "You dare to confront personal emotional barriers.", "th": "คุณกล้าที่จะเผชิญหน้ากับอุปสรรคทางอารมณ์ส่วนตัว", "ipa": "juː dˈeə tə kənfɹˈʌnt pˈɜːsənəl ɪmˈəʊʃənəl bˈaɹiəz", "dare": 1, "verb": 3, "emo": "😠"}, {"en": "She had the dare to investigate deep-sea ecosystems.", "th": "เธอกล้าพอที่จะสำรวจศึกษาหาระบบนิเวศใต้ท้องทะเลลึก", "ipa": "ʃiː had ðə dˈeə tʊ ɪnvˈɛstɪɡˌeɪt dˈiːpsˈiː ˈiːkəʊsˌɪstəmz", "dare": 3, "verb": 5, "emo": "🕵️"}, {"en": "He dare to experiment with advanced software algorithms.", "th": "เขากล้าที่จะทดลองใช้อัลกอริทึมซอฟต์แวร์ขั้นสูง", "ipa": "hiː dˈeə tʊ ɛkspˈɛɹɪmənt wɪð ɐdvˈanst sˈɒftweəɹ ˈalɡəɹˌɪθəmz", "dare": 1, "verb": 3, "emo": "⚗️"}];
const PER_PAGE = 25;
const pages = Math.ceil(DATA.length / PER_PAGE);
let page = 0, voices = [], chosen = null;
const grid = document.getElementById('grid'), pager = document.getElementById('pager');

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function mark(d){
  return d.en.split(' ').map((w,i)=>{
    const m = w.match(/^([^A-Za-z']*)([A-Za-z'’-]+)(.*)$/);
    if(!m || (i!==d.dare && i!==d.verb)) return esc(w);
    const cls = i===d.dare ? ' class="dare"' : '';
    return esc(m[1])+'<b'+cls+'>'+esc(m[2])+'</b>'+esc(m[3]);
  }).join(' ');
}
function render(){
  grid.innerHTML = '';
  const start = page*PER_PAGE;
  DATA.slice(start,start+PER_PAGE).forEach((d,k)=>{
    const n = start+k+1;
    const el = document.createElement('div');
    el.className='card'; el.tabIndex=0; el.setAttribute('role','button');
    el.setAttribute('aria-label','Card '+n+': '+d.en+' (press to flip)');
    el.innerHTML = `<div class="inner">
      <div class="face front">
        <div class="pic" aria-hidden="true"><small>${n}</small>${d.emo}</div>
        <div class="txt"><p class="en">${mark(d)}</p><p class="ipa">/${esc(d.ipa)}/</p></div>
        <div class="foot"><button class="say" type="button" aria-label="Read sentence aloud">🔊 Listen</button><span class="hint">แตะเพื่อดูคำแปล</span></div>
      </div>
      <div class="face back"><p class="th">${esc(d.th)}</p><p class="en2">${esc(d.en)}</p><span class="hint">แตะเพื่อกลับ</span></div>
    </div>`;
    el.addEventListener('click',()=>el.classList.toggle('flipped'));
    el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===el){e.preventDefault();el.classList.toggle('flipped')}});
    const b = el.querySelector('.say');
    b.addEventListener('click',e=>{e.stopPropagation();speak(d.en,b)});
    b.addEventListener('keydown',e=>e.stopPropagation());
    grid.appendChild(el);
  });
  pager.innerHTML='';
  for(let p=0;p<pages;p++){
    const s=p*PER_PAGE+1, e=Math.min((p+1)*PER_PAGE,DATA.length);
    const b=document.createElement('button');
    b.textContent=`Page ${p+1} (${s}–${e})`;
    if(p===page) b.setAttribute('aria-current','true');
    b.onclick=()=>{page=p;render();window.scrollTo({top:0})};
    pager.appendChild(b);
  }
}
document.getElementById('flipAll').onclick=()=>{
  const cs=[...grid.children]; const allOn=cs.every(c=>c.classList.contains('flipped'));
  cs.forEach(c=>c.classList.toggle('flipped',!allOn));
};

/* ---- Speech: prefer a British male voice ---- */
const MALE_HINTS=['daniel','google uk english male','ryan','george','thomas','oliver','arthur','male'];
function pickVoice(){
  voices = (window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  const sel=document.getElementById('voice'); sel.innerHTML='';
  const score=v=>{const n=v.name.toLowerCase();let s=0;
    if(/en[-_]gb/i.test(v.lang))s+=10;
    MALE_HINTS.forEach((h,i)=>{if(n.includes(h))s+=8-i*0.5});
    if(/natural|neural|online/.test(n))s+=6;
    if(/female|libby|sonia|maisie|kate|serena|susan|hazel|google uk english female/.test(n))s-=20;
    return s};
  voices.sort((a,b)=>score(b)-score(a));
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
  chosen=voices[0]||null;
  document.getElementById('vnote').textContent = chosen ? '' : 'No English voice found on this device.';
}
document.getElementById('voice').onchange=e=>{chosen=voices[+e.target.value]};
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let activeBtn=null;
function speak(text,btn){
  if(!window.speechSynthesis){alert('This browser does not support speech.');return}
  speechSynthesis.cancel();
  if(activeBtn)activeBtn.classList.remove('on');
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; if(chosen)u.voice=chosen; u.rate=0.9; u.pitch=0.85;
  btn.classList.add('on'); activeBtn=btn;
  u.onend=u.onerror=()=>btn.classList.remove('on');
  speechSynthesis.speak(u);
}
render();
</script>
