<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipping Cards – Shopping Actions</title>
<style>
:root{--bg:linear-gradient(160deg,#fde8f3,#e8f1ff 55%,#e6fbf0);--tx:#4a3a5c;--f1:#ffffff;--f2:#fbf3ff;--b1:#f5a3c7;--b2:#ffd1e3;--sh:rgba(170,130,200,.3);--pill:#ffffffd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI","Noto Sans Thai",system-ui,sans-serif;padding:12px}
h1{font-size:clamp(1.1rem,3.2vw,1.6rem);margin:4px 0 10px;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:10px}
.pill{background:var(--pill);padding:8px 14px;border-radius:999px;font-weight:700;box-shadow:0 3px 8px var(--sh)}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;padding:9px 16px;font-weight:700;color:#3f2f55;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 4px 10px var(--sh)}
button.c{background:linear-gradient(135deg,#ff6b6b,#d63a5a);color:#fff}
button:active{transform:scale(.96)}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--pill);color:var(--tx);box-shadow:0 2px 6px var(--sh)}
.tabs button.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#3f2f55}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.6vw,16px);max-width:1000px;margin:0 auto}
@media(max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{perspective:800px;aspect-ratio:4/3;cursor:pointer;-webkit-tap-highlight-color:transparent}
.in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.card.fl .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:clamp(14px,2.4vw,24px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;
box-shadow:0 10px 18px var(--sh),inset 0 2px 4px rgba(255,255,255,.6),inset 0 -6px 10px rgba(190,150,220,.2);background:linear-gradient(160deg,var(--f1),var(--f2))}
.bk{transform:rotateY(180deg);background:linear-gradient(135deg,var(--b1),var(--b2));color:#3f2f55}
.w{font-weight:800;font-size:clamp(.9rem,2.6vw,1.6rem);word-break:break-word}
.p{font-size:clamp(.6rem,1.5vw,.85rem);opacity:.7;margin-top:3px}
.th{font-size:clamp(.95rem,2.6vw,1.5rem);font-weight:700}
.sp{position:absolute;right:5px;bottom:5px;width:28px;height:28px;padding:0;font-size:.8rem;line-height:28px}
.done .fc:not(.bk){outline:2px solid #3ccf8e}
#msg{text-align:center;margin-top:12px;font-weight:700;min-height:1.4em}
body{min-height:100vh;background-attachment:fixed}.card:nth-child(5n+1) .bk{background:linear-gradient(135deg,#ffc9de,#ffe3ee)}.card:nth-child(5n+1) .fc:not(.bk){background:linear-gradient(160deg,#fff,#ffe3ee)}.card:nth-child(5n+2) .bk{background:linear-gradient(135deg,#c9f0dd,#e6faf0)}.card:nth-child(5n+2) .fc:not(.bk){background:linear-gradient(160deg,#fff,#e6faf0)}.card:nth-child(5n+3) .bk{background:linear-gradient(135deg,#d9ccff,#efe9ff)}.card:nth-child(5n+3) .fc:not(.bk){background:linear-gradient(160deg,#fff,#efe9ff)}.card:nth-child(5n+4) .bk{background:linear-gradient(135deg,#ffdcc2,#fff0e3)}.card:nth-child(5n+4) .fc:not(.bk){background:linear-gradient(160deg,#fff,#fff0e3)}.card:nth-child(5n+5) .bk{background:linear-gradient(135deg,#c5e3ff,#e4f2ff)}.card:nth-child(5n+5) .fc:not(.bk){background:linear-gradient(160deg,#fff,#e4f2ff)}</style></head><body>
<h1>20. Shopping Actions | การซื้อของ</h1>
<div class="bar">
<span class="pill">⏱ <span id="t">00:00</span></span>
<span class="pill">⭐ <span id="s">0</span>/<span id="n"></span></span>
<button id="rs">▶ เริ่มเล่น</button><button id="cc" class="c">✖ ยกเลิก</button>
</div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="g"></div>
<div id="msg">คลิกการ์ดเพื่อฟังเสียงและพลิกดูคำแปล (ได้ 1 คะแนนต่อการ์ดที่เปิดครั้งแรก)</div>
<script>
const RAW=`bargain|ˈbɑːɡən|ต่อรองราคา
bid|bɪd|ประมูล
borrow|ˈbɒrəʊ|ยืม
botch|bɒtʃ|ทำพลาด / ทำเสีย
browse|braʊz|เดินดูของ
budget|ˈbʌdʒɪt|ตั้งงบประมาณ
buy|baɪ|ซื้อ
cancel|ˈkænsəl|ยกเลิก
cart|kɑːt|ใส่ตะกร้า / รถเข็น
cash|kæʃ|แลกเป็นเงินสด
charge|tʃɑːdʒ|เรียกเก็บเงิน / ชาร์จ
check|tʃek|ตรวจสอบ / เช็กเอาต์
choose|tʃuːz|เลือก
claim|kleɪm|เรียกร้อง / อ้างสิทธิ์
compare|kəmˈpeə(r)|เปรียบเทียบ
complain|kəmˈpleɪn|ร้องเรียน / บ่น
confirm|kənˈfɜːm|ยืนยัน
consume|kənˈsjuːm|บริโภค
coupon|ˈkuːpɒn|คูปอง
credit|ˈkredɪt|เครดิต / ให้เครดิต
decide|dɪˈsaɪd|ตัดสินใจ
deliver|dɪˈlɪvə(r)|จัดส่ง
demand|dɪˈmɑːnd|เรียกร้อง / ความต้องการ
discount|ˈdɪskaʊnt|ลดราคา
download|ˌdaʊnˈləʊd|ดาวน์โหลด
earn|ɜːn|ได้รับ / หาเงิน
enquire|ɪnˈkwaɪə(r)|สอบถาม
evaluate|ɪˈvæljueɪt|ประเมินค่า
exchange|ɪksˈtʃeɪndʒ|แลกเปลี่ยน
filter|ˈfɪltə(r)|กรอง
finance|ˈfaɪnæns|จัดหาเงินทุน / ผ่อน
find|faɪnd|ค้นหา / พบ
fit|fɪt|พอดี / ลองสวม
fulfill|fʊlˈfɪl|ทำให้สำเร็จ / จัดส่งตามออเดอร์
gather|ˈɡæðə(r)|รวบรวม
gift|ɡɪft|ให้ของขวัญ
grab|ɡræb|คว้า
guarantee|ˌɡærənˈtiː|รับประกัน
haggle|ˈhæɡl|ต่อราคา
inspect|ɪnˈspekt|ตรวจดู
invest|ɪnˈvest|ลงทุน
invoice|ˈɪnvɔɪs|ออกใบแจ้งหนี้
join|dʒɔɪn|เข้าร่วม / สมัครสมาชิก
lease|liːs|เช่า
lend|lend|ให้ยืม
like|laɪk|ชอบ
locate|ˈləʊkeɪt|ระบุตำแหน่ง
look|lʊk|มอง
lose|luːz|สูญเสีย
lower|ˈləʊə(r)|ลดลง
manage|ˈmæn.ɪdʒ|จัดการ
mark|mɑːk|ทำเครื่องหมาย
market|ˈmɑː.kɪt|ทำการตลาด / ตลาด
match|mætʃ|จับคู่ / เข้ากัน
measure|ˈmeʒ.ər|วัด
merge|mɜːdʒ|รวมเข้าด้วยกัน
monopolize|məˈnɒp.əl.aɪz|ผูกขาด
mortgage|ˈmɔː.ɡɪdʒ|จำนอง
navigate|ˈnæv.ɪ.ɡeɪt|นำทาง
negotiate|nɪˈɡəʊ.ʃi.eɪt|เจรจาต่อรอง
obtain|əbˈteɪn|ได้มา
offer|ˈɒf.ər|เสนอ
open|ˈəʊ.pən|เปิด
order|ˈɔː.dər|สั่งซื้อ
organize|ˈɔː.ɡən.aɪz|จัดระเบียบ
outbid|aʊtˈbɪd|ประมูลสูงกว่า
outsource|ˈaʊt.sɔːs|จ้างภายนอก
overcharge|ˌəʊ.vəˈtʃɑːdʒ|เก็บเงินเกินราคา
overpay|ˌəʊ.vəˈpeɪ|จ่ายเกินราคา
package|ˈpæk.ɪdʒ|บรรจุหีบห่อ
pack|pæk|แพ็ก
patronize|ˈpæt.rə.naɪz|อุดหนุน / เป็นลูกค้าประจำ
pay|peɪ|จ่ายเงิน
pick|pɪk|เลือก / หยิบ
pillage|ˈpɪl.ɪdʒ|ปล้นสะดม
place|pleɪs|วาง / ทำการสั่ง
pledge|pledʒ|ให้คำมั่น / จำนำ
pre-order|priːˈɔː.dər|สั่งจองล่วงหน้า
price|praɪs|ตั้งราคา
procure|prəˈkjʊər|จัดหา
promote|prəˈməʊt|โปรโมต / ส่งเสริมการขาย
propose|prəˈpəʊz|เสนอ
purchase|ˈpɜː.tʃəs|ซื้อ / จัดซื้อ
query|ˈkwɪə.ri|สอบถาม
queue|kjuː|เข้าคิว
quote|kwəʊt|เสนอราคา
re-order|ˌriːˈɔː.dər|สั่งซื้อซ้ำ
rebate|ˈriː.beɪt|ส่วนลดเงินคืน
receipt|rɪˈsiːt|ใบเสร็จ
receive|rɪˈsiːv|ได้รับ
reclaim|rɪˈkleɪm|เรียกคืน
recommend|ˌrek.əˈmend|แนะนำ
redeem|rɪˈdiːm|แลกคูปอง / ไถ่ถอน
reduce|rɪˈdjuːs|ลด
refund|riːˈfʌnd|คืนเงิน
register|ˈredʒ.ɪ.stər|ลงทะเบียน / เครื่องคิดเงิน
reimburse|ˌriː.ɪmˈbɜːs|ชดใช้คืน
re-stock|ˌriːˈstɒk|เติมสต็อก
retail|ˈriː.teɪl|ขายปลีก
return|rɪˈtɜːn|คืนสินค้า`.split("\n").map(l=>{const[a,b,c]=l.split("|");return{w:a,p:"/"+b+"/",t:c}});
let data=RAW.slice(),tab=0,seen=new Set(),score=0,sec=0,timer=null,voice=null;
const $=id=>document.getElementById(id),g=$("g");
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]GB/i.test(x.lang));
voice=v.find(x=>/daniel|oliver|arthur|google uk english male|male/i.test(x.name))||v[0]||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang))||null}
if("speechSynthesis"in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(w){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";if(voice)u.voice=voice;u.pitch=1.15;u.rate=.85;speechSynthesis.speak(u)}
function fmt(){$("t").textContent=String(sec/60|0).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function start(){clearInterval(timer);timer=setInterval(()=>{sec++;fmt()},1000)}
function render(){g.innerHTML="";data.slice(tab*25,tab*25+25).forEach(d=>{
const c=document.createElement("div");c.className="card"+(seen.has(d.w)?" done":"");
c.innerHTML=`<div class="in"><div class="fc"><div class="w">${d.w}</div><div class="p">${d.p}</div><button class="sp" title="ฟังเสียง">🔊</button></div><div class="fc bk"><div class="th">${d.t}</div><div class="p">${d.w}</div></div></div>`;
c.querySelector(".sp").onclick=e=>{e.stopPropagation();say(d.w)};
c.onclick=()=>{const f=c.classList.toggle("fl");say(d.w);
if(f&&!seen.has(d.w)){if(!timer)start();seen.add(d.w);score++;$("s").textContent=score;c.classList.add("done");
if(score===RAW.length){clearInterval(timer);$("msg").textContent="🎉 ครบทุกคำ! ใช้เวลา "+$("t").textContent}}};
g.appendChild(c)})}
function tabs(){const t=$("tabs");t.innerHTML="";for(let i=0;i<Math.ceil(RAW.length/25);i++){const b=document.createElement("button");b.textContent=`Tab ${i+1} (${i*25+1}-${Math.min(i*25+25,RAW.length)})`;b.className=i===tab?"on":"";b.onclick=()=>{tab=i;tabs();render()};t.appendChild(b)}}
function reset(shuffle){clearInterval(timer);timer=null;speechSynthesis.cancel();sec=0;score=0;seen.clear();fmt();$("s").textContent=0;
data=RAW.slice();if(shuffle)for(let i=data.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[data[i],data[j]]=[data[j],data[i]]}
$("msg").textContent=shuffle?"เริ่มแล้ว! พลิกการ์ดให้ครบ":"ยกเลิกแล้ว กดเริ่มเล่นเพื่อเล่นใหม่";render()}
$("rs").onclick=()=>{reset(true);start();$("rs").textContent="↻ เริ่มใหม่"};
$("cc").onclick=()=>{reset(false);$("rs").textContent="▶ เริ่มเล่น"};
$("n").textContent=RAW.length;tabs();render();
</script></body></html>
