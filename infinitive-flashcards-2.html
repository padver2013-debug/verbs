<h1>2. Infinitive with “to” — as the object of verbs of a sentence</h1>

W|hope to see|həʊp tə siː|👋|หวังว่าจะได้พบ|I hope to see you again soon.|ฉันหวังว่าจะได้พบคุณอีกในเร็วๆ นี้
E|fail to meet|feɪl tə miːt|📉|ทำไม่ถึงเกณฑ์|The team failed to meet the deadline.|ทีมไม่สามารถทำตามกำหนดเวลาได้
P|decide to take|dɪˈsaɪd tə teɪk|🚌|ตัดสินใจนั่ง|We decided to take the bus.|เราตัดสินใจนั่งรถบัส
E|manage to finish|ˈmæn.ɪdʒ tə ˈfɪn.ɪʃ|💪|ทำจนสำเร็จ|She managed to finish the report before noon.|เธอทำรายงานเสร็จได้ก่อนเที่ยง
R|ask to leave|ɑːsk tə liːv|🙋|ขอไป|He asked to leave early.|เขาขอกลับก่อน

P|plan to renovate|plæn tə ˈren.ə.veɪt|🏠|วางแผนปรับปรุง|They plan to renovate the kitchen.|พวกเขาวางแผนปรับปรุงห้องครัว
R|invite to join|ɪnˈvaɪt tə dʒɔɪn|🎉|เชิญเข้าร่วม|They invited me to join the club.|พวกเขาเชิญฉันเข้าร่วมชมรม

W|want to learn|wɒnt tə lɜːn|📚|อยากเรียนรู้|I want to learn how to swim.|ฉันอยากเรียนว่ายน้ำ
W|hope to get|həʊp tə ɡet|🎯|หวังว่าจะได้|She hopes to get a scholarship.|เธอหวังว่าจะได้รับทุนการศึกษา
E|try to explain|traɪ tə ɪkˈspleɪn|🧑‍🏫|พยายามอธิบาย|The teacher tried to explain the rule again.|ครูพยายามอธิบายกฎอีกครั้ง
P|plan to attend|plæn tə əˈtend|🏛️|วางแผนเข้าร่วม|We plan to attend the conference.|เราวางแผนเข้าร่วมการประชุมสัมมนา
P|decide to leave|dɪˈsaɪd tə liːv|👣|ตัดสินใจจากไป|She decided to leave the city.|เธอตัดสินใจย้ายออกจากเมือง
W|need to find|niːd tə faɪnd|🔎|ต้องหา|I need to find my keys.|ฉันต้องหากุญแจของฉัน
W|want to travel|wɒnt tə ˈtræv.əl|✈️|อยากเดินทาง|He wants to travel by plane.|เขาอยากเดินทางโดยเครื่องบิน
A|refuse to participate|rɪˈfjuːz tə pɑːˈtɪs.ɪ.peɪt|🚫|ปฏิเสธที่จะเข้าร่วม|Some students refused to participate in the test.|นักเรียนบางคนปฏิเสธที่จะเข้าร่วมการสอบ
W|hope to learn|həʊp tə lɜːn|🌟|หวังว่าจะได้เรียน|He hopes to learn French next year.|เขาหวังว่าจะได้เรียนภาษาฝรั่งเศสปีหน้า
P|plan to visit|plæn tə ˈvɪz.ɪt|🗼|วางแผนไปเยือน|They plan to visit Paris this summer.|พวกเขาวางแผนไปเยือนปารีสในฤดูร้อนนี้
R|ask to join|ɑːsk tə dʒɔɪn|🙏|ขอเข้าร่วม|She asked to join our team.|เธอขอเข้าร่วมทีมของเรา
A|promise to finish|ˈprɒm.ɪs tə ˈfɪn.ɪʃ|📝|สัญญาว่าจะทำให้เสร็จ|He promised to finish the essay tonight.|เขาสัญญาว่าจะเขียนเรียงความให้เสร็จคืนนี้
E|forget to buy|fəˈɡet tə baɪ|🛒|ลืมซื้อ|I forgot to buy milk.|ฉันลืมซื้อนม
E|try to fix|traɪ tə fɪks|🔧|พยายามซ่อม|He tried to fix the broken bike.|เขาพยายามซ่อมจักรยานที่พัง
A|agree to help|əˈɡriː tə help|🧹|ตกลงช่วย|Everyone agreed to help clean the park.|ทุกคนตกลงช่วยทำความสะอาดสวนสาธารณะ
R|offer to drive|ˈɒf.ə tə draɪv|🚗|เสนอที่จะขับรถ|She offered to drive us to the airport.|เธอเสนอที่จะขับรถไปส่งเราที่สนามบิน
R|invite to the party|ɪnˈvaɪt tə ðə ˈpɑː.ti|🎈|เชิญไปงานปาร์ตี้|We invited her to the party.|เราเชิญเธอไปงานปาร์ตี้
W|would like to start|wʊd laɪk tə stɑːt|🚀|อยากเริ่ม|I would like to start the meeting now.|ฉันอยากเริ่มการประชุมตอนนี้
W|hope to receive|həʊp tə rɪˈsiːv|📬|หวังว่าจะได้รับ|We hope to receive your reply soon.|เราหวังว่าจะได้รับคำตอบจากคุณเร็วๆ นี้
E|forget to bring|fəˈɡet tə brɪŋ|📓|ลืมนำมา|She forgot to bring her notebook.|เธอลืมนำสมุดจดมา
R|invite to their wedding|ɪnˈvaɪt tə ðeə ˈwed.ɪŋ|💒|เชิญไปงานแต่งงาน|They invited us to their wedding.|พวกเขาเชิญเราไปงานแต่งงานของพวกเขา
W|need to see|niːd tə siː|🩺|ต้องไปพบ|You need to see a doctor.|คุณต้องไปพบแพทย์
P|plan to go|plæn tə ɡəʊ|🏖️|วางแผนไป|We plan to go to the beach on Sunday.|เราวางแผนไปทะเลวันอาทิตย์
A|refuse to work|rɪˈfjuːz tə wɜːk|😤|ปฏิเสธที่จะทำงาน|The old printer refuses to work today.|เครื่องพิมพ์เก่าไม่ยอมทำงานวันนี้
P|decide to leave|dɪˈsaɪd tə liːv|🚦|ตัดสินใจออกเดินทาง|He decided to leave early to avoid traffic.|เขาตัดสินใจออกเดินทางแต่เช้าเพื่อเลี่ยงรถติด
R|tell to stay|tel tə steɪ|🛑|บอกให้อยู่|The nurse told him to stay in bed.|พยาบาลบอกให้เขาอยู่บนเตียง
W|want to learn|wɒnt tə lɜːn|🧠|อยากเรียนรู้|They want to learn to cook Thai food.|พวกเขาอยากเรียนทำอาหารไทย
A|agree to give|əˈɡriː tə ɡɪv|🎁|ตกลงให้|The company agreed to give a refund.|บริษัทตกลงคืนเงินให้
E|manage to find|ˈmæn.ɪdʒ tə faɪnd|🔍|หามาได้สำเร็จ|We managed to find a cheap hotel.|เราหาโรงแรมราคาถูกได้สำเร็จ
R|offer to pick|ˈɒf.ə tə pɪk|🚕|เสนอที่จะไปรับ|He offered to pick me up at six.|เขาเสนอที่จะไปรับฉันตอนหกโมง
R|suggest to change|səˈdʒest tə tʃeɪndʒ|🔄|แนะนำให้เปลี่ยน|She suggested to change the meeting time.|เธอแนะนำให้เปลี่ยนเวลาประชุม
E|fail to meet|feɪl tə miːt|⏰|ทำไม่ถึงเกณฑ์|Some students fail to meet the requirements.|นักเรียนบางคนไม่ผ่านเกณฑ์ที่กำหนด
P|decide to take|dɪˈsaɪd tə teɪk|💼|ตัดสินใจรับ|He decided to take the job offer.|เขาตัดสินใจรับข้อเสนองาน
P|plan to visit|plæn tə ˈvɪz.ɪt|🏯|วางแผนไปเยี่ยมชม|I plan to visit the museum tomorrow.|ฉันวางแผนไปพิพิธภัณฑ์พรุ่งนี้`.split("\n").map(l=>{const a=l.split("|");return{c:a[0],w:a[1],ipa:"/"+a[2]+"/",e:a[3],th:a[4],s:a[5],st:a[6]}});
const K=Object.keys(CATS);let tab=0,list=[];
const $=id=>document.getElementById(id);
// speech: pick the best en-GB voice available
let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));
 const sc=x=>(/natural|online|neural/i.test(x.name)?4:0)+(/google/i.test(x.name)?3:0)+(/sonia|libby|ryan|daniel|serena|kate/i.test(x.name)?2:0);
 voice=v.sort((a,b)=>sc(b)-sc(a))[0]||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.88;speechSynthesis.speak(u)}
function render(){
 list=D.map((x,n)=>[x,n]).filter(a=>a[0].c==K[tab]);
 $("grid").innerHTML=list.map(([d,g],k)=>{const c=CATS[d.c][1];return `<div class="scene"><div class="card" onclick="this.classList.toggle('flip')"><div class="face" style="background:${c}"><div class="hint">2. Infinitive with “to” as the object of verbs</div><div class="emoji">${d.e}</div><div class="word">${d.w}</div><div class="ipa">${d.ipa}</div><button class="spk" title="ฟังเสียง" onclick="event.stopPropagation();say(D[${g}].w.toLowerCase())">🔊</button></div><div class="face back" style="background:${c}"><div class="th thw">${d.th}</div><div class="sen">${d.s}</div><button class="spk" title="ฟังประโยค" onclick="event.stopPropagation();say(D[${g}].s)">🔊</button><div class="th sth">${d.st}</div></div></div></div>`}).join("");
 $("tb").innerHTML=list.map(([x,g],k)=>`<tr><td>${k+1}</td><td class="v">${x.w}</td><td class="t">${x.th}</td><td>${x.s}</td><td class="t">${x.st}</td><td><button class="spk" onclick="say(D[${g}].s)">🔊</button></td></tr>`).join("");
 document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("on",n==tab));
}
function setTab(n){tab=n;render()}
$("tabs").innerHTML=K.map((k,n)=>`<button class="tab" onclick="setTab(${n})">${CATS[k][0]} (${D.filter(x=>x.c==k).length})</button>`).join("");
setTab(0);
</script></body></html>
