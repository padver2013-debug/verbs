<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparative in English – Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf5;--tx:#3b3340;--card:#fff;--line:#eadff0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2530;--tx:#f1e9f5;--card:#3a3342;--line:#52485c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2530;--tx:#f1e9f5;--card:#3a3342;--line:#52485c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,'Segoe UI',sans-serif}
.w{max-width:900px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.6rem;text-align:center;margin:8px 0 4px}
.sub{text-align:center;font-family:Sarabun,sans-serif;opacity:.8;margin-bottom:6px}
.tot{text-align:center;font-size:.9rem;opacity:.7;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.c{display:block;text-decoration:none;color:#3b3340;border-radius:22px;padding:16px;box-shadow:0 2px 8px #0002;transition:transform .15s}
a.c:hover,a.c:focus-visible{transform:translateY(-3px)}
.top{display:flex;align-items:center;justify-content:space-between}
.no{font-weight:700;font-size:.85rem;background:#fff9;border-radius:12px;padding:2px 10px}
.em{font-size:2rem}
.t{font-size:1.2rem;font-weight:700;margin:6px 0 0}
.th{font-family:Sarabun,sans-serif;font-size:.95rem;font-weight:600}
.d{font-family:Sarabun,sans-serif;font-size:.82rem;margin:6px 0}
.ex{font-size:.85rem;font-style:italic}
.ex b{color:#b0006c}
.n{margin-top:8px;font-size:.8rem;font-weight:700}
footer{text-align:center;font-family:Sarabun,sans-serif;font-size:.8rem;opacity:.65;margin-top:22px}
</style></head><body><div class="w">
<h1>Comparative in English</h1>
<div class="sub">ชุด Flashcard ฝึกอ่านและแปลรูปประโยคเปรียบเทียบ 6 หมวด</div>
<div class="tot" id="tot"></div>
<div class="grid" id="g"></div>
<footer>เก็บไฟล์ทั้งหมดไว้ในโฟลเดอร์เดียวกัน เพื่อให้ลิงก์ทำงานได้</footer>
</div>
<script>
const T=[
["comparative-one-syllable-flashcards.html","1.1","📏","One-syllable Adjectives","adjective + -er + than","คำคุณศัพท์พยางค์เดียว เติม -er","My house is <b>bigger than</b> yours.",150,"5 แท็บ"],
["comparative-y-adjectives-flashcards.html","1.2","😊","Adjectives ending in -y","-y → -ier + than","คำคุณศัพท์ลงท้าย -y เปลี่ยนเป็น -ier","She is <b>happier than</b> she was last year.",150,"5 แท็บ"],
["comparative-more-less-flashcards.html","1.3","➕","Two or more syllable Adjectives","more / less + adjective + than","คำคุณศัพท์ 2 พยางค์ขึ้นไป","This book is <b>more interesting than</b> the last one.",200,"8 แท็บ"],
["comparative-irregular-flashcards.html","1.4","🔀","Irregular Comparatives","better / worse + than","รูปพิเศษและรูปผสมต่างๆ","This test was <b>worse than</b> the last one.",103,"4 แท็บ"],
["comparative-adverbs-flashcards.html","2","🏃","Comparative Adverbs","adverb + than","การเปรียบเทียบด้วยคำวิเศษณ์","He runs <b>faster than</b> I do.",150,"3 แท็บ"],
["comparative-equal-as-as-flashcards.html","3","⚖️","Comparing Equal Things","as + adjective/adverb + as","การเปรียบเทียบเท่ากัน","The car is <b>as fast as</b> the bike.",150,"4 แท็บ"]];
const P=['#fde2e4','#e2ece9','#dfe7fd','#fff1c9','#e8dff5','#d6f0e4'];
document.getElementById('g').innerHTML=T.map((t,i)=>`<a class="c" style="background:${P[i]}" href="${t[0]}">
<div class="top"><span class="em">${t[2]}</span><span class="no">${t[1]}</span></div>
<div class="t">${t[3]}</div><div class="d">${t[4]}</div><div class="d">${t[5]}</div>
<div class="ex">${t[6]}</div><div class="n">${t[7]} การ์ด · ${t[8]}</div></a>`).join('');
document.getElementById('tot').textContent='รวมทั้งหมด '+T.reduce((s,t)=>s+t[7],0)+' การ์ด';
</script></body></html>
