<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Adverb Phrase Flashcards</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf8ff;--tx:#3b3550}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sarabun',sans-serif;padding:16px}
h1{font:700 20px Calibri,'Sarabun',sans-serif;text-align:center;margin:4px 0 2px}
.sub{text-align:center;font:15px 'Times New Roman',serif;color:#7a7390;margin-bottom:12px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;border-radius:20px;padding:8px 16px;background:#ece6f7;font:700 14px 'Sarabun';cursor:pointer;color:var(--tx)}
.tabs button.on{background:#b9a6e8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:0 auto}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{perspective:800px;height:190px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 8px #0001}
.back{transform:rotateY(180deg)}
.emo{font-size:40px}
.w{font:700 16px Calibri,sans-serif;margin:4px 0}
.ipa{font:14px 'Times New Roman',serif;color:#5d5675}
.th{font:700 15px 'Sarabun'}
.s{font:14px Calibri,sans-serif;margin:4px 0}
.st{font:13px 'Sarabun';color:#5d5675}
.r{color:#9b1c1c;font-weight:700}.g{color:#14532d}
.sp{border:0;background:#fff9;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;margin-top:4px}
table{border-collapse:collapse;max-width:760px;width:100%;margin:22px auto 0;background:#fff;border-radius:12px;overflow:hidden;font:14px Calibri,'Sarabun',sans-serif}
td,th{padding:7px 9px;border-bottom:1px solid #eee;text-align:left}th{background:#ece6f7}
td.t{font-family:'Sarabun'}
.wrap{overflow-x:auto;max-width:760px;margin:0 auto}
</style></head><body>
<h1>Adverb Phrase to describe a Verb</h1><div class="sub">Click a card to flip • 🔊 to listen</div>
<div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="wrap"><table id="tb"></table></div>
<script>
const C=[
["Manner 🎭","#fde2e4",[
["with great *enthusiasm*","/wɪð ɡreɪt ɪnˈθjuːziæzəm/","ด้วยความกระตือรือร้นอย่างยิ่ง","She danced with great enthusiasm.","เธอเต้นรำอย่างกระตือรือร้นมาก","💃"],
["in a low *voice*","/ɪn ə ləʊ vɔɪs/","ด้วยเสียงต่ำ","He spoke in a low voice.","เขาพูดด้วยเสียงต่ำ","🤫"],
["with extreme *caution*","/wɪð ɪkˈstriːm ˈkɔːʃn/","ด้วยความระมัดระวังอย่างยิ่ง","He drives with extreme caution.","เขาขับรถอย่างระมัดระวังสุดๆ","🚗"],
["with *kindness*","/wɪð ˈkaɪndnəs/","ด้วยความกรุณา","The teacher spoke with kindness.","ครูพูดด้วยความกรุณา","💗"],
["with great *focus*","/wɪð ɡreɪt ˈfəʊkəs/","ด้วยความตั้งใจจดจ่อ","She reads with great focus.","เธออ่านอย่างตั้งใจจดจ่อ","🎯"],
["with *pride*","/wɪð praɪd/","ด้วยความภาคภูมิใจ","They marched with pride.","พวกเขาเดินขบวนอย่างภาคภูมิใจ","🦚"],
["with great *speed*","/wɪð ɡreɪt spiːd/","ด้วยความเร็วสูง","He typed with great speed.","เขาพิมพ์เร็วมาก","⚡"],
["in perfect *harmony*","/ɪn ˈpɜːfɪkt ˈhɑːməni/","อย่างกลมกลืนสมบูรณ์แบบ","They sang in perfect harmony.","พวกเขาร้องเพลงประสานเสียงกันอย่างลงตัว","🎶"],
["with *surprise*","/wɪð səˈpraɪz/","ด้วยความประหลาดใจ","He responded with surprise.","เขาตอบด้วยความประหลาดใจ","😲"],
["in *amazement*","/ɪn əˈmeɪzmənt/","ด้วยความตะลึง","They stared in amazement.","พวกเขาจ้องมองด้วยความตะลึง","🤩"],
["with a *limp*","/wɪð ə lɪmp/","ด้วยท่าเดินกะเผลก","He walked with a limp.","เขาเดินกะเผลก","🦯"],
["with great *confidence*","/wɪð ɡreɪt ˈkɒnfɪdəns/","ด้วยความมั่นใจอย่างยิ่ง","He answered the question with great confidence.","เขาตอบคำถามอย่างมั่นใจมาก","😎"]]],
["Time ⏰","#dff3e4",[
["at *midnight*","/æt ˈmɪdnaɪt/","ตอนเที่ยงคืน","They arrived at midnight.","พวกเขามาถึงตอนเที่ยงคืน","🌙"],
["after the *game*","/ˈɑːftə ðə ɡeɪm/","หลังเกม","We met after the game.","เราพบกันหลังเกม","⚽"],
["through the *night*","/θruː ðə naɪt/","ตลอดทั้งคืน","The baby slept through the night.","ทารกหลับตลอดทั้งคืน","🌃"],
["for several *hours*","/fə ˈsevrəl ˈaʊəz/","เป็นเวลาหลายชั่วโมง","She worked for several hours.","เธอทำงานหลายชั่วโมง","⏳"],
["until the *sun* came up","/ənˈtɪl ðə sʌn keɪm ʌp/","จนกระทั่งพระอาทิตย์ขึ้น","He studied until the sun came up.","เขาเรียนจนพระอาทิตย์ขึ้น","🌅"],
["in the *morning*","/ɪn ðə ˈmɔːnɪŋ/","ในตอนเช้า","She runs in the morning.","เธอวิ่งตอนเช้า","🌄"],
["before *sunset*","/bɪˈfɔː ˈsʌnset/","ก่อนพระอาทิตย์ตก","We left before sunset.","เราออกเดินทางก่อนพระอาทิตย์ตก","🌇"],
["during the *movie*","/ˈdjʊərɪŋ ðə ˈmuːvi/","ระหว่างดูหนัง","The students laughed during the movie.","นักเรียนหัวเราะระหว่างดูหนัง","🎬"],
["ahead of *schedule*","/əˈhed əv ˈʃedjuːl/","เร็วกว่ากำหนด","She arrived ahead of schedule.","เธอมาถึงเร็วกว่ากำหนด","📅"],
["until *noon*","/ənˈtɪl nuːn/","จนถึงเที่ยงวัน","She slept until noon.","เธอนอนจนถึงเที่ยง","😴"],
["before the *deadline*","/bɪˈfɔː ðə ˈdedlaɪn/","ก่อนเส้นตาย","He returned before the deadline.","เขากลับมาก่อนเส้นตาย","⏰"],
["on *time*","/ɒn taɪm/","ตรงเวลา","They arrived on time.","พวกเขามาถึงตรงเวลา","🕐"]]],
["Place 📍","#dcebfb",[
["on the *windowsill*","/ɒn ðə ˈwɪndəʊsɪl/","บนขอบหน้าต่าง","The cat slept on the windowsill.","แมวนอนบนขอบหน้าต่าง","🐱"],
["in the *backyard*","/ɪn ðə ˌbækˈjɑːd/","ในสนามหลังบ้าน","The kids played in the backyard.","เด็กๆ เล่นในสนามหลังบ้าน","🏡"],
["across the *country*","/əˈkrɒs ðə ˈkʌntri/","ทั่วประเทศ","They traveled across the country.","พวกเขาเดินทางข้ามทั่วประเทศ","🗺️"],
["around the *park*","/əˈraʊnd ðə pɑːk/","รอบสวนสาธารณะ","He jogs around the park.","เขาวิ่งเหยาะๆ รอบสวน","🏃"],
["up the *mountain*","/ʌp ðə ˈmaʊntɪn/","ขึ้นภูเขา","They hiked up the mountain.","พวกเขาเดินป่าขึ้นภูเขา","⛰️"],
["in front of the *TV*","/ɪn frʌnt əv ðə ˌtiːˈviː/","หน้าทีวี","She eats in front of the TV.","เธอกินข้าวหน้าทีวี","📺"],
["under the *tree*","/ˈʌndə ðə triː/","ใต้ต้นไม้","He rested under the tree.","เขาพักผ่อนใต้ต้นไม้","🌳"],
["across the *lake*","/əˈkrɒs ðə leɪk/","ข้ามทะเลสาบ","He swam across the lake.","เขาว่ายน้ำข้ามทะเลสาบ","🏊"],
["over the *fence*","/ˈəʊvə ðə fens/","เหนือรั้ว","She looked over the fence.","เธอมองข้ามรั้ว","🧱"],
["by the *door*","/baɪ ðə dɔː/","ข้างประตู","He waited by the door.","เขารออยู่ข้างประตู","🚪"],
["along the *beach*","/əˈlɒŋ ðə biːtʃ/","ตามชายหาด","We walked along the beach.","เราเดินเล่นตามชายหาด","🏖️"],
["near the *window*","/nɪə ðə ˈwɪndəʊ/","ใกล้หน้าต่าง","We sat near the window.","เรานั่งใกล้หน้าต่าง","🪟"]]]];
let V=null;
function voice(){const a=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang));return a.find(v=>/natural|google|online|premium|enhanced/i.test(v.name))||a[0]||null}
function say(t,e){e&&e.stopPropagation();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}
const plain=p=>p.replace(/\*/g,''),hl=p=>p.replace(/\*(.+?)\*/,'<span class=g>$1</span>');
const sent=r=>r[3].replace(plain(r[0]),'<b class=r>'+hl(r[0])+'</b>');
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),tb=document.getElementById('tb');
function show(i){
 [...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));
 const [,col,rows]=C[i];grid.innerHTML='';
 rows.forEach((r,k)=>{const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class=in><div class=face style="background:${col}"><div class=emo>${r[5]}</div><div class=w>${hl(r[0])}</div><div class=ipa>${r[1]}</div><button class=sp>🔊</button></div><div class="face back" style="background:#fff8e1"><div class=th>${r[2]}</div><div class=s>${sent(r)}</div><div class=st>${r[4]}</div><button class=sp>🔊</button></div></div>`;
  d.onclick=()=>d.classList.toggle('f');
  d.querySelectorAll('.sp')[0].onclick=e=>say(plain(r[0]),e);
  d.querySelectorAll('.sp')[1].onclick=e=>say(r[3],e);
  grid.appendChild(d)});
 tb.innerHTML='<tr><th>#</th><th>Vocabulary</th><th>ไทย</th><th>Sentence</th><th>🔊</th></tr>';
 rows.forEach((r,k)=>{const tr=tb.insertRow();tr.innerHTML=`<td>${k+1}</td><td>${hl(r[0])}<br><span class=ipa>${r[1]}</span></td><td class=t>${r[2]}</td><td>${sent(r)}<br><span class=st>${r[4]}</span></td><td><button class=sp>🔊</button></td>`;tr.querySelector('.sp').onclick=e=>say(r[3],e)});
}
C.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c[0];b.onclick=()=>show(i);tabs.appendChild(b)});
speechSynthesis.onvoiceschanged=()=>{};show(0);
</script></body></html>
