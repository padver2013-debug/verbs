const DATA = RAW.split("\n").map(l=>{const [s,ipa,th,em]=l.split("|");return {s,ipa,th,em,plain:s.replace(/\*\*/g,"")}});
const PER = 50, pages = Math.ceil(DATA.length/PER);
let page = 0, voices = [], current = null;

const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const bold = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");

function render(){
  const g = document.getElementById("grid");
  g.innerHTML = DATA.slice(page*PER,(page+1)*PER).map((d,i)=>`
  <div class="flip" data-i="${page*PER+i}">
    <div class="inner">
      <div class="face front">
        <div class="top"><span>${bold(d.s)}</span></div>
        <div class="pic"><span>${d.em}</span><span class="num">${page*PER+i+1}</span>
          <button class="speak" data-speak="${page*PER+i}" aria-label="อ่านประโยค">🔊</button></div>
        <div class="ipa">${esc(d.ipa)}</div>
      </div>
      <div class="face back">
        <div class="th">${esc(d.th)}</div>
        <div class="sm">${esc(d.plain)}</div>
        <button class="speak" data-speak="${page*PER+i}" aria-label="อ่านประโยค">🔊</button>
      </div>
    </div>
  </div>`).join("");
  const pb = document.getElementById("pbtns"); pb.innerHTML="";
  const pg = document.getElementById("pager"); pg.innerHTML="";
  for(let p=0;p<pages;p++){
    const mk = () => {const b=document.createElement("button");b.className="pg"+(p===page?" on":"");b.textContent=`หน้า ${p+1} (${p*PER+1}–${Math.min((p+1)*PER,DATA.length)})`;b.onclick=()=>{page=p;render();window.scrollTo({top:0,behavior:"smooth"})};return b};
    pb.appendChild(mk()); pg.appendChild(mk());
  }
}

document.getElementById("grid").addEventListener("click",e=>{
  const sp = e.target.closest("[data-speak]");
  if(sp){e.stopPropagation();speak(+sp.dataset.speak,sp);return}
  const f = e.target.closest(".flip"); if(f) f.classList.toggle("flipped");
});

/* ---- Voice: prefer a British male voice ---- */
const MALE = /(google uk english male|daniel|arthur|oliver|george|ryan|thomas|james|male)/i;
const FEMALE = /(female|kate|serena|martha|hazel|susan|libby|sonia|maisie|stephanie|fiona|samantha)/i;
function score(v){
  let s=0; const n=v.name, l=v.lang.replace("_","-");
  if(l==="en-GB") s+=50; else if(l.startsWith("en")) s+=10; else return -1;
  if(MALE.test(n)) s+=30; if(FEMALE.test(n)) s-=40;
  if(/natural|neural|online|premium|enhanced/i.test(n)) s+=20;
  if(/google/i.test(n)) s+=5;
  return s;
}
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v=>score(v)>=0).sort((a,b)=>score(b)-score(a));
  const sel = document.getElementById("voice"), keep = sel.value;
  sel.innerHTML = voices.length ? voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join("") : `<option>ไม่พบเสียงภาษาอังกฤษ</option>`;
  if(keep && voices[keep]) sel.value = keep;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(i,btn){
  if(!("speechSynthesis" in window)){alert("เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง");return}
  speechSynthesis.cancel();
  document.querySelectorAll(".speak.playing").forEach(b=>b.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(DATA[i].plain);
  const v = voices[+document.getElementById("voice").value]; if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";
  u.rate = +document.getElementById("rate").value; u.pitch = 0.9;
  btn.classList.add("playing");
  u.onend=u.onerror=()=>btn.classList.remove("playing");
  speechSynthesis.speak(u);
}
render();
</script>
