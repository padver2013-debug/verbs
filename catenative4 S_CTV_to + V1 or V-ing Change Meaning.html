const NT={remember:["จำได้ว่า 'ต้องทำ' (ยังไม่ได้ทำ)","จำได้ว่า 'เคยทำไปแล้ว'"],forg:["ลืมทำ (จึงไม่ได้ทำ)","จำไม่ได้ว่าเคยทำไปแล้ว"],regret:["เสียใจที่ 'ต้องทำ' (แจ้งข่าวร้าย)","เสียใจที่ 'ทำไปแล้ว'"],stop:["หยุด 'เพื่อไปทำ' อย่างอื่น","เลิก/หยุดทำสิ่งนั้น"],tri:["พยายามทำ (อาจไม่สำเร็จ)","ลองทำดู (เป็นวิธีทดลอง)"],mean:["ตั้งใจจะทำ","หมายถึง / ส่งผลให้เป็น"],goon:["ทำสิ่งใหม่ต่อจากสิ่งก่อนหน้า","ทำสิ่งเดิมต่อเนื่องไป"],need:["ต้องถูกทำ (to be + V3)","ต้องถูกทำ (V-ing ความหมายเดียวกัน)"]};
function nt(o){const c=o.c.toLowerCase(),k=c.startsWith("went on")?"goon":(c.match(/^(remember|forg|regret|stop|tri|mean|need)/)||[])[1],a=NT[k];if(!a)return"";return pt(o)==" "?a[1]:a[0]}
function hl(o){const p=pt(o),k=o.c+p+o.v,x=o.e.toLowerCase().indexOf(k.toLowerCase());if(x<0)return o.e;
return o.e.slice(0,x)+`<mark><span class="mv">${o.e.substr(x,o.c.length)}</span>${p}<span class="v1" data-t="${o.vt}">${o.v}</span></mark>`+o.e.slice(x+k.length)}
let voice=null;function pick(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
const pref=[/natural/i,/google us english/i,/aria|jenny|guy/i,/samantha|ava|allison/i,/google/i,/en[-_]US/i];
for(const p of pref){const f=vs.find(v=>p.test(v.name)||p.test(v.lang));if(f){voice=f;return}}voice=vs[0]||null}
if("speechSynthesis"in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,ev){ev.stopPropagation();if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}
const tabs=document.getElementById("tabs"),grid=document.getElementById("grid"),tb=document.getElementById("tb");

<div class="f b"><span class="n">#${o.i}</span><span class="bd">${pt(o)==" to "?"to + V1":pt(o)==" "?"V-ing":"to be + V3"}</span><div class="th" style="margin-top:22px">${o.t}</div><div class="hint" style="font-size:13px;color:var(--ac)">💡 ${nt(o)}</div>
<div class="en" style="font-size:16px">${hl(o)}</div><button class="sp" onclick="say(${JSON.stringify(o.e).replace(/"/g,'&quot;')},event)">🔊 ฟัง</button></div></div></div>`).join("");
tb.innerHTML=L.map(o=>`<tr><td>${o.i}</td><td>${o.e}</td><td>${o.t}</td><td><mark><span class="mv">${o.c}</span>${pt(o)}<b>${o.v}</b></mark></td></tr>`).join("")}
for(let i=0;i<5;i++){const b=document.createElement("button");b.textContent=`Tab ${i+1} (${i*20+1}-${i*20+20})`;b.onclick=()=>show(i);tabs.append(b)}
