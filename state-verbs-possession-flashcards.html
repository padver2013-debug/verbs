<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>State Verbs: Possession &amp; Measurement</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8ff;--tx:#3a3350;--sub:#6d6585;--bd:#e4dcf2;--tab:#fff;--act:#c9b8f0;--tbl:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1b2b;--tx:#ece8f7;--sub:#b4abd0;--bd:#3b3555;--tab:#2a2640;--act:#6a5aa8;--tbl:#262238}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,sans-serif;padding:16px}
h1{font-size:1.35rem;text-align:center;margin:6px 0 2px;font-family:Calibri,Carlito,sans-serif}
.sub{text-align:center;color:var(--sub);font-family:Saraban,Sarabun,sans-serif;font-size:.9rem;margin-bottom:14px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--bd);background:var(--tab);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer;font:600 .9rem Calibri,Carlito,sans-serif}
.tabs button.on{background:var(--act);border-color:var(--act)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.card{height:250px;perspective:900px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;color:#3a3350;box-shadow:0 3px 10px rgba(80,60,120,.15);box-sizing:border-box}
.back{transform:rotateY(180deg);font-family:Saraban,Sarabun,sans-serif}
.pic{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:46px;margin-bottom:8px}
.w{font:700 1.5rem Calibri,Carlito,sans-serif}
.ipa{font:1rem "Times New Roman",Times,serif;margin:2px 0 6px}
.sp{border:0;background:rgba(255,255,255,.8);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:17px;color:#3a3350}
.th{font-weight:600;font-size:1.25rem;margin-bottom:6px}
.en{font:.95rem Calibri,Carlito,sans-serif;margin:2px 0}
.tt{font-size:.88rem}
.hint{font-size:.75rem;opacity:.65;margin-top:4px;font-family:Saraban,Sarabun,sans-serif}
h2{max-width:1000px;margin:26px auto 8px;font-size:1.1rem}
.wrap{max-width:1000px;margin:0 auto;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--tbl);border-radius:14px;overflow:hidden;font-family:Calibri,Carlito,sans-serif}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-size:.92rem}
th{background:var(--act)}
td.i{font-family:"Times New Roman",Times,serif;white-space:nowrap}
.t{font-family:Saraban,Sarabun,sans-serif;color:var(--sub);font-size:.85rem}
td .sp{background:var(--act);width:32px;height:32px}
</style></head><body>
<h1>State Verbs related to Possession &amp; Measurement</h1>
<div class="sub">คลิกการ์ดเพื่อดูคำแปล • กดปุ่ม 🔊 เพื่อฟังเสียงอังกฤษ (UK)</div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<h2 id="th2">Vocabulary Table</h2>
<div class="wrap"><table><thead><tr><th>#</th><th>Vocabulary</th><th>IPA (UK)</th><th>ความหมาย</th><th>Example sentence</th><th>🔊</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
const D0=[
{n:"Touch & Grip",w:[
["caress","/kəˈres/","🤗","ลูบไล้, สัมผัสเบา ๆ","She caressed the baby’s cheek.","เธอลูบแก้มทารกเบา ๆ"],
["clutch","/klʌtʃ/","🤜","คว้าไว้, กำแน่น","He clutched his bag tightly.","เขากำกระเป๋าไว้แน่น"],
["embrace","/ɪmˈbreɪs/","🫂","กอด","They embraced at the station.","พวกเขากอดกันที่สถานี"],
["grip","/ɡrɪp/","✊","จับแน่น","Grip the handle firmly.","จับที่จับให้แน่น"],
["jab","/dʒæb/","👉","จิ้ม, ทิ่ม","He jabbed me with his elbow.","เขาใช้ศอกกระทุ้งฉัน"],
["squeeze","/skwiːz/","🍋","บีบ, อัด","Squeeze the lemon.","บีบมะนาว"],
["yank","/jæŋk/","🪢","กระชากอย่างแรง","She yanked the rope.","เธอกระชากเชือกอย่างแรง"],
["scratch","/skræʧ/","🐱","ข่วน, เกา","The cat scratched the sofa.","แมวข่วนโซฟา"],
["tickle","/ˈtɪk.(ə)l/","🪶","จั๊กจี้","The feather tickled my nose.","ขนนกทำให้จมูกฉันจั๊กจี้"],
["itch","/ɪʧ/","🦟","คัน","My arm itches.","แขนของฉันคัน"],
["tingle","/ˈtɪŋ.ɡ(ə)l/","⚡","รู้สึกซ่า, ชา","My fingers tingle in the cold.","นิ้วของฉันรู้สึกซ่าเพราะความหนาว"]]},
{n:"Sights & Light",w:[
["behold","/bɪˈhəʊld/","🌄","มองเห็น (ทางการ)","Behold the beautiful view!","จงดูวิวสวย ๆ นี้สิ!"],
["glance","/ɡlɑːns/","⚡","เหลือบมอง","She glanced at her watch.","เธอเหลือบมองนาฬิกา"],
["glare","/ɡleə(r)/","😠","จ้องเขม็ง, แสงจ้า","He glared at me angrily.","เขาจ้องฉันอย่างโกรธเคือง"],
["glow","/ɡləʊ/","💡","เรืองแสง","The lamp glows softly.","โคมไฟเรืองแสงนุ่ม ๆ"],
["scan","/skæn/","📄","กวาดตามอง, สแกน","I scanned the page quickly.","ฉันกวาดตาดูหน้ากระดาษอย่างรวดเร็ว"],
["shimmer","/ˈʃɪm.ə(r)/","🌊","แวววับ","The lake shimmered in the sun.","ทะเลสาบระยิบระยับใต้แสงแดด"],
["sparkle","/ˈspɑːk.(ə)l/","✨","ระยิบระยับ","Her ring sparkles.","แหวนของเธอส่องประกาย"],
["glisten","/ˈɡlɪs.ən/","💧","แวววาว","The grass glistened with dew.","ต้นหญ้าแวววาวด้วยน้ำค้าง"],
["dazzle","/ˈdæz.əl/","🌟","ทำให้ตาพร่า","The lights dazzled me.","แสงไฟทำให้ฉันตาพร่า"],
["radiate","/ˈreɪ.di.eɪt/","☀️","แผ่รังสี","The sun radiates heat.","ดวงอาทิตย์แผ่ความร้อน"],
["blur","/blɜː(r)/","🌫️","พร่ามัว","Tears made everything blur.","น้ำตาทำให้ทุกอย่างพร่ามัว"],
["dim","/dɪm/","🔅","หรี่ลง, สลัว","Please dim the lights.","กรุณาหรี่ไฟลง"],
["sharpen","/ˈʃɑːp.ən/","🔪","ทำให้คม, ชัดขึ้น","Sharpen the pencil.","เหลาดินสอให้แหลม"]]},
{n:"Sounds",w:[
["overhear","/ˌəʊ.vəˈhɪə(r)/","🕵️","แอบได้ยิน","I overheard their talk.","ฉันแอบได้ยินที่พวกเขาคุยกัน"],
["echo","/ˈek.əʊ/","🏔️","ก้อง, สะท้อน","Her voice echoed in the hall.","เสียงของเธอก้องในห้องโถง"],
["jingle","/ˈdʒɪŋɡ(ə)l/","🔔","เสียงกรุ๊งกริ๊ง","Keys jingle in my pocket.","กุญแจกรุ๊งกริ๊งในกระเป๋า"],
["knock","/nɒk/","🚪","เคาะ","Someone knocked at the door.","มีคนเคาะประตู"],
["murmur","/ˈmɜː.mə(r)/","🗣️","พึมพำ","She murmured a prayer.","เธอพึมพำคำอธิษฐาน"],
["rustle","/ˈrʌs(ə)l/","🍂","เสียงกรอบแกรบ","Leaves rustled in the wind.","ใบไม้กรอบแกรบในสายลม"],
["slurp","/slɜːp/","🍜","ซดเสียงดัง","He slurped his noodles.","เขาซดก๋วยเตี๋ยวเสียงดัง"],
["snap","/snæp/","🫰","หัก, ดีดนิ้วดังเป๊าะ","The twig snapped.","กิ่งไม้หักดังเป๊าะ"],
["hum","/hʌm/","🎵","ฮัมเพลง, เสียงหึ่ง","She hums while cooking.","เธอฮัมเพลงตอนทำอาหาร"],
["blare","/bleə(r)/","📯","ดังสนั่น","Music blared from the car.","เพลงดังสนั่นจากรถ"],
["hiss","/hɪs/","🐍","เสียงฟ่อ","The snake hissed.","งูส่งเสียงฟ่อ"],
["buzz","/bʌz/","🐝","เสียงหึ่ง","Bees buzz in the garden.","ผึ้งบินหึ่งในสวน"],
["thump","/θʌmp/","🥁","เสียงตึง, ทุบดังตุบ","His heart thumped loudly.","หัวใจของเขาเต้นตุบ ๆ"],
["creak","/kriːk/","🪑","เสียงเอี๊ยดอ๊าด","The old stairs creak.","บันไดเก่าส่งเสียงเอี๊ยดอ๊าด"],
["crash","/kræʃ/","💥","เสียงดังโครม, ชน","A plate crashed to the floor.","จานตกกระแทกพื้นดังโครม"],
["rattle","/ˈræt.(ə)l/","🧸","เสียงกรุ๊งกริ๊ง, สั่นกึกกัก","The windows rattled.","หน้าต่างสั่นกึกกัก"]]},
{n:"Movement & Body",w:[
["dart","/dɑːt/","🐟","พุ่งไปอย่างรวดเร็ว","The fish darted away.","ปลาพุ่งหนีไป"],
["drip","/drɪp/","🚰","หยด","Water drips from the tap.","น้ำหยดจากก๊อก"],
["freeze","/friːz/","🧊","แข็งตัว, ชะงักนิ่ง","Freeze! Don’t move.","หยุดนิ่ง! อย่าขยับ"],
["hover","/ˈhɒv.ə(r)/","🚁","ลอยนิ่ง, วนเวียน","The helicopter hovered above.","เฮลิคอปเตอร์ลอยนิ่งอยู่ด้านบน"],
["lapse","/læps/","⏱️","พลาด, ผ่านพ้นไป","My attention lapsed.","สมาธิของฉันหลุดไป"],
["quiver","/ˈkwɪv.ə(r)/","🍃","สั่นระริก","Her lips quivered.","ริมฝีปากของเธอสั่นระริก"],
["shudder","/ˈʃʌd.ə(r)/","😰","สั่นสะท้าน","I shudder at the thought.","ฉันสั่นสะท้านเมื่อคิดถึงมัน"],
["throb","/θrɒb/","🤕","ปวดตุบ ๆ","My head throbs.","หัวของฉันปวดตุบ ๆ"],
["swell","/swel/","🎈","บวม, พอง","His ankle swelled up.","ข้อเท้าของเขาบวมขึ้น"],
["droop","/druːp/","🥀","ห้อยลู่, ห่อเหี่ยว","The flowers drooped.","ดอกไม้ห่อเหี่ยวห้อยลง"]]}
];
const _f=D0.flatMap(t=>t.w);const D=[];for(let i=0;i<_f.length;i+=25)D.push({n:"Words "+(i+1)+"–"+Math.min(i+25,_f.length),w:_f.slice(i,i+25)});
const C=["#ffd9e4","#d8ecff","#e0f5d8","#fff1c9","#e6dcff","#ffe2cf"];
let cur=0;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;
const v=speechSynthesis.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));
const p=[/Natural|Online/i,/Google UK/i,/Libby|Sonia|Daniel|Serena|Kate/i];let b;
for(const r of p){b=v.find(x=>r.test(x.name));if(b)break}
u.voice=b||v[0]||null;speechSynthesis.speak(u)}catch(e){}}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
function render(){
const tabs=document.getElementById("tabs");tabs.innerHTML="";
D.forEach((d,i)=>{const b=document.createElement("button");b.textContent=d.n+" ("+d.w.length+")";b.className=i==cur?"on":"";b.onclick=()=>{cur=i;render()};tabs.appendChild(b)});
const g=document.getElementById("grid");g.innerHTML="";
D[cur].w.forEach((x,i)=>{const c=document.createElement("div");c.className="card";const bg=C[i%C.length];
c.innerHTML=`<div class="in"><div class="face" style="background:${bg}"><div class="pic">${x[2]}</div><div class="w">${x[0]}</div><div class="ipa">${x[1]}</div><button class="sp" data-s="${x[0]}" title="Listen">🔊</button><div class="hint">คลิกเพื่อพลิกการ์ด</div></div><div class="face back" style="background:${bg}"><div class="th">${x[3]}</div><div class="en">${x[4]}</div><div class="tt">${x[5]}</div><button class="sp" style="margin-top:8px" data-s="${x[4]}" title="Listen">🔊</button></div></div>`;
c.onclick=e=>{if(e.target.closest(".sp")){e.stopPropagation();speak(e.target.closest(".sp").dataset.s);return}c.classList.toggle("f")};
g.appendChild(c)});
document.getElementById("th2").textContent="Vocabulary Table – "+D[cur].n;
const tb=document.getElementById("tb");tb.innerHTML="";
D[cur].w.forEach((x,i)=>{const r=document.createElement("tr");
r.innerHTML=`<td>${cur*25+i+1}</td><td><b>${x[0]}</b></td><td class="i">${x[1]}</td><td class="t">${x[3]}</td><td>${x[4]}<div class="t">${x[5]}</div></td><td><button class="sp" title="Listen">🔊</button></td>`;
r.querySelector(".sp").onclick=()=>speak(x[4]);tb.appendChild(r)})}
render();
</script></body></html>
