  let s = esc(en.replace(/\*(.+?)\*/, "§V§"));
  s = s.replace(/\b(Need|need)\b/,"<mark>$1</mark>").replace("§V§","<b>"+esc(verb)+"</b>");
  return s;
}

const PER_PAGE = 50;
let page = 0;
const grid = document.getElementById("grid");

// ---------- Voice (male, UK preferred) ----------
let voice = null;
const MALE_HINTS = ["daniel","google uk english male","ryan","george","thomas","oliver","arthur","male"];
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const gb = vs.filter(v=>/en[-_]GB/i.test(v.lang));
  const en = vs.filter(v=>/^en/i.test(v.lang));
  const rank = list => {
    for(const h of MALE_HINTS){
      const f = list.find(v=>v.name.toLowerCase().includes(h));
      if(f) return f;
    }
    return null;
  };
  voice = rank(gb) || rank(en) || gb[0] || en[0] || null;
  document.getElementById("voiceInfo").textContent = voice
    ? "เสียงอ่านที่ใช้: " + voice.name + " (" + voice.lang + ")"
    : "ไม่พบเสียงภาษาอังกฤษในอุปกรณ์นี้";
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
let currentBtn = null;
function speak(text, btn){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  if(currentBtn) currentBtn.classList.remove("playing");
  const u = new SpeechSynthesisUtterance(text);
  if(voice){ u.voice = voice; u.lang = voice.lang; } else { u.lang = "en-GB"; }
  u.rate = 0.88; u.pitch = 0.85;
  btn.classList.add("playing"); currentBtn = btn;
  u.onend = u.onerror = ()=>btn.classList.remove("playing");
  speechSynthesis.speak(u);
}

// ---------- Render ----------
function render(){
  speechSynthesis && speechSynthesis.cancel();
  grid.innerHTML = "";
  const start = page*PER_PAGE;
  DATA.slice(start, start+PER_PAGE).forEach((d,i)=>{
    const plain = d.en.replace(/\*/g,"");
    const n = start+i+1;
    const el = document.createElement("div");
    el.className = "flip"; el.tabIndex = 0; el.setAttribute("role","button");
    el.setAttribute("aria-label","Card "+n+": "+plain);
    el.innerHTML = `
      <div class="inner">
        <div class="face front">
          <span class="num">${n}</span>
          <button class="speak" type="button" aria-label="Read aloud">🔊 อ่าน</button>
          <div class="pic" aria-hidden="true">${d.emo}</div>
          <p class="en">${htmlOf(d.en)}</p>
          <p class="ipa">${esc(ipaOf(plain))}</p>
          <span class="hint">แตะเพื่อดูคำแปล</span>
        </div>
        <div class="face back">
          <span class="num" style="color:#9aa4c4">${n}</span>
          <div class="pic" aria-hidden="true">${d.emo}</div>
          <p class="th">${esc(d.th)}</p>
          <span class="hint">แตะเพื่อกลับ</span>
        </div>
      </div>`;
    const toggle = ()=>el.classList.toggle("flipped");
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
    const sp = el.querySelector(".speak");
    sp.addEventListener("click", e=>{ e.stopPropagation(); speak(plain, sp); });
    sp.addEventListener("keydown", e=>e.stopPropagation());
    grid.appendChild(el);
  });
  document.getElementById("p1").classList.toggle("on", page===0);
  document.getElementById("p2").classList.toggle("on", page===1);
  document.getElementById("info").textContent = "แสดง " + (start+1) + "–" + Math.min(start+PER_PAGE, DATA.length) + " จาก " + DATA.length;
  buildPager();
}
function buildPager(){
  const pg = document.getElementById("pager"); pg.innerHTML="";
  const pages = Math.ceil(DATA.length/PER_PAGE);
  for(let i=0;i<pages;i++){
    const b=document.createElement("button");
    b.textContent="หน้า "+(i+1); if(i===page) b.className="on";
    b.onclick=()=>{page=i;render();window.scrollTo({top:0});};
    pg.appendChild(b);
  }
}
document.getElementById("p1").onclick=()=>{page=0;render();};
document.getElementById("p2").onclick=()=>{page=1;render();};
let allFlipped=false;
document.getElementById("flipAll").onclick=()=>{
  allFlipped=!allFlipped;
  grid.querySelectorAll(".flip").forEach(c=>c.classList.toggle("flipped",allFlipped));
};
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme==="dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
};
render();
</script>
</body>
