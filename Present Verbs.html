<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>Present Verbs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--mint:#d9f5ec;--mint2:#2bb59a;--or:#ff8a3d;--ink:#17493f;--card:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--mint);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif}

.tabs{display:flex;gap:6px;padding:8px;justify-content:center;flex-wrap:wrap}
.tabs button{border:2px solid var(--mint2);background:#fff;color:var(--mint2);border-radius:20px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:clamp(11px,1.6vw,15px)}

.card{background:var(--card);border:2px solid var(--mint2);border-top:5px solid var(--or);border-radius:12px;padding:clamp(3px,.8vw,10px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pic{font-size:clamp(26px,6vw,70px);line-height:1.1;background:var(--mint);border-radius:10px;width:100%}
.v{font-weight:800;font-size:clamp(13px,2.2vw,26px);color:var(--or)}
.ipa{font-family:"Times New Roman",Times,serif;font-style:normal;font-size:clamp(10px,1.5vw,18px)}

.th{min-height:1.3em;font-size:clamp(10px,1.6vw,18px);font-weight:700;color:var(--ink)}
.snd{border:0;background:var(--mint2);color:#fff;border-radius:50%;width:clamp(24px,3.4vw,40px);height:clamp(24px,3.4vw,40px);font-size:clamp(11px,1.6vw,18px);cursor:pointer}
.snd:active{background:var(--or)}
.wrap{overflow-x:auto;padding:12px}
table{border-collapse:collapse;width:100%;min-width:640px;background:#fff;font-size:clamp(11px,1.4vw,15px)}
th{background:var(--mint2);color:#fff}th,td{border:1px solid var(--mint);padding:5px 8px;text-align:left}
tr:nth-child(even) td{background:#fff4ec}
td.i{font-family:"Times New Roman",Times,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){}}
</style></head><body>
<h1>🌿 Present Verbs · กริยา 100 คำ 🍊</h1>

set|set|ตั้ง / กำหนด|⏰|I set an alarm.|ฉันตั้งนาฬิกาปลุก
call|kɔːl|โทร / เรียก|📞|I call my mom.|ฉันโทรหาแม่
organize|ˈɔːɡənaɪz|จัดระเบียบ / จัดงาน|🗂️|I organize files.|ฉันจัดระเบียบไฟล์
fix|fɪks|ซ่อม / แก้ไข|🔧|I fix the bike.|ฉันซ่อมจักรยาน`.split("\n").forEach(l=>{const a=l.split("|");D[a[0]]=a});
const L="build cook need play improve absorb show harvest play celebrate offer drink sing catch provide love help attract protect flow face share grow bring inspire heal open water wear read explain write pass wear borrow complete grade share paint memorize learn make ask paint share hold enjoy encourage draw solve take fly buy explore reach pack visit follow book cross visit rent offer discover follow taste carry sail exchange speak pack cross welcome show sign answer manage launch attend receive create interview build calculate pitch finish build check print value attend choose update write support wear set call organize fix".split(" ");
const IR={build:"built",drink:"drunk",sing:"sung",catch:"caught",bring:"brought",grow:"grown",wear:"worn",read:"read",write:"written",take:"taken",fly:"flown",buy:"bought",hold:"held",draw:"drawn",speak:"spoken",choose:"chosen",show:"shown",set:"set",make:"made"};
const ing=w=>w=="set"?"setting":w.endsWith("e")&&!w.endsWith("ee")?w.slice(0,-1)+"ing":w+"ing";
const pp=w=>IR[w]||(w.endsWith("e")?w+"d":/[^aeiou]y$/.test(w)?w.slice(0,-1)+"ied":w+"ed");
let cur=0;
const $=id=>document.getElementById(id);
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";const vs=speechSynthesis.getVoices().filter(v=>/en[-_]GB/i.test(v.lang)||/^en/i.test(v.lang));
u.voice=vs.find(v=>/male|daniel|george|ryan|arthur/i.test(v.name)&&!/female/i.test(v.name)&&/GB/i.test(v.lang))||vs.find(v=>/male|daniel|david|mark|james|guy/i.test(v.name)&&!/female/i.test(v.name))||vs.find(v=>/GB/i.test(v.lang))||null;
u.pitch=.6;u.rate=.85;u.volume=1;speechSynthesis.speak(u)}
function render(){
 [...$("tabs").children].forEach((b,i)=>b.classList.toggle("on",i==cur));
 let g="",t="";
 for(let i=cur*25;i<cur*25+25;i++){const w=L[i],d=D[w];
  g+=`<div class="card"><div class="pic">${d[3]}</div><div class="v">${w}</div><div class="ipa">/${d[1]}/</div><div class="pp">${ing(w)} / ${pp(w)}</div><div class="th" id="t${i}"></div><button class="snd" onclick="say(${i})" aria-label="play">🔊</button></div>`;
  t+=`<tr><td>${i+1}</td><td><b>${w}</b></td><td class="i">/${d[1]}/</td><td>${d[2]}</td><td>${d[4]}</td><td>${d[5]}</td></tr>`}
 $("grid").innerHTML=g;$("tb").innerHTML=t}
function say(i){const d=D[L[i]];$("t"+i).textContent=d[2];speak(L[i])}
for(let k=0;k<4;k++){const b=document.createElement("button");b.textContent=`Tab ${k+1} · ${k*25+1}-${k*25+25}`;b.onclick=()=>{cur=k;render();scrollTo(0,0)};$("tabs").appendChild(b)}
speechSynthesis.getVoices();render();
</script></body></html>
