negotiate|nɪˈɡəʊʃieɪt|เจรจาต่อรอง|🤝|They negotiate a price.|พวกเขาเจรจาต่อรองราคา
suggest|səˈdʒest|เสนอแนะ|💁|I suggest a short break.|ฉันเสนอให้พักสั้นๆ`]
];
const C=["#ffd6e0","#d6ecff","#d9f5d9","#fff2c2","#e6d9ff","#ffe0cc","#c9f2ee","#f3d9f5"];
const $=id=>document.getElementById(id);
let cur=0,voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 voice=v.find(x=>/google uk english male/i.test(x.name))||v.find(x=>/daniel|alex|david|guy|ryan|fred|mark|male|james|george/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,e){if(e)e.stopPropagation();if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice){u.voice=voice;u.lang=voice.lang}u.rate=.85;u.pitch=.8;speechSynthesis.speak(u)}
function rows(i){return D[i][2].split("\n").map(l=>l.split("|"))}
function render(){
 const r=rows(cur);$("sub").textContent=D[cur][1]+" • "+r.length+" คำ";
 $("tabs").innerHTML=D.map((d,i)=>`<button class="tab${i==cur?' on':''}" data-i="${i}">${i+1}. ${d[0]}</button>`).join("");
 $("grid").innerHTML=r.map((x,i)=>{const c=C[(i+cur)%C.length];return `<div class="card" data-i="${i}"><div class="in">
 <div class="face" style="background:${c}"><button class="spk" data-s="${i}" title="ฟังเสียง">🔊</button><div class="em">${x[3]}</div><div class="w">${x[0]}</div><div class="ph">/${x[1]}/</div></div>
 <div class="face back" style="background:${c}"><div class="th">${x[2]}</div></div></div></div>`}).join("");
 $("tb").innerHTML=r.map((x,i)=>`<tr><td>${i+1}</td><td class="w2">${x[0]}</td><td class="p">/${x[1]}/</td><td>${x[2]}</td><td>${x[4]}</td><td>${x[5]}</td><td><button data-t="${i}" title="ฟัง">🔊</button></td></tr>`).join("");
}
document.addEventListener("click",e=>{
 const t=e.target.closest(".tab");if(t){cur=+t.dataset.i;render();return}
 const s=e.target.closest("[data-s]");if(s){say(rows(cur)[s.dataset.s][0],e);return}
 const b=e.target.closest("[data-t]");if(b){say(rows(cur)[b.dataset.t][4]);return}
 const c=e.target.closest(".card");if(c){c.classList.toggle("f");if(!c.classList.contains("f"))say(rows(cur)[c.dataset.i][0])}
});
render();
</script></body></html>
