<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">

<style>
:root{--bg:#fbf8fc;--tx:#2b2b3a;--mut:#6b6b80;--sf:#fff;--bd:#e4dcef;--mag:#b0125f;--grn:#0b5d2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a24;--tx:#eee;--mut:#aaa;--sf:#26243a;--bd:#3b3858}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,'Segoe UI',sans-serif;padding:14px 10px 40px}
.w{max-width:1000px;margin:0 auto}
h1{font-size:17px;margin:0 0 4px;text-align:center}
h1 b{color:var(--mag)} h1 i{color:var(--grn);font-style:normal}
.sub{text-align:center;color:var(--mut);font:13px 'Sarabun',sans-serif;margin-bottom:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 12px;font:600 13px Calibri,Carlito,sans-serif;cursor:pointer}
.tabs button.on{background:var(--mag);color:#fff;border-color:var(--mag)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px;margin-top:6px}
@media (max-width:640px){.grid{gap:10px 8px}}
.c{perspective:800px;aspect-ratio:10/8.2;cursor:pointer}
@media (max-width:640px){.c{aspect-ratio:3/3.9}}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.c.f .in{transform:rotateY(180deg)}
.s{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 12px;text-align:center;color:#2b2b3a;border:1px solid rgba(0,0,0,.06);overflow:hidden}
.b{transform:rotateY(180deg);gap:2px}
.em{font-size:calc(38px*var(--k,1));line-height:1}
.p{font-weight:700;font-size:calc(clamp(14px,3.7vw,20px)*var(--k,1));line-height:1.15}
.ipa{font-family:'Times New Roman',Times,serif;font-size:calc(clamp(12px,3.1vw,16px)*var(--k,1));color:#555}
.d{color:var(--mag)} .n{color:var(--grn)}
.th{font:700 calc(clamp(13px,3.4vw,16px)*var(--k,1)) 'Sarabun',sans-serif}
.lab{font-weight:700;font-size:calc(clamp(9px,2.3vw,11px)*var(--k,1));color:var(--mag);line-height:1.15}
.lab2{font-weight:700;font-size:calc(clamp(9px,2.3vw,11px)*var(--k,1));color:var(--grn)}
.se{font-weight:700;font-size:calc(clamp(14px,3.8vw,18px)*var(--k,1));line-height:1.2}
.st{font:calc(clamp(12px,3.2vw,15px)*var(--k,1)) 'Sarabun',sans-serif;color:#444;line-height:1.2}
.sp{border:0;background:rgba(255,255,255,.75);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;flex:none}
h2{font-size:15px;margin:22px 0 8px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:17px;background:var(--sf)}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
th{background:rgba(176,18,95,.1);font-size:13px}
td.t{font-family:'Sarabun',sans-serif}
td.i{font-family:'Times New Roman',serif;color:var(--mut);white-space:nowrap}
.tp{font-family:'Sarabun',sans-serif;font-size:12px;color:var(--mut)}
</style></head><body><div class="w">
<h1>Words Containing “<b>Post-modified Noun Phrase</b>”: <i>Noun Phrase in English Sentences</i> Vocabulary</h1>
<div class="sub">คลิกการ์ดเพื่อพลิกดูคำแปลและประโยคตัวอย่าง · กด 🔊 เพื่อฟังเสียงอ่านสำเนียงอังกฤษ (UK)</div>
<div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
<h2>📋 ตารางคำศัพท์ (Vocabulary Table)</h2>
<div class="tw"><table><thead><tr><th>#</th><th>Vocabulary</th><th>IPA (UK)</th><th>ความหมาย</th><th>Sentence</th><th>🔊</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
const RAW=`#Prepositional Phrases
a house on the hill|ə haʊs ɒn ðə hɪl|🏠|บ้านบนเนินเขา|He lives in a house on the hill.|เขาอาศัยในบ้านบนเนินเขา
a map of the old city|ə mæp əv ði əʊld ˈsɪti|🗺️|แผนที่ของเมืองเก่า|They found a map of the old city.|พวกเขาพบแผนที่ของเมืองเก่า
a tunnel under the river|ə ˈtʌnl ˈʌndə ðə ˈrɪvə|🚇|อุโมงค์ใต้แม่น้ำ|We walked through a tunnel under the river.|เราเดินผ่านอุโมงค์ใต้แม่น้ำ
a ring with a blue stone|ə rɪŋ wɪð ə bluː stəʊn|💍|แหวนที่ประดับหินสีน้ำเงิน|He gave her a ring with a blue stone.|เขามอบแหวนที่ประดับหินสีน้ำเงินให้เธอ
a dress with floral patterns|ə dres wɪð ˈflɔːrəl ˈpætnz|👗|ชุดเดรสลายดอกไม้|She wore a dress with floral patterns.|เธอสวมชุดเดรสลายดอกไม้
a painting of a sunset|ə ˈpeɪntɪŋ əv ə ˈsʌnset|🖼️|ภาพวาดพระอาทิตย์ตก|I saw a painting of a sunset.|ฉันเห็นภาพวาดพระอาทิตย์ตก
a cabin by the lake|ə ˈkæbɪn baɪ ðə leɪk|🛖|กระท่อมริมทะเลสาบ|They stayed in a cabin by the lake.|พวกเขาพักในกระท่อมริมทะเลสาบ
a gift from her friend|ə ɡɪft frəm hɜː frend|🎁|ของขวัญจากเพื่อนของเธอ|She received a gift from her friend.|เธอได้รับของขวัญจากเพื่อนของเธอ
a field full of sunflowers|ə fiːld fʊl əv ˈsʌnflaʊəz|🌻|ทุ่งที่เต็มไปด้วยทานตะวัน|We passed a field full of sunflowers.|เราขับผ่านทุ่งที่เต็มไปด้วยทานตะวัน
a pie with fresh apples|ə paɪ wɪð freʃ ˈæplz|🥧|พายที่ใส่แอปเปิลสด|She baked a pie with fresh apples.|เธออบพายที่ใส่แอปเปิลสด
a can of soda|ə kæn əv ˈsəʊdə|🥫|โซดาหนึ่งกระป๋อง|He opened a can of soda.|เขาเปิดโซดาหนึ่งกระป๋อง
a bridge over the river|ə brɪdʒ ˈəʊvə ðə ˈrɪvə|🌉|สะพานข้ามแม่น้ำ|We crossed a bridge over the river.|เราข้ามสะพานที่ทอดข้ามแม่น้ำ
a bench under the tree|ə bentʃ ˈʌndə ðə triː|🪑|ม้านั่งใต้ต้นไม้|He sat on a bench under the tree.|เขานั่งบนม้านั่งใต้ต้นไม้
a museum of modern art|ə mjuˈziːəm əv ˈmɒdn ɑːt|🏛️|พิพิธภัณฑ์ศิลปะสมัยใหม่|We visited a museum of modern art.|เราไปเยี่ยมพิพิธภัณฑ์ศิลปะสมัยใหม่
#Relative Clauses
the book that I borrowed|ðə bʊk ðæt aɪ ˈbɒrəʊd|📘|หนังสือที่ฉันยืมมา|The book that I borrowed is very interesting.|หนังสือที่ฉันยืมมาน่าสนใจมาก
the woman who works at the bookstore|ðə ˈwʊmən huː wɜːks ət ðə ˈbʊkstɔː|👩|ผู้หญิงที่ทำงานที่ร้านหนังสือ|I met the woman who works at the bookstore.|ฉันพบผู้หญิงที่ทำงานที่ร้านหนังสือ
the dog that was barking|ðə dɒɡ ðæt wɒz ˈbɑːkɪŋ|🐕|สุนัขที่กำลังเห่า|The dog that was barking is now quiet.|สุนัขที่เห่าอยู่ตอนนี้เงียบแล้ว
the house where I grew up|ðə haʊs weər aɪ ɡruː ʌp|🏡|บ้านที่ฉันเติบโตมา|The house where I grew up is being renovated.|บ้านที่ฉันเติบโตมากำลังถูกปรับปรุง
the man who gave the speech|ðə mæn huː ɡeɪv ðə spiːtʃ|🎤|ผู้ชายที่กล่าวสุนทรพจน์|The man who gave the speech is my uncle.|ผู้ชายที่กล่าวสุนทรพจน์คือลุงของฉัน
the movie that we watched|ðə ˈmuːvi ðæt wi wɒtʃt|🎬|หนังที่เราดู|The movie that we watched was really exciting.|หนังที่เราดูสนุกตื่นเต้นมาก
the restaurant where we ate|ðə ˈrestrɒnt weə wi eɪt|🍽️|ร้านอาหารที่เรากินกัน|The restaurant where we ate was fantastic.|ร้านอาหารที่เรากินกันยอดเยี่ยมมาก
the car that he drives|ðə kɑː ðæt hi draɪvz|🚗|รถที่เขาขับ|The car that he drives is brand new.|รถที่เขาขับใหม่เอี่ยม
the phone that I lost|ðə fəʊn ðæt aɪ lɒst|📱|โทรศัพท์ที่ฉันทำหาย|The phone that I lost was very expensive.|โทรศัพท์ที่ฉันทำหายราคาแพงมาก
the teacher who helped me|ðə ˈtiːtʃə huː helpt miː|👩‍🏫|ครูที่ช่วยเหลือฉัน|The teacher who helped me is very kind.|ครูที่ช่วยเหลือฉันใจดีมาก
the child who was crying|ðə tʃaɪld huː wɒz ˈkraɪɪŋ|😢|เด็กที่กำลังร้องไห้|The child who was crying is feeling better now.|เด็กที่ร้องไห้อยู่รู้สึกดีขึ้นแล้ว
the song that is playing|ðə sɒŋ ðæt ɪz ˈpleɪɪŋ|🎵|เพลงที่กำลังเล่นอยู่|The song that is playing is my favorite.|เพลงที่กำลังเล่นอยู่เป็นเพลงโปรดของฉัน
the tree that stands in the yard|ðə triː ðæt stændz ɪn ðə jɑːd|🌳|ต้นไม้ที่ยืนต้นอยู่ในสนาม|The tree that stands in the yard is very old.|ต้นไม้ที่ยืนต้นอยู่ในสนามเก่าแก่มาก
#Infinitive Phrases
the book to read|ðə bʊk tə riːd|📖|หนังสือที่จะอ่าน|The book to read is on the shelf.|หนังสือที่จะอ่านอยู่บนชั้น
the homework to complete|ðə ˈhəʊmwɜːk tə kəmˈpliːt|📝|การบ้านที่ต้องทำให้เสร็จ|I have the homework to complete by tomorrow.|ฉันมีการบ้านที่ต้องทำให้เสร็จภายในพรุ่งนี้
the key to open the door|ðə kiː tuː ˈəʊpən ðə dɔː|🔑|กุญแจสำหรับเปิดประตู|I found the key to open the door under the mat.|ฉันพบกุญแจสำหรับเปิดประตูใต้พรมเช็ดเท้า
the cake to serve at the party|ðə keɪk tə sɜːv ət ðə ˈpɑːti|🎂|เค้กที่จะเสิร์ฟในงานปาร์ตี้|She bought the cake to serve at the party.|เธอซื้อเค้กไว้เสิร์ฟในงานปาร์ตี้
the flowers to decorate the room|ðə ˈflaʊəz tə ˈdekəreɪt ðə ruːm|💐|ดอกไม้สำหรับตกแต่งห้อง|She bought the flowers to decorate the room.|เธอซื้อดอกไม้ไว้ตกแต่งห้อง
the tools to fix the car|ðə tuːlz tə fɪks ðə kɑː|🧰|เครื่องมือสำหรับซ่อมรถ|I have the tools to fix the car.|ฉันมีเครื่องมือสำหรับซ่อมรถ
the person to speak to|ðə ˈpɜːsn tə spiːk tuː|🗣️|คนที่ควรไปพูดด้วย|The person to speak to about the issue is the manager.|คนที่ควรไปพูดด้วยเรื่องนี้คือผู้จัดการ
the documents to review|ðə ˈdɒkjumənts tə rɪˈvjuː|📄|เอกสารที่ต้องตรวจทาน|The documents to review are on your desk.|เอกสารที่ต้องตรวจทานอยู่บนโต๊ะของคุณ
the time to rest|ðə taɪm tə rest|🛌|เวลาสำหรับพักผ่อน|I need the time to rest before the big meeting.|ฉันต้องการเวลาพักผ่อนก่อนการประชุมใหญ่
the instructions to follow|ði ɪnˈstrʌkʃnz tə ˈfɒləʊ|📋|คำแนะนำที่ต้องทำตาม|The instructions to follow are in the manual.|คำแนะนำที่ต้องทำตามอยู่ในคู่มือ
the place to stay|ðə pleɪs tə steɪ|🏨|ที่พัก|The place to stay during the trip is a nice hotel.|ที่พักระหว่างการเดินทางคือโรงแรมที่ดี
the report to write|ðə rɪˈpɔːt tə raɪt|🧾|รายงานที่ต้องเขียน|The report to write is due by Friday.|รายงานที่ต้องเขียนกำหนดส่งวันศุกร์
the form to fill out|ðə fɔːm tə fɪl aʊt|📑|แบบฟอร์มที่ต้องกรอก|The form to fill out is at the front desk.|แบบฟอร์มที่ต้องกรอกอยู่ที่เคาน์เตอร์ด้านหน้า`;
const PAL=['#fde2e4','#e2f0cb','#d6e6ff','#fff1c9','#e8dcf7','#d4f1ec'];
const cats=[];let cur;
RAW.split('\n').forEach(l=>{if(l[0]=='#'){cur={n:l.slice(1),r:[]};cats.push(cur)}else{const a=l.split('|');cur.r.push({p:a[0],i:a[1],e:a[2],t:a[3],s:a[4],ts:a[5]})}});
const tabs=[];cats.forEach(c=>{for(let k=0;k<c.r.length;k+=25)tabs.push({n:c.n,r:c.r.slice(k,k+25)})});
let voice;
function pick(){try{const v=speechSynthesis.getVoices(),g=v.filter(x=>/en[-_]GB/i.test(x.lang));voice=g.find(x=>/natural|online|google|sonia|libby|serena|daniel/i.test(x.name))||g[0]||v.find(x=>/^en/i.test(x.lang))}catch(e){}}
try{speechSynthesis.onvoiceschanged=pick;pick()}catch(e){}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-GB';u.rate=r;speechSynthesis.speak(u)}catch(e){}}
const hl=p=>{const w=p.split(' ');return `<span class="d">${w[0]}</span> <span class="n">${w.slice(1).join(' ')}</span>`};
let T=0;
function show(i){T=i;
document.getElementById('tabs').innerHTML=tabs.map((t,k)=>`<button class="${k==i?'on':''}" onclick="show(${k})">${t.n} (${t.r.length})</button>`).join('');
const R=tabs[i].r;
document.getElementById('grid').innerHTML=R.map((x,k)=>`<div class="c" onclick="this.classList.toggle('f')"><div class="in">
<div class="s" style="background:${PAL[k%6]}"><div class="em">${x.e}</div><div class="p">${hl(x.p)}</div><div class="ipa">/${x.i}/</div><button class="sp" data-w="${k}" aria-label="Play word">🔊</button></div>
<div class="s b" style="background:${PAL[(k+3)%6]}"><div class="lab">Post-modified Noun Phrase</div><div class="lab2">Noun Phrase in English Sentences</div><div class="th">${x.t}</div><div class="se">${x.s}</div><div class="st">${x.ts}</div><button class="sp" data-s="${k}" aria-label="Play sentence">🔊</button></div>
</div></div>`).join('');
document.getElementById('tb').innerHTML=R.map((x,k)=>`<tr><td>${k+1}</td><td><b>${hl(x.p)}</b></td><td class="i">/${x.i}/</td><td class="t">${x.t}</td><td>${x.s}<div class="tp">${x.ts}</div></td><td><button class="sp" data-s="${k}" aria-label="Play sentence">🔊</button></td></tr>`).join('');fit()}
document.addEventListener('click',e=>{const b=e.target.closest('.sp');if(!b)return;e.stopPropagation();const R=tabs[T].r;
if(b.dataset.w!=null)say(R[b.dataset.w].p,.8);else say(R[b.dataset.s].s,.9)},true);
function fit(){document.querySelectorAll('.s').forEach(f=>{let k=1;f.style.setProperty('--k',1);const H=()=>[...f.children].reduce((a,c)=>a+c.offsetHeight+3,0)+14;while(H()>f.clientHeight-6&&k>.5){k-=.04;f.style.setProperty('--k',k.toFixed(2))}})}
addEventListener('resize',fit);try{document.fonts.ready.then(fit)}catch(e){}
show(0);
</script></body></html>
