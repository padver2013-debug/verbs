<h1>4. Infinitive with “to” after nouns of a sentence</h1>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="tblbox"><table><thead><tr><th>#</th><th>Vocabulary</th><th>ไทย</th><th>Sentence</th><th>ไทย</th><th>🔊</th></tr></thead><tbody id="tb"></tbody></table></div>

<script>
const CATS={G:["🎯 Plans, Wishes & Goals","#d9e8fb"],O:["💌 Offers & Invitations","#fdf0c9"],P:["📜 Permission, Orders & Advice","#d8f2e2"],D:["⚖️ Decisions & Promises","#fbd9e6"]};
const MV={have:["hæv","มี"],has:["hæz","มี"],had:["hæd","มี"],made:["meɪd","ทำ"],gave:["ɡeɪv","ให้"],offered:["ˈɒf.əd","เสนอ"],received:["rɪˈsiːvd","ได้รับ"],got:["ɡɒt","ได้รับ"],heard:["hɜːd","ได้ยิน"],"have got":["hæv ɡɒt","มี"]};

const V={visit:["ˈvɪz.ɪt","ไปเยี่ยม","🗼"],travel:["ˈtræv.əl","เดินทาง","✈️"],stay:["steɪ","อยู่","🏠"],lead:["liːd","นำ","👑"],attend:["əˈtend","เข้าร่วม","🎫"],help:["help","ช่วย","🤝"],use:["juːz","ใช้","🖥️"],complete:["kəmˈpliːt","ทำให้เสร็จ","☑️"],collaborate:["kəˈlæb.ə.reɪt","ร่วมมือ","🧑‍🤝‍🧑"],join:["dʒɔɪn","เข้าร่วม","🙋"],proceed:["prəˈsiːd","ดำเนินการต่อ","⏩"],change:["tʃeɪndʒ","เปลี่ยน","🔄"],improve:["ɪmˈpruːv","ปรับปรุง","📈"],participate:["pɑːˈtɪs.ɪ.peɪt","เข้าร่วม","🏅"],leave:["liːv","ออกไป","🚪"],start:["stɑːt","เริ่ม","🚀"],expand:["ɪkˈspænd","ขยาย","📊"],work:["wɜːk","ทำงาน","💼"],be:["biː","ระวัง","🧍"],finish:["ˈfɪn.ɪʃ","ทำให้เสร็จ","🏁"],run:["rʌn","วิ่ง","🏃"],cut:["kʌt","ลด","✂️"],overcome:["ˌəʊ.vəˈkʌm","เอาชนะ","🏔️"],study:["ˈstʌd.i","เรียน","📚"],meet:["miːt","พบ","👋"],assemble:["əˈsem.bəl","รวมตัว","👥"],reorganize:["ˌriːˈɔː.ɡən.aɪz","จัดระเบียบใหม่","🗂️"],reduce:["rɪˈdjuːs","ลด","📉"],confirm:["kənˈfɜːm","ยืนยัน","✔️"],launch:["lɔːntʃ","เปิดตัว","🛫"],make:["meɪk","ทำให้","🔨"]};
const D=`have|plan|visit|I have a plan to visit Paris next summer.|ฉันมีแผนจะไปเที่ยวปารีสในฤดูร้อนหน้า
has|desire|travel|She has a desire to travel the world.|เธอมีความปรารถนาที่จะเดินทางรอบโลก
made|decision|stay|They made a decision to stay home for the holidays.|พวกเขาตัดสินใจอยู่บ้านในช่วงวันหยุด
gave|opportunity|lead|I gave him the opportunity to lead the project.|ฉันให้โอกาสเขานำโครงการ
had|invitation|attend|We had an invitation to attend the ceremony.|เราได้รับเชิญให้เข้าร่วมพิธี
offered|suggestion|help|She offered a suggestion to help improve the system.|เธอเสนอข้อแนะนำเพื่อช่วยปรับปรุงระบบ
gave|permission|use|He gave his permission to use the computer.|เขาอนุญาตให้ใช้คอมพิวเตอร์
gave|task|complete|The teacher gave the task to complete by tomorrow.|ครูมอบงานให้ทำให้เสร็จภายในพรุ่งนี้
received|offer|collaborate|We received an offer to collaborate with the company.|เราได้รับข้อเสนอให้ร่วมมือกับบริษัท
received|request|join|I received a request to join the team.|ฉันได้รับคำขอให้เข้าร่วมทีม
gave|approval|proceed|She gave her approval to proceed with the plan.|เธออนุมัติให้ดำเนินการตามแผน
made|decision|change|He made a decision to change his career path.|เขาตัดสินใจเปลี่ยนเส้นทางอาชีพ
have got|idea|improve|I’ve got an idea to improve the system.|ฉันมีไอเดียที่จะปรับปรุงระบบ
got|invitation|participate|We got an invitation to participate in the competition.|เราได้รับเชิญให้เข้าร่วมการแข่งขัน
gave|order|leave|They gave the order to leave immediately.|พวกเขาสั่งให้ออกไปทันที
heard|rumor|start|I heard a rumor to start working with a new team.|ฉันได้ยินข่าวลือว่าจะเริ่มทำงานกับทีมใหม่
received|proposal|expand|She received a proposal to expand the business.|เธอได้รับข้อเสนอให้ขยายธุรกิจ
got|approval|start|He got an approval to start the construction.|เขาได้รับอนุมัติให้เริ่มการก่อสร้าง
have|wish|travel|I have a wish to travel to Japan next year.|ฉันมีความปรารถนาที่จะไปญี่ปุ่นปีหน้า
gave|advice|work|The coach gave the advice to work on our fitness.|โค้ชแนะนำให้ฝึกความฟิตของเรา
received|approval|attend|He received the approval to attend the conference.|เขาได้รับอนุมัติให้เข้าร่วมการประชุม
made|promise|finish|I made a promise to finish the report by Friday.|ฉันสัญญาว่าจะทำรายงานให้เสร็จภายในวันศุกร์
heard|invitation|join|We heard an invitation to join the fundraising event.|เราได้ยินคำเชิญให้เข้าร่วมงานระดมทุน
has|passion|help|She has a passion to help others in need.|เธอมีความหลงใหลที่จะช่วยเหลือผู้ที่ต้องการ
gave|instruction|complete|They gave the instruction to complete the task by noon.|พวกเขาสั่งให้ทำงานให้เสร็จก่อนเที่ยง
had|opportunity|work|I had the opportunity to work with an experienced team.|ฉันมีโอกาสได้ทำงานกับทีมที่มีประสบการณ์
offered|suggestion|improve|He offered a suggestion to improve team communication.|เขาเสนอแนวทางปรับปรุงการสื่อสารในทีม
made|commitment|help|She made a commitment to help with the event.|เธอให้คำมั่นว่าจะช่วยงานนี้
received|warning|be|I received a warning to be careful with the document.|ฉันได้รับคำเตือนให้ระวังเอกสาร
gave|challenge|finish|They gave the challenge to finish the task in one hour.|พวกเขาท้าให้ทำงานให้เสร็จภายในหนึ่งชั่วโมง
received|invitation|join|I received an invitation to join the seminar.|ฉันได้รับเชิญให้เข้าร่วมสัมมนา
made|request|leave|He made a request to leave early today.|เขาขอกลับก่อนในวันนี้
have|goal|run|I have a goal to run a marathon next year.|ฉันมีเป้าหมายที่จะวิ่งมาราธอนปีหน้า
received|invitation|participate|He received an invitation to participate in the competition.|เขาได้รับเชิญให้เข้าร่วมการแข่งขัน
got|offer|work|We got an offer to work in a new department.|เราได้รับข้อเสนอให้ไปทำงานในแผนกใหม่
made|decision|cut|The manager made a decision to cut the budget.|ผู้จัดการตัดสินใจลดงบประมาณ
gave|instruction|start|They gave the instruction to start the meeting.|พวกเขาสั่งให้เริ่มประชุม
have|challenge|overcome|I have a challenge to overcome before the deadline.|ฉันมีความท้าทายที่ต้องเอาชนะก่อนกำหนดส่ง
received|offer|study|She received an offer to study abroad.|เธอได้รับข้อเสนอให้ไปเรียนต่างประเทศ
gave|consent|use|I gave my consent to use the document.|ฉันยินยอมให้ใช้เอกสาร
made|recommendation|improve|He made a recommendation to improve communication.|เขาเสนอแนะให้ปรับปรุงการสื่อสาร
received|opportunity|meet|We received an opportunity to meet the CEO.|เราได้รับโอกาสพบซีอีโอ
had|desire|help|She had a desire to help the community.|เธอมีความปรารถนาที่จะช่วยชุมชน
gave|command|assemble|They gave a command to assemble the team immediately.|พวกเขาออกคำสั่งให้รวมทีมทันที
got|invitation|attend|We got an invitation to attend the VIP event.|เราได้รับเชิญให้เข้าร่วมงานวีไอพี
made|promise|stay|He made a promise to stay committed to his goals.|เขาสัญญาว่าจะมุ่งมั่นกับเป้าหมายของเขา
have|plan|reorganize|I have a plan to reorganize the department.|ฉันมีแผนจะจัดระเบียบแผนกใหม่
gave|suggestion|reduce|They gave a suggestion to reduce the workload.|พวกเขาเสนอให้ลดภาระงาน
received|email|confirm|I received an email to confirm my attendance.|ฉันได้รับอีเมลให้ยืนยันการเข้าร่วม
had|wish|meet|She had a wish to meet her favorite author.|เธอมีความปรารถนาที่จะพบนักเขียนคนโปรด
gave|recommendation|improve|I gave a recommendation to improve the strategy.|ฉันแนะนำให้ปรับปรุงกลยุทธ์
made|decision|launch|We made a decision to launch the product next month.|เราตัดสินใจเปิดตัวผลิตภัณฑ์เดือนหน้า
received|proposal|collaborate|He received a proposal to collaborate on a new venture.|เขาได้รับข้อเสนอให้ร่วมมือในกิจการใหม่
had|idea|make|I had an idea to make the process more efficient.|ฉันมีไอเดียที่จะทำให้กระบวนการมีประสิทธิภาพขึ้น
offered|chance|work|They offered the chance to work on the new project.|พวกเขาเสนอโอกาสให้ทำงานในโครงการใหม่`.split("\n").map(l=>{const a=l.split("|"),m=MV[a[0]],n=N[a[1]],v=V[a[2]];return{c:n[3],w:a[0]+" "+a[1]+" to "+a[2],ipa:"/"+m[0]+" "+n[0]+" tə "+v[0]+"/",e:n[2]+v[2],th:m[1]+n[1]+"ที่จะ"+v[1],s:a[3],st:a[4]}});
const K=Object.keys(CATS),TABS=[];K.forEach(k=>{const n=D.filter(x=>x.c==k).length;for(let s=0;s<n;s+=20)TABS.push({c:k,s,n:n,i:s/20+1})});let tab=0,list=[];
const $=id=>document.getElementById(id);
// speech: pick the best en-GB voice available
let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));
 const sc=x=>(/natural|online|neural/i.test(x.name)?4:0)+(/google/i.test(x.name)?3:0)+(/sonia|libby|ryan|daniel|serena|kate/i.test(x.name)?2:0);
 voice=v.sort((a,b)=>sc(b)-sc(a))[0]||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.88;speechSynthesis.speak(u)}
function render(){
 list=D.map((x,n)=>[x,n]).filter(a=>a[0].c==TABS[tab].c).slice(TABS[tab].s,TABS[tab].s+20);
 $("grid").innerHTML=list.map(([d,g],k)=>{const c=CATS[d.c][1];return `<div class="scene"><div class="card" onclick="this.classList.toggle('flip')"><div class="face" style="background:${c}"><div class="hint">4. Infinitive with “to” after nouns</div><div class="emoji">${d.e}</div><div class="word">${d.w}</div><div class="ipa">${d.ipa}</div><button class="spk" title="ฟังเสียง" onclick="event.stopPropagation();say(D[${g}].w.toLowerCase())">🔊</button></div><div class="face back" style="background:${c}"><div class="th thw">${d.th}</div><div class="sen">${d.s}</div><button class="spk" title="ฟังประโยค" onclick="event.stopPropagation();say(D[${g}].s)">🔊</button><div class="th sth">${d.st}</div></div></div></div>`}).join("");
 $("tb").innerHTML=list.map(([x,g],k)=>`<tr><td>${TABS[tab].s+k+1}</td><td class="v">${x.w}</td><td class="t">${x.th}</td><td>${x.s}</td><td class="t">${x.st}</td><td><button class="spk" onclick="say(D[${g}].s)">🔊</button></td></tr>`).join("");
 document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("on",n==tab));
}
function setTab(n){tab=n;render()}
$("tabs").innerHTML=TABS.map((t,n)=>`<button class="tab" onclick="setTab(${n})">${CATS[t.c][0]}${t.n>20?" "+t.i:""} (${Math.min(20,t.n-t.s)})</button>`).join("");
setTab(0);
</script></body></html>
