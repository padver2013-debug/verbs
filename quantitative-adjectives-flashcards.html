<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">

<title>Quantitative Adjectives Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf5;--tx:#3b3340;--card:#fff;--line:#eadff0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2530;--tx:#f1e9f5;--card:#3a3342;--line:#52485c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2530;--tx:#f1e9f5;--card:#3a3342;--line:#52485c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,'Segoe UI',sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:1.3rem;margin:4px 0 2px;text-align:center}
.sub{text-align:center;font-family:Sarabun,sans-serif;font-size:.85rem;opacity:.75;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.tabs button.on{background:#f6b8d1;color:#4a1030;border-color:#f6b8d1;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.c{perspective:800px;height:195px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.c.f .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;color:#3b3340;box-shadow:0 2px 6px #0002;overflow:hidden}
.fb{transform:rotateY(180deg);font-size:.82rem;gap:3px}
.em{font-size:2.3rem;line-height:1.1}
.wd{font-family:Calibri,Carlito,sans-serif;font-size:1.1rem;font-weight:700}
.ipa{font-family:'Times New Roman',Times,serif;font-size:.95rem}
.sp{border:0;background:#fff9;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.9rem;margin-top:3px;color:#333}
.th{font-family:Sarabun,sans-serif;font-size:1.05rem;font-weight:600}
.es{font-family:Calibri,Carlito,sans-serif}.ts{font-family:Sarabun,sans-serif;font-size:.78rem}
.a{color:#c2185b;font-weight:700}.n{color:#0b6b2e;font-weight:700}
h2{font-size:1.05rem;margin:24px 0 8px}
.tw{overflow-x:auto}

td.e{font-family:Calibri,Carlito,sans-serif}
td .sp{background:#f6b8d1;flex:none}
</style></head><body><div class="w">
<h1>Type of Adjective: Quantitative Adjectives</h1>
<div class="sub">คลิกการ์ดเพื่อพลิกดูคำแปล · กดปุ่ม 🔊 เพื่อฟังเสียง (UK)</div>
<div class="tabs" id="tabs"></div>
<div class="tabs" id="pg"></div>
<div class="grid" id="grid"></div>
<h2>📋 ตารางคำศัพท์และประโยค</h2>
<div class="tw"><table><thead><tr><th>#</th><th>Vocabulary</th><th>Sentence</th><th>ความหมาย</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
// word|ipa|emoji|Thai|sentence (*adj* _noun_)|Thai sentence
const D={
"Basic Quantifiers":`some|sʌm|🍎|บาง, บ้าง|I have *some* _questions_.|ฉันมีคำถามบางข้อ
many|ˈmeni|📚|มาก, หลาย (นับได้)|There are *many* _books_ on the shelf.|มีหนังสือหลายเล่มบนชั้นวาง
much|mʌtʃ|⏳|มาก (นับไม่ได้)|She doesn’t have *much* _time_.|เธอไม่มีเวลามากนัก
few|fjuː|🧑‍🎓|ไม่กี่, น้อย (นับได้)|Only a *few* _students_ passed the _exam_.|มีนักเรียนไม่กี่คนที่สอบผ่าน
little|ˈlɪtl|💧|น้อย (นับไม่ได้)|We have *little* _water_ left.|เรามีน้ำเหลืออยู่น้อยมาก
several|ˈsevrəl|👥|หลาย (หลายคน/สิ่ง)|*Several* _people_ agreed with the _idea_.|หลายคนเห็นด้วยกับความคิดนั้น
all|ɔːl|🍪|ทั้งหมด|*All* the _cookies_ are gone.|คุกกี้ทั้งหมดหายไปแล้ว
no|nəʊ|🚫|ไม่มีเลย|There is *no* _milk_ in the _fridge_.|ไม่มีนมในตู้เย็นเลย
any|ˈeni|💵|บ้าง, ใดๆ|Do you have *any* _money_?|คุณมีเงินบ้างไหม?
enough|ɪˈnʌf|🍱|เพียงพอ|We have *enough* _food_ for everyone.|เรามีอาหารเพียงพอสำหรับทุกคน
each|iːtʃ|🎁|แต่ละ|*Each* _child_ received a _gift_.|เด็กแต่ละคนได้รับของขวัญ
every|ˈevri|🎒|ทุก, ทุกๆ|*Every* _student_ must wear a _uniform_.|นักเรียนทุกคนต้องใส่เครื่องแบบ`,
"Numbers & Groups":`one|wʌn|🐦|หนึ่ง|I saw *one* _bird_ in the _tree_.|ฉันเห็นนกหนึ่งตัวบนต้นไม้
two|tuː|👭|สอง|She has *two* _sisters_.|เธอมีพี่สาวสองคน
several|ˈsevrəl|🧑‍🤝‍🧑|หลาย (ของ...)|*Several* of my _friends_ are coming tonight.|เพื่อนหลายคนของฉันจะมาคืนนี้
plenty of|ˈplenti əv|🪑|มากมาย|We have *plenty of* _chairs_ for the _guests_.|เรามีเก้าอี้มากมายสำหรับแขก
most|məʊst|🍫|ส่วนใหญ่|*Most* _people_ like _chocolate_.|คนส่วนใหญ่ชอบช็อกโกแลต
half|hɑːf|🧃|ครึ่งหนึ่ง|I drank *half* of the _juice_.|ฉันดื่มน้ำผลไม้ไปครึ่งหนึ่ง
a lot of|ə ˈlɒt əv|📝|เยอะมาก|We have *a lot of* _homework_ today.|วันนี้เรามีการบ้านเยอะมาก
a couple of|ə ˈkʌpl əv|🤝|สองสามคน/อัน|She brought *a couple of* _friends_ with her.|เธอพาเพื่อนมาด้วยสองสามคน
dozens of|ˈdʌznz əv|🕊️|หลายโหล|There were *dozens of* _birds_ in the _sky_.|มีนกอยู่บนฟ้าหลายโหล
hundreds of|ˈhʌndrədz əv|📄|หลายร้อย|The _company_ received *hundreds of* _applications_.|บริษัทได้รับใบสมัครหลายร้อยใบ
thousands of|ˈθaʊzndz əv|🧳|หลายพัน|We’ve seen *thousands of* _tourists_ this year.|เราพบนักท่องเที่ยวหลายพันคนในปีนี้
tons of|ˈtʌnz əv|🍽️|เยอะมาก|I ate *tons of* _food_ at the _party_.|ฉันกินอาหารไปเยอะมากที่งานเลี้ยง
a bit of|ə ˈbɪt əv|🍬|นิดหน่อย|Just add *a bit of* _sugar_.|ใส่น้ำตาลนิดเดียวก็พอ
a pair of|ə ˈpeər əv|👟|หนึ่งคู่|I bought *a pair of* _shoes_.|ฉันซื้อรองเท้าหนึ่งคู่`,
"Large & Small Amounts":`a great deal of|ə ɡreɪt ˈdiːl əv|💪|เป็นจำนวนมาก|He gave *a great deal of* _effort_ to finish the _project_.|เขาทุ่มเทอย่างมากในการทำโปรเจกต์นี้
a large number of|ə lɑːdʒ ˈnʌmbər əv|🚗|จำนวนมาก (นับได้)|There are *a large number of* _cars_ on the _road_.|มีรถจำนวนมากอยู่บนถนน
a small number of|ə smɔːl ˈnʌmbər əv|🙋|จำนวนน้อย (นับได้)|Only *a small number of* _students_ passed.|มีนักเรียนเพียงจำนวนน้อยที่สอบผ่าน
a large amount of|ə lɑːdʒ əˈmaʊnt əv|🧘|ปริมาณมาก (นับไม่ได้)|She has *a large amount of* _patience_.|เธอมีความอดทนสูง
a small amount of|ə smɔːl əˈmaʊnt əv|🛢️|ปริมาณน้อย (นับไม่ได้)|We only need *a small amount of* _oil_.|เราต้องการน้ำมันเพียงเล็กน้อย
numerous|ˈnjuːmərəs|🏆|มากมาย|He made *numerous* _attempts_ to win.|เขาพยายามหลายครั้งเพื่อให้ชนะ
ample|ˈæmpl|⏰|เพียงพอ, เหลือเฟือ|We have *ample* _time_ to finish the _work_.|เรามีเวลาเพียงพอในการทำงานให้เสร็จ
countless|ˈkaʊntləs|💬|นับไม่ถ้วน|She received *countless* _messages_ on her _birthday_.|เธอได้รับข้อความมากมายในวันเกิด
minimal|ˈmɪnɪml|🩹|น้อยมาก|The _damage_ was *minimal*.|ความเสียหายน้อยมาก
substantial|səbˈstænʃl|💝|จำนวนมาก, มากมาย|They made a *substantial* _donation_ to _charity_.|พวกเขาบริจาคเงินให้การกุศลจำนวนมาก
entire|ɪnˈtaɪə|🎂|ทั้งหมด, ทั้งก้อน|He ate the *entire* _cake_.|เขากินเค้กทั้งก้อน
abundant|əˈbʌndənt|🦌|อุดมสมบูรณ์|The _forest_ is *abundant* with _wildlife_.|ป่าเต็มไปด้วยสัตว์ป่ามากมาย
scant|skænt|🔎|น้อยนิด|There was only *scant* _evidence_ to prove the _case_.|มีหลักฐานน้อยมากที่จะพิสูจน์คดีได้
multiple|ˈmʌltɪpl|💼|หลายอย่าง, หลายแหล่ง|He has *multiple* _sources_ of _income_.|เขามีรายได้จากหลายแหล่ง
considerable|kənˈsɪdərəbl|💸|มากพอสมควร|They spent a *considerable* _amount_ of _money_.|พวกเขาใช้เงินมากพอสมควร
negligible|ˈneɡlɪdʒəbl|🤏|เล็กน้อยจนไม่สำคัญ|The _difference_ is *negligible*.|ความแตกต่างนั้นเล็กน้อยจนไม่สำคัญ
innumerable|ɪˈnjuːmərəbl|✨|นับไม่ถ้วน|The _sky_ was filled with *innumerable* _stars_.|ท้องฟ้าเต็มไปด้วยดาวนับไม่ถ้วน`,
"Degree & Measure":`sparse|spɑːs|🏜️|เบาบาง|_Vegetation_ is *sparse* in the _desert_.|พืชพรรณในทะเลทรายมีอยู่อย่างเบาบาง
rare|reə|❄️|หายาก|_Snow_ is *rare* in this _country_.|หิมะเป็นสิ่งที่หายากในประเทศนี้
occasional|əˈkeɪʒənl|📆|เป็นครั้งคราว|We have *occasional* _meetings_ on _weekends_.|เรามีการประชุมในวันหยุดเป็นครั้งคราว
equal|ˈiːkwəl|⚖️|เท่าเทียม|We should give *equal* _attention_ to all _students_.|เราควรให้ความสนใจแก่นักเรียนทุกคนอย่างเท่าเทียม
unequal|ʌnˈiːkwəl|📊|ไม่เท่ากัน|The _distribution_ was *unequal* among the _workers_.|การแจกจ่ายไม่เท่ากันในหมู่คนงาน
measurable|ˈmeʒərəbl|🌧️|วัดได้|The _rainfall_ this year is *measurable*.|ปริมาณฝนปีนี้สามารถวัดได้
immeasurable|ɪˈmeʒərəbl|❤️|วัดไม่ได้, มหาศาล|Her _love_ for her _children_ is *immeasurable*.|ความรักของเธอที่มีต่อลูกนั้นมากจนวัดไม่ได้
overflowing|ˌəʊvəˈfləʊɪŋ|🧺|ล้น, เต็มเปี่ยม|The _basket_ was *overflowing* with _fruit_.|ตะกร้าล้นไปด้วยผลไม้
sparse|spɑːs|🏔️|เบาบาง|_Vegetation_ was *sparse* on the _mountain_.|พืชพรรณบนภูเขาเบาบาง
overflowing|ˌəʊvəˈfləʊɪŋ|😄|เต็มเปี่ยม|Her _heart_ is *overflowing* with _joy_.|หัวใจของเธอเต็มเปี่ยมไปด้วยความสุข`};
const P=['#fde2e4','#e2ece9','#dfe7fd','#fff1c9','#e8dff5','#d6f0e4'];
const fmt=s=>s.replace(/\*(.+?)\*/g,'<span class=a>$1</span>').replace(/_(.+?)_/g,'<span class=n>$1</span>');
const plain=s=>s.replace(/[*_]/g,'');
let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]GB/i.test(x.lang));
 voice=v.find(x=>/natural|online|google/i.test(x.name))||v.find(x=>/daniel|serena|kate|libby|sonia/i.test(x.name))||v[0]||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,e){if(e)e.stopPropagation();if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
const names=Object.keys(D);let cur=0,pg=0;
function show(i,p){cur=i;pg=p||0;
 document.getElementById('tabs').innerHTML=names.map((n,k)=>`<button class="${k==i?'on':''}" onclick="show(${k})">${n}</button>`).join('');
 const all=D[names[i]].split('\n').map(r=>r.split('|')),rows=all.slice(pg*25,pg*25+25),np=Math.ceil(all.length/25);document.getElementById('pg').innerHTML=np>1?Array.from({length:np},(_,n)=>`<button class=\"${n==pg?'on':''}\" onclick=\"show(${i},${n})\">หน้า ${n+1}</button>`).join(''):'';
 document.getElementById('grid').innerHTML=rows.map((r,k)=>`<div class="c" onclick="this.classList.toggle('f')"><div class="in">
 <div class="fa" style="background:${P[k%6]}"><div class="em">${r[2]}</div><div class="wd">${r[0]}</div><div class="ipa">/${r[1]}/</div><button class="sp" onclick="say('${r[0]}',event)" aria-label="ฟังเสียง">🔊</button></div>
 <div class="fb" style="background:${P[(k+3)%6]}"><div class="th">${r[3]}</div><div class="es">${fmt(r[4])}</div><div class="ts">${r[5]}</div><button class="sp" onclick="say('${plain(r[4]).replace(/'/g,"\\'")}',event)" aria-label="ฟังประโยค">🔊</button></div></div></div>`).join('');
 document.getElementById('tb').innerHTML=rows.map((r,k)=>`<tr><td>${pg*25+k+1}</td><td><b>${r[2]} ${r[0]}</b><br><span class="ipa">/${r[1]}/</span></td>
 <td class="e"><div style="display:flex;gap:8px;align-items:center"><button class="sp" onclick="say('${plain(r[4]).replace(/'/g,"\\'")}',event)">🔊</button><span>${fmt(r[4])}</span></div></td><td class="t">${r[3]}<br>${r[5]}</td></tr>`).join('')}
show(0);
</script></body></html>
