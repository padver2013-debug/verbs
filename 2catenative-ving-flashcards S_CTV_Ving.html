<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catenative Verbs + Ving Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1f2430;--mu:#667085;--ac:#2f6fed;--bd:#dde1ea;--bk:#eaf1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--sf:#1c212b;--tx:#eef1f7;--mu:#9aa4b5;--ac:#6c9bff;--bd:#30384a;--bk:#232c42}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--sf:#1c212b;--tx:#eef1f7;--mu:#9aa4b5;--ac:#6c9bff;--bd:#30384a;--bk:#232c42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
.th{font-family:'Sarabun','Thai Saraban',Tahoma,sans-serif}
header{padding:20px 16px 4px;text-align:center}
h1{margin:0;font-size:26px}
header p{margin:4px 0 0;color:var(--mu);font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px}
.tab{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 16px;border-radius:999px;cursor:pointer;font:600 15px Calibri,Carlito,Arial,sans-serif}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:0 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{height:320px;perspective:900px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.back{transform:rotateY(180deg);background:var(--bk)}
.emo{font-size:68px;line-height:1}
.verb{font-size:46px;font-weight:700;line-height:1.1;color:var(--ac)}
.tov{font-size:24px;color:var(--mu)}
.ipa{font-family:'Times New Roman',Times,serif;font-size:20px}
.no{position:absolute;top:8px;left:12px;font-size:12px;color:var(--mu)}
.sp{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.sp:hover{border-color:var(--ac)}
.mean{font-size:24px;font-weight:600}
.en{font-size:17px}
.en b{color:var(--ac)}
.hint{font-size:12px;color:var(--mu)}
h2{font-size:20px;margin:30px 0 10px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;font-size:16px}
th{background:var(--bk);font-size:14px}
td.e{font-family:Calibri,Carlito,Arial,sans-serif}
td.t{font-family:'Sarabun','Thai Saraban',Tahoma,sans-serif}
.pat{white-space:nowrap;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mu)}
</style></head><body>
<header><h1>Catenative Verbs + Ving</h1><p class="th">คลิกการ์ดเพื่อพลิกดูคำแปลและประโยค · กด 🔊 เพื่อฟังเสียงอังกฤษแบบ UK</p></header>
<div class="tabs" id="tabs"></div>
<main><div class="grid" id="grid"></div>
<h2 class="th">ตารางประโยค</h2>
<div class="wrap"><table><thead><tr><th>ข้อ</th><th>ประโยค</th><th class="th">แปล</th><th>Catenative verb + Ving</th><th>เสียง</th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script>
const D=`admit|ədˈmɪt|ยอมรับว่า|🙇|making|He admitted making a mistake.|เขายอมรับว่าทำผิดพลาด
appreciate|əˈpriːʃieɪt|ซาบซึ้งที่|🙏|receiving|I appreciate receiving your help.|ฉันซาบซึ้งที่ได้รับความช่วยเหลือจากคุณ
avoid|əˈvɔɪd|หลีกเลี่ยง|🚧|eating|You should avoid eating too much sugar.|คุณควรหลีกเลี่ยงการกินน้ำตาลมากเกินไป
can’t stand|kɑːnt stænd|ทนไม่ได้ที่|😫|waiting|I can’t stand waiting in traffic.|ฉันทนรอรถติดไม่ได้
complete|kəmˈpliːt|ทำให้เสร็จสิ้น|✅|decorating|They completed decorating the room.|พวกเขาตกแต่งห้องเสร็จแล้ว
continue|kənˈtɪnjuː|ทำต่อไป|➡️|studying|She continued studying after work.|เธอเรียนต่อหลังเลิกงาน
delay|dɪˈleɪ|เลื่อน/ชะลอ|⏰|making|He delayed making a decision.|เขาชะลอการตัดสินใจ
deny|dɪˈnaɪ|ปฏิเสธว่า|🙅|copying|The student denied copying the answers.|นักเรียนปฏิเสธว่าไม่ได้ลอกคำตอบ
discuss|dɪˈskʌs|หารือเรื่อง|💬|buying|We discussed buying a new house.|เราหารือเรื่องการซื้อบ้านหลังใหม่
dislike|dɪsˈlaɪk|ไม่ชอบ|👎|getting|I dislike getting up early.|ฉันไม่ชอบตื่นเช้า
doesn’t mind|ˈdʌznt maɪnd|ไม่รังเกียจที่|😌|helping|She doesn’t mind helping us.|เธอไม่รังเกียจที่จะช่วยเรา
enjoy|ɪnˈdʒɔɪ|สนุกกับ|😄|helping|I enjoy helping other people.|ฉันสนุกกับการช่วยเหลือผู้อื่น
finish|ˈfɪnɪʃ|ทำให้เสร็จ|🏁|writing|He finished writing the report.|เขาเขียนรายงานเสร็จแล้ว
hate|heɪt|เกลียด|😤|waiting|I hate waiting for buses.|ฉันเกลียดการรอรถเมล์
imagine|ɪˈmædʒɪn|จินตนาการว่า|💭|becoming|Can you imagine becoming famous?|คุณนึกภาพตัวเองกลายเป็นคนดังได้ไหม
keep|kiːp|ทำต่อเนื่อง|🔁|practicing|Keep practicing every day.|ฝึกฝนต่อไปทุกวัน
like|laɪk|ชอบ|👍|cooking|She likes cooking for her family.|เธอชอบทำอาหารให้ครอบครัว
love|lʌv|รัก/ชอบมาก|❤️|spending|He loves spending time outdoors.|เขาชอบใช้เวลากลางแจ้งมาก
mention|ˈmenʃn|พูดถึง|🗣️|meeting|She mentioned meeting him last week.|เธอพูดถึงการได้พบเขาเมื่อสัปดาห์ก่อน
miss|mɪs|คิดถึง/พลาด|🥺|playing|I miss playing with my old friends.|ฉันคิดถึงการเล่นกับเพื่อนเก่า
postpone|pəˈspəʊn|เลื่อนออกไป|📆|meeting|They postponed meeting the client.|พวกเขาเลื่อนการพบลูกค้าออกไป
practice|ˈpræktɪs|ฝึก|🏋️|speaking|We practice speaking English daily.|เราฝึกพูดภาษาอังกฤษทุกวัน
prefer|prɪˈfɜː|ชอบ...มากกว่า|⚖️|walking|I prefer walking to driving.|ฉันชอบเดินมากกว่าขับรถ
quit|kwɪt|เลิก|🚭|smoking|He quit smoking last year.|เขาเลิกสูบบุหรี่เมื่อปีที่แล้ว
recall|rɪˈkɔːl|นึกออก/จำได้|🧠|visiting|I recall visiting that temple as a child.|ฉันจำได้ว่าเคยไปวัดนั้นตอนเด็ก
recommend|ˌrekəˈmend|แนะนำ|⭐|visiting|I recommend visiting Chiang Mai.|ฉันแนะนำให้ไปเที่ยวเชียงใหม่
regret|rɪˈɡret|เสียใจที่|😔|selling|He regrets selling his car.|เขาเสียใจที่ขายรถ
resist|rɪˈzɪst|ต้านทาน|🛑|telling|She couldn’t resist telling him.|เธออดไม่ได้ที่จะบอกเขา
resume|rɪˈzjuːm|กลับมาทำต่อ|▶️|working|They resumed working after lunch.|พวกเขากลับมาทำงานต่อหลังมื้อเที่ยง
risk|rɪsk|เสี่ยงที่จะ|🎰|losing|Don’t risk losing your job.|อย่าเสี่ยงที่จะเสียงาน
start|stɑːt|เริ่ม|🚦|learning|I started learning French last month.|ฉันเริ่มเรียนภาษาฝรั่งเศสเมื่อเดือนที่แล้ว
stop|stɒp|หยุด|✋|talking|Please stop talking in class.|กรุณาหยุดคุยในห้องเรียน
suggest|səˈdʒest|เสนอแนะ|💡|going|She suggested going to the beach.|เธอเสนอให้ไปชายหาด`
.split("\n").map(l=>{const[v,i,t,e,v1,s,st]=l.split("|");return{v,i,t,e,v1,s,st}});
const $=id=>document.getElementById(id);
let voice=null;
function pick(){const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]GB/i.test(x.lang));
 const rank=x=>(/natural|online|google|premium|enhanced/i.test(x.name)?2:0)+(/daniel|serena|libby|sonia|ryan|kate|oliver/i.test(x.name)?1:0);
 voice=vs.sort((a,b)=>rank(b)-rank(a))[0]||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=r||.85;speechSynthesis.speak(u)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(n){
 const items=D.slice(n*20,n*20+20),base=n*20;
 document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i===n));
 if(!items.length){$('grid').innerHTML='<div class="empty th">แท็บนี้ยังไม่มีคำศัพท์ — ส่งคำศัพท์เพิ่มได้เลย</div>';$('tb').innerHTML='';return}
 $('grid').innerHTML=items.map((d,k)=>`<div class="card" data-k="${k}"><div class="in">
 <div class="face"><span class="no">${base+k+1}</span><div class="emo">${d.e}</div><div class="verb">${d.v}</div><div class="tov">${d.v1}</div><div class="ipa">/${d.i}/</div><button class="sp" data-say="${esc(d.v)}" data-r=".7">🔊 ฟังเสียง</button><div class="hint th">คลิกเพื่อพลิกการ์ด</div></div>
 <div class="face back"><div class="emo" style="font-size:40px">${d.e}</div><div class="mean th">${d.t}</div><div class="en">${esc(d.s)}</div><div class="th" style="color:var(--mu)">${d.st}</div><button class="sp" data-say="${esc(d.s)}">🔊 อ่านประโยค</button></div></div></div>`).join('');
 $('tb').innerHTML=items.map((d,k)=>`<tr><td>${base+k+1}</td><td class="e">${esc(d.s)}</td><td class="t">${d.st}</td><td class="e pat">${d.v} + ${d.v1}</td><td><button class="sp" data-say="${esc(d.s)}">🔊</button></td></tr>`).join('');
}
$('tabs').innerHTML=[0,1,2,3,4].map(i=>`<button class="tab" data-n="${i}">Tab ${i+1}</button>`).join('');
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');if(s){e.stopPropagation();say(s.dataset.say,parseFloat(s.dataset.r));return}
 const t=e.target.closest('.tab');if(t){show(+t.dataset.n);return}
 const c=e.target.closest('.card');if(c)c.classList.toggle('flip');
});
show(0);
</script></body></html>
