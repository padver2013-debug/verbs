<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catenative Verbs Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1f2430;--mu:#667085;--ac:#2f6fed;--bd:#dde1ea;--bk:#eaf1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151c;--sf:#1c212b;--tx:#eef1f7;--mu:#9aa4b5;--ac:#6c9bff;--bd:#30384a;--bk:#232c42}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--sf:#1c212b;--tx:#eef1f7;--mu:#9aa4b5;--ac:#6c9bff;--bd:#30384a;--bk:#232c42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
.th{font-family:'Sarabun','Thai Saraban',Tahoma,sans-serif}
header{padding:20px 16px 4px;text-align:center}
h1{margin:0;font-size:26px}
header p{margin:4px 0 0;color:var(--mu);font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 12px}
.tab{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:8px 16px;border-radius:999px;cursor:pointer;font:600 15px Calibri,Carlito,Arial,sans-serif}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:0 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{height:320px;perspective:900px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.back{transform:rotateY(180deg);background:var(--bk)}
.emo{font-size:68px;line-height:1}
.verb{font-size:46px;font-weight:700;line-height:1.1;color:var(--ac)}
.tov{font-size:24px;color:var(--mu)}
.ipa{font-family:'Times New Roman',Times,serif;font-size:20px}
.no{position:absolute;top:8px;left:12px;font-size:12px;color:var(--mu)}
.sp{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.sp:hover{border-color:var(--ac)}
.mean{font-size:24px;font-weight:600}
.en{font-size:17px}
.en b{color:var(--ac)}
.hint{font-size:12px;color:var(--mu)}
h2{font-size:20px;margin:30px 0 10px}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:9px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;font-size:16px}
th{background:var(--bk);font-size:14px}
td.e{font-family:Calibri,Carlito,Arial,sans-serif}
td.t{font-family:'Sarabun','Thai Saraban',Tahoma,sans-serif}
.pat{white-space:nowrap;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mu)}
</style></head><body>
<header><h1>Catenative Verbs + to V1</h1><p class="th">คลิกการ์ดเพื่อพลิกดูคำแปลและประโยค · กด 🔊 เพื่อฟังเสียงอังกฤษแบบ UK</p></header>
<div class="tabs" id="tabs"></div>
<main><div class="grid" id="grid"></div>
<h2 class="th">ตารางประโยค</h2>
<div class="wrap"><table><thead><tr><th>ข้อ</th><th>ประโยค</th><th class="th">แปล</th><th>Catenative verb + to + V1</th><th>เสียง</th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script>
const D=`afford|əˈfɔːd|มีเงินพอที่จะ|💰|travel|We can’t afford to travel abroad this year.|เราไม่มีเงินพอจะเดินทางต่างประเทศปีนี้
agree|əˈɡriː|ตกลงที่จะ|🤝|help|He agreed to help us move house.|เขาตกลงช่วยเราย้ายบ้าน
aim|eɪm|มุ่งหวังที่จะ|🎯|become|She aims to become a doctor.|เธอตั้งเป้าที่จะเป็นหมอ
appear|əˈpɪə|ดูเหมือนว่า|👀|know|He appears to know the answer.|เขาดูเหมือนจะรู้คำตอบ
arrange|əˈreɪndʒ|จัดการ/นัดหมายที่จะ|📅|travel|They arranged to travel together.|พวกเขานัดกันเดินทางไปด้วยกัน
attempt|əˈtempt|พยายามที่จะ|🧗|escape|The prisoner attempted to escape.|นักโทษพยายามหลบหนี
begin|bɪˈɡɪn|เริ่มที่จะ|🚦|sing|The choir began to sing.|คณะนักร้องประสานเสียงเริ่มร้องเพลง
bother|ˈbɒðə|เสียเวลา/อุตส่าห์|😒|explain|He didn’t bother to explain.|เขาไม่ได้อุตส่าห์อธิบาย
choose|tʃuːz|เลือกที่จะ|👆|remain|She chose to remain silent.|เธอเลือกที่จะนิ่งเงียบ
claim|kleɪm|อ้างว่า|📢|own|He claims to own three houses.|เขาอ้างว่าเป็นเจ้าของบ้านสามหลัง
continue|kənˈtɪnjuː|ทำต่อไป|➡️|learn|I will continue to learn English.|ฉันจะเรียนภาษาอังกฤษต่อไป
dare|deə|กล้าที่จะ|🦁|ask|Nobody dared to ask him.|ไม่มีใครกล้าถามเขา
decide|dɪˈsaɪd|ตัดสินใจที่จะ|⚖️|accept|She decided to accept the offer.|เธอตัดสินใจรับข้อเสนอ
demand|dɪˈmɑːnd|เรียกร้องที่จะ|✊|know|He demanded to know the truth.|เขาเรียกร้องที่จะรู้ความจริง
deserve|dɪˈzɜːv|สมควรที่จะ|🏆|win|You deserve to win.|คุณสมควรจะชนะ
expect|ɪkˈspekt|คาดว่าจะ|🔮|arrive|We expect to arrive at noon.|เราคาดว่าจะถึงตอนเที่ยง
fail|feɪl|ล้มเหลว/ไม่สามารถ|❌|understand|He failed to understand the rules.|เขาไม่เข้าใจกฎเลย
forget|fəˈɡet|ลืมที่จะ|🤦|lock|I forgot to lock the door.|ฉันลืมล็อกประตู
happen|ˈhæpən|บังเอิญ|🎲|meet|I happened to meet her yesterday.|เมื่อวานฉันบังเอิญเจอเธอ
hate|heɪt|เกลียดที่จะ|😤|wait|I hate to wait in long queues.|ฉันเกลียดการรอในคิวยาว ๆ
hesitate|ˈhezɪteɪt|ลังเลที่จะ|🤔|answer|She hesitated to answer.|เธอลังเลที่จะตอบ
hope|həʊp|หวังที่จะ|🌈|achieve|I hope to achieve my goals.|ฉันหวังว่าจะบรรลุเป้าหมาย
intend|ɪnˈtend|ตั้งใจที่จะ|🧭|improve|We intend to improve our service.|เราตั้งใจจะปรับปรุงบริการ
learn|lɜːn|เรียนรู้ที่จะ|📚|respect|Children learn to respect others.|เด็ก ๆ เรียนรู้ที่จะเคารพผู้อื่น
like|laɪk|ชอบที่จะ|👍|play|I like to play football.|ฉันชอบเล่นฟุตบอล
long|lɒŋ|โหยหา/ปรารถนาที่จะ|🌍|travel|She longs to travel the world.|เธอปรารถนาจะเดินทางรอบโลก
love|lʌv|รักที่จะ|❤️|read|He loves to read at night.|เขาชอบอ่านหนังสือตอนกลางคืน
manage|ˈmænɪdʒ|จัดการได้/สามารถ|💪|persuade|She managed to persuade him.|เธอโน้มน้าวเขาได้สำเร็จ
need|niːd|จำเป็นต้อง|🆘|improve|We need to improve our skills.|เราจำเป็นต้องพัฒนาทักษะ
neglect|nɪˈɡlekt|ละเลยที่จะ|🙈|reply|He neglected to reply to my email.|เขาละเลยที่จะตอบอีเมลฉัน
offer|ˈɒfə|เสนอที่จะ|🎁|accompany|He offered to accompany me.|เขาเสนอที่จะไปเป็นเพื่อนฉัน
plan|plæn|วางแผนที่จะ|🗺️|purchase|They plan to purchase a new car.|พวกเขาวางแผนจะซื้อรถคันใหม่
prefer|prɪˈfɜː|ชอบ...มากกว่า|⚖️|stay|I prefer to stay at home.|ฉันชอบอยู่บ้านมากกว่า
prepare|prɪˈpeə|เตรียมพร้อมที่จะ|🎒|speak|She prepared to speak to the crowd.|เธอเตรียมตัวพูดต่อหน้าผู้ชม
pretend|prɪˈtend|แกล้งทำเป็น|🎭|smile|He pretended to smile.|เขาแกล้งยิ้ม
promise|ˈprɒmɪs|สัญญาว่าจะ|🤞|support|I promise to support you.|ฉันสัญญาว่าจะสนับสนุนคุณ
refuse|rɪˈfjuːz|ปฏิเสธที่จะ|🚫|reveal|He refused to reveal his name.|เขาปฏิเสธที่จะเปิดเผยชื่อ
remember|rɪˈmembə|จำได้ว่าต้อง|🧠|thank|Remember to thank your host.|อย่าลืมขอบคุณเจ้าบ้าน
seek|siːk|แสวงหา/พยายามที่จะ|🔍|improve|We seek to improve efficiency.|เราพยายามเพิ่มประสิทธิภาพ
seem|siːm|ดูเหมือนว่า|🧐|understand|She seems to understand.|เธอดูเหมือนจะเข้าใจ
start|stɑːt|เริ่มที่จะ|🏁|feel|I started to feel tired.|ฉันเริ่มรู้สึกเหนื่อย
strive|straɪv|มุ่งมั่นที่จะ|🏔️|improve|We strive to improve every day.|เรามุ่งมั่นพัฒนาตัวเองทุกวัน
struggle|ˈstrʌɡl|ดิ้นรนที่จะ|😓|finish|He struggled to finish the race.|เขาฝืนวิ่งจนจบการแข่งขัน
swear|sweə|สาบานว่าจะ|✋|tell|I swear to tell the truth.|ฉันสาบานว่าจะพูดความจริง
tend|tend|มักจะ|🔄|wake|I tend to wake up early.|ฉันมักจะตื่นเช้า
threaten|ˈθretn|ขู่ว่าจะ|⚠️|leave|He threatened to leave the company.|เขาขู่ว่าจะลาออกจากบริษัท
try|traɪ|พยายามที่จะ|🙂|answer|Try to answer every question.|พยายามตอบทุกคำถาม
undertake|ˌʌndəˈteɪk|รับปากว่าจะ|📝|support|They undertook to support the project.|พวกเขารับปากว่าจะสนับสนุนโครงการ
volunteer|ˌvɒlənˈtɪə|อาสาที่จะ|🙋|teach|She volunteered to teach for free.|เธออาสาสอนฟรี
wait|weɪt|รอที่จะ|⏳|hear|I can’t wait to hear the news.|ฉันรอฟังข่าวไม่ไหวแล้ว
want|wɒnt|ต้องการที่จะ|⭐|master|He wants to master English.|เขาอยากเชี่ยวชาญภาษาอังกฤษ
wish|wɪʃ|ปรารถนาที่จะ|🌠|open|I wish to open a café.|ฉันอยากเปิดร้านกาแฟ
yearn|jɜːn|โหยหา/ใฝ่ฝันที่จะ|💭|see|He yearns to see his family.|เขาโหยหาที่จะได้เจอครอบครัว`
.split("\n").map(l=>{const[v,i,t,e,v1,s,st]=l.split("|");return{v,i,t,e,v1,s,st}});
const $=id=>document.getElementById(id);
let voice=null;
function pick(){const vs=speechSynthesis.getVoices().filter(x=>/^en[-_]GB/i.test(x.lang));
 const rank=x=>(/natural|online|google|premium|enhanced/i.test(x.name)?2:0)+(/daniel|serena|libby|sonia|ryan|kate|oliver/i.test(x.name)?1:0);
 voice=vs.sort((a,b)=>rank(b)-rank(a))[0]||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=r||.85;speechSynthesis.speak(u)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(n){
 const items=D.slice(n*20,n*20+20),base=n*20;
 document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',i===n));
 if(!items.length){$('grid').innerHTML='<div class="empty th">แท็บนี้ยังไม่มีคำศัพท์ — ส่งคำศัพท์เพิ่มได้เลย</div>';$('tb').innerHTML='';return}
 $('grid').innerHTML=items.map((d,k)=>`<div class="card" data-k="${k}"><div class="in">
 <div class="face"><span class="no">${base+k+1}</span><div class="emo">${d.e}</div><div class="verb">${d.v}</div><div class="tov">to ${d.v1}</div><div class="ipa">/${d.i}/</div><button class="sp" data-say="${esc(d.v)}" data-r=".7">🔊 ฟังเสียง</button><div class="hint th">คลิกเพื่อพลิกการ์ด</div></div>
 <div class="face back"><div class="emo" style="font-size:40px">${d.e}</div><div class="mean th">${d.t}</div><div class="en">${esc(d.s)}</div><div class="th" style="color:var(--mu)">${d.st}</div><button class="sp" data-say="${esc(d.s)}">🔊 อ่านประโยค</button></div></div></div>`).join('');
 $('tb').innerHTML=items.map((d,k)=>`<tr><td>${base+k+1}</td><td class="e">${esc(d.s)}</td><td class="t">${d.st}</td><td class="e pat">${d.v} + to + ${d.v1}</td><td><button class="sp" data-say="${esc(d.s)}">🔊</button></td></tr>`).join('');
}
$('tabs').innerHTML=[0,1,2,3,4].map(i=>`<button class="tab" data-n="${i}">Tab ${i+1}</button>`).join('');
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');if(s){e.stopPropagation();say(s.dataset.say,parseFloat(s.dataset.r));return}
 const t=e.target.closest('.tab');if(t){show(+t.dataset.n);return}
 const c=e.target.closest('.card');if(c)c.classList.toggle('flip');
});
show(0);
</script></body></html>
