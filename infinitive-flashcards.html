<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">

<title>Infinitive Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7ff;--tx:#3d3a4f;--card:#fff;--line:#e6e0f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1c27;--tx:#ece9f5;--card:#2a2736;--line:#3b3750}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Calibri,Carlito,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:19px;text-align:center;margin:4px 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.tab{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;background:var(--card);color:var(--tx);border:1px solid var(--line)}
.tab.on{background:#cdb8f0;color:#2b2340;border-color:#cdb8f0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}.scene{height:250px;perspective:800px}
.card{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;color:#33304a;box-shadow:0 6px 18px rgba(120,100,160,.18)}
.back{transform:rotateY(180deg)}
.hint{font-size:10px;opacity:.75;line-height:1.3}
.emoji{font-size:50px;line-height:1.1}
.word{font-family:Calibri,Carlito,sans-serif;font-size:22px;font-weight:700}
.ipa{font-family:"Times New Roman",Times,serif;font-size:15px}
.th{font-family:Sarabun,"Thai Saraban",sans-serif}
.thw{font-size:20px;font-weight:600}
.sen{font-size:13px;line-height:1.35}
.sth{font-size:12.5px;opacity:.85;line-height:1.4}
.spk{border:0;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;background:rgba(255,255,255,.75);flex:none}
.spk:active{transform:scale(.92)}
.nav{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0 20px}
.nav button{border:0;border-radius:999px;padding:8px 18px;font:inherit;cursor:pointer;background:#cdb8f0;color:#2b2340}
.tblbox{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;opacity:.8}
tr.cur td{background:rgba(205,184,240,.28)}
td.v{font-weight:700;white-space:nowrap}
td.t{font-family:Sarabun,"Thai Saraban",sans-serif}
td .spk{background:#e4d8f7;width:34px;height:34px;font-size:16px}
</style></head><body><div class="wrap">

<h1>Infinitive with “to” as the subject of a sentence</h1>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="tblbox"><table><thead><tr><th>#</th><th>Vocabulary</th><th>ไทย</th><th>Sentence</th><th>ไทย</th><th>🔊</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>

L|read|riːd|📖|อ่าน|To read every day improves your vocabulary.|การอ่านทุกวันช่วยพัฒนาคำศัพท์ของคุณ
C|help|help|🤝|ช่วยเหลือ|To help others makes me happy.|การช่วยเหลือผู้อื่นทำให้ฉันมีความสุข
H|exercise|ˈek.sə.saɪz|🏃|ออกกำลังกาย|To exercise every morning keeps you healthy.|การออกกำลังกายทุกเช้าทำให้คุณแข็งแรง
H|cook|kʊk|🍳|ทำอาหาร|To cook at home saves money.|การทำอาหารที่บ้านช่วยประหยัดเงิน
L|understand|ˌʌn.dəˈstænd|💡|เข้าใจ|To understand grammar takes practice.|การเข้าใจไวยากรณ์ต้องอาศัยการฝึกฝน
W|achieve|əˈtʃiːv|🏆|บรรลุ|To achieve your goals requires hard work.|การบรรลุเป้าหมายต้องใช้ความพยายามอย่างหนัก

L|write|raɪt|✍️|เขียน|To write a diary helps you reflect.|การเขียนไดอารี่ช่วยให้คุณทบทวนตัวเอง
T|play|pleɪ|⚽|เล่น|To play football with friends is fun.|การเล่นฟุตบอลกับเพื่อนสนุกมาก
W|start|stɑːt|🚀|เริ่มต้น|To start a business needs courage.|การเริ่มต้นธุรกิจต้องใช้ความกล้า
L|study|ˈstʌd.i|📚|ศึกษา|To study abroad is a great opportunity.|การไปเรียนต่างประเทศเป็นโอกาสที่ยอดเยี่ยม
H|grow|ɡrəʊ|🌱|ปลูก / เติบโต|To grow vegetables is a relaxing hobby.|การปลูกผักเป็นงานอดิเรกที่ผ่อนคลาย
H|meditate|ˈmed.ɪ.teɪt|🧘|นั่งสมาธิ|To meditate daily reduces stress.|การนั่งสมาธิทุกวันช่วยลดความเครียด
C|volunteer|ˌvɒl.ənˈtɪər|🙋|อาสาสมัคร|To volunteer at a shelter is rewarding.|การเป็นอาสาสมัครที่ศูนย์พักพิงเป็นสิ่งที่คุ้มค่า
H|keep|kiːp|📅|รักษา / ทำต่อเนื่อง|To keep a routine makes life easier.|การรักษากิจวัตรประจำวันทำให้ชีวิตง่ายขึ้น
L|learn|lɜːn|🧠|เรียนรู้|To learn from mistakes is part of growing.|การเรียนรู้จากความผิดพลาดเป็นส่วนหนึ่งของการเติบโต
C|adopt|əˈdɒpt|🐶|รับเลี้ยง|To adopt a pet is a big responsibility.|การรับเลี้ยงสัตว์เป็นความรับผิดชอบที่ใหญ่
C|speak|spiːk|🗣️|พูด|To speak English fluently is my goal.|การพูดภาษาอังกฤษได้คล่องคือเป้าหมายของฉัน
W|follow|ˈfɒl.əʊ|🧭|ทำตาม / ติดตาม|To follow your dreams takes courage.|การทำตามความฝันต้องใช้ความกล้าหาญ
W|set|set|🎯|ตั้ง|To set clear goals helps you focus.|การตั้งเป้าหมายที่ชัดเจนช่วยให้คุณมีสมาธิ
T|enjoy|ɪnˈdʒɔɪ|😊|เพลิดเพลิน|To enjoy life is the secret of happiness.|การเพลิดเพลินกับชีวิตคือความลับของความสุข
H|take|teɪk|🚶|ไป (เดิน)|To take a walk after dinner is healthy.|การเดินเล่นหลังอาหารเย็นดีต่อสุขภาพ
W|prioritize|praɪˈɒr.ɪ.taɪz|📋|จัดลำดับความสำคัญ|To prioritize tasks saves time.|การจัดลำดับความสำคัญของงานช่วยประหยัดเวลา
C|express|ɪkˈspres|💬|แสดงออก|To express feelings honestly builds trust.|การแสดงความรู้สึกอย่างจริงใจสร้างความไว้วางใจ
H|maintain|meɪnˈteɪn|⚖️|รักษา|To maintain a healthy weight is important.|การรักษาน้ำหนักให้สมส่วนเป็นเรื่องสำคัญ
C|be|biː|😇|เป็น|To be kind costs nothing.|การเป็นคนใจดีไม่มีค่าใช้จ่าย
W|make|meɪk|✅|ตัดสินใจ / ทำ|To make a decision quickly is not always easy.|การตัดสินใจอย่างรวดเร็วไม่ใช่เรื่องง่ายเสมอไป
T|travel|ˈtræv.əl|🚆|เดินทาง|To travel by train is comfortable.|การเดินทางด้วยรถไฟสบายดี
C|make|meɪk|👫|สร้าง (เพื่อน)|To make new friends is exciting.|การมีเพื่อนใหม่น่าตื่นเต้น
C|communicate|kəˈmjuː.nɪ.keɪt|📣|สื่อสาร|To communicate clearly avoids misunderstanding.|การสื่อสารอย่างชัดเจนช่วยหลีกเลี่ยงความเข้าใจผิด
W|build|bɪld|🧱|สร้าง|To build a strong team takes time.|การสร้างทีมที่แข็งแกร่งต้องใช้เวลา
L|study|ˈstʌd.i|🌙|เรียน|To study at night works best for me.|การเรียนตอนกลางคืนเหมาะกับฉันที่สุด
T|enjoy|ɪnˈdʒɔɪ|🌳|เพลิดเพลิน|To enjoy nature is good for the mind.|การเพลิดเพลินกับธรรมชาติดีต่อจิตใจ
H|wake|weɪk|⏰|ตื่น|To wake up early gives you more time.|การตื่นเช้าทำให้คุณมีเวลามากขึ้น
L|finish|ˈfɪn.ɪʃ|📝|ทำให้เสร็จ|To finish homework before dinner is my rule.|การทำการบ้านให้เสร็จก่อนอาหารเย็นคือกฎของฉัน
L|take|teɪk|🗒️|จด|To take notes in class helps your memory.|การจดบันทึกในห้องเรียนช่วยความจำของคุณ
W|succeed|səkˈsiːd|🥇|ประสบความสำเร็จ|To succeed in life needs perseverance.|การประสบความสำเร็จในชีวิตต้องอาศัยความมานะ
H|exercise|ˈek.sə.saɪz|🏋️|ออกกำลังกาย|To exercise regularly boosts your energy.|การออกกำลังกายสม่ำเสมอเพิ่มพลังงานให้คุณ
H|remain|rɪˈmeɪn|😌|คงอยู่ (ในสภาพ)|To remain calm in a crisis is a skill.|การสงบสติอารมณ์ในภาวะวิกฤตเป็นทักษะ
T|read|riːd|🛫|อ่าน|To read on a long flight passes the time.|การอ่านหนังสือบนเที่ยวบินยาวช่วยให้เวลาผ่านไป
L|focus|ˈfəʊ.kəs|🔍|ให้ความสนใจ|To focus on one task at a time improves quality.|การโฟกัสทีละงานช่วยให้งานมีคุณภาพ
C|maintain|meɪnˈteɪn|💞|รักษา (ความสัมพันธ์)|To maintain good relationships takes effort.|การรักษาความสัมพันธ์ที่ดีต้องใช้ความพยายาม
W|take|teɪk|💼|รับ (ผิดชอบ)|To take responsibility shows maturity.|การรับผิดชอบแสดงถึงความเป็นผู้ใหญ่
C|give|ɡɪv|🎁|ให้|To give is better than to receive.|การให้ดีกว่าการรับ
W|learn|lɜːn|🛠️|เรียนรู้ (ทักษะ)|To learn new skills at work is essential.|การเรียนรู้ทักษะใหม่ในที่ทำงานเป็นสิ่งจำเป็น
H|enjoy|ɪnˈdʒɔɪ|🍽️|เพลิดเพลิน|To enjoy a good meal with family is a joy.|การทานอาหารอร่อยกับครอบครัวคือความสุข
W|create|kriˈeɪt|🎨|สร้างสรรค์|To create something new is exciting.|การสร้างสรรค์สิ่งใหม่ๆ น่าตื่นเต้น
C|listen|ˈlɪs.ən|👂|ฟัง|To listen carefully is a sign of respect.|การตั้งใจฟังเป็นสัญลักษณ์ของความเคารพ
C|accept|əkˈsept|🤗|ยอมรับ|To accept differences makes us wiser.|การยอมรับความแตกต่างทำให้เราฉลาดขึ้น
T|discover|dɪˈskʌv.ər|🗺️|ค้นพบ|To discover new places is an adventure.|การค้นพบสถานที่ใหม่ๆ คือการผจญภัย
C|forgive|fəˈɡɪv|🕊️|ให้อภัย|To forgive others brings peace.|การให้อภัยผู้อื่นนำมาซึ่งความสงบ
H|simplify|ˈsɪm.plɪ.faɪ|🧹|ทำให้ง่ายขึ้น|To simplify your life reduces stress.|การทำชีวิตให้เรียบง่ายช่วยลดความเครียด
H|stay|steɪ|🌈|คงอยู่ / อยู่|To stay positive helps during hard times.|การมองโลกในแง่ดีช่วยได้ในยามยาก
W|challenge|ˈtʃæl.ɪndʒ|💪|ท้าทาย|To challenge yourself leads to growth.|การท้าทายตัวเองนำไปสู่การเติบโต
L|learn|lɜːn|💻|เรียนรู้|To learn English online is convenient.|การเรียนภาษาอังกฤษออนไลน์สะดวก
W|find|faɪnd|🔎|หา|To find a good job is not easy.|การหางานดีๆ ไม่ใช่เรื่องง่าย
T|take|teɪk|📷|ถ่าย|To take photos on holiday is fun.|การถ่ายรูปตอนพักร้อนสนุกมาก`.split("\n").map(l=>{const a=l.split("|");return{c:a[0],w:"To "+a[1],ipa:"/tə "+a[2]+"/",e:a[3],th:a[4],s:a[5],st:a[6]}});
const K=Object.keys(CATS);let tab=0,list=[];
const $=id=>document.getElementById(id);
// speech: pick the best en-GB voice available
let voice=null;
function pick(){const v=speechSynthesis.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));
 const sc=x=>(/natural|online|neural/i.test(x.name)?4:0)+(/google/i.test(x.name)?3:0)+(/sonia|libby|ryan|daniel|serena|kate/i.test(x.name)?2:0);
 voice=v.sort((a,b)=>sc(b)-sc(a))[0]||null}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.88;speechSynthesis.speak(u)}
function render(){
 list=D.map((x,n)=>[x,n]).filter(a=>a[0].c==K[tab]);
 $("grid").innerHTML=list.map(([d,g],k)=>{const c=CATS[d.c][1];return `<div class="scene"><div class="card" onclick="this.classList.toggle('flip')"><div class="face" style="background:${c}"><div class="hint">Infinitive with “to” as the subject</div><div class="emoji">${d.e}</div><div class="word">${d.w}</div><div class="ipa">${d.ipa}</div><button class="spk" title="ฟังเสียง" onclick="event.stopPropagation();say(D[${g}].w.toLowerCase())">🔊</button></div><div class="face back" style="background:${c}"><div class="th thw">${d.th}</div><div class="sen">${d.s}</div><button class="spk" title="ฟังประโยค" onclick="event.stopPropagation();say(D[${g}].s)">🔊</button><div class="th sth">${d.st}</div></div></div></div>`}).join("");
 $("tb").innerHTML=list.map(([x,g],k)=>`<tr><td>${k+1}</td><td class="v">${x.w}</td><td class="t">${x.th}</td><td>${x.s}</td><td class="t">${x.st}</td><td><button class="spk" onclick="say(D[${g}].s)">🔊</button></td></tr>`).join("");
 document.querySelectorAll(".tab").forEach((b,n)=>b.classList.toggle("on",n==tab));
}
function setTab(n){tab=n;render()}
$("tabs").innerHTML=K.map((k,n)=>`<button class="tab" onclick="setTab(${n})">${CATS[k][0]} (${D.filter(x=>x.c==k).length})</button>`).join("");
setTab(0);
</script></body></html>
