function hl(o){const s=sp(o);if(!s)return o.e;return o.e.slice(0,s.x)+`<mark><span class="mv">${o.e.substr(s.x,o.c.length)}</span><span class="ob">${s.ob}</span> <span class="v1" data-t="${o.vt}">${o.v}</span></mark>`+o.e.slice(s.y+1+o.v.length)}
function tc(o){const s=sp(o);return s?`<mark><span class="mv">${o.c}</span><span class="ob">${s.ob}</span> <b>${o.v}</b></mark>`:""}
const NT={made:"make = ทำให้/บังคับให้ (ใคร) ทำ",let:"let = ให้/อนุญาตให้ (ใคร) ทำ",help:"help = ช่วย (ใคร) ทำ",saw:"เห็น (ใคร) ทำ...",heard:"ได้ยิน (ใคร) ทำ...",watch:"ดู (ใคร) ทำ...",notic:"สังเกตเห็น (ใคร) ทำ...",felt:"รู้สึกว่า (ใคร/อะไร) ทำ...",observ:"สังเกตเห็น (ใคร) ทำ..."};
function nt(o){const m=o.c.toLowerCase().match(/^(made|let|help|saw|heard|watch|notic|felt|observ)/);return(m?NT[m[1]]+" · ":"")+"ไม่มี to หลัง Object (V1 เปล่า)"}
let voice=null;function pick(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
const pref=[/natural/i,/google us english/i,/aria|jenny|guy/i,/samantha|ava|allison/i,/google/i,/en[-_]US/i];
for(const p of pref){const f=vs.find(v=>p.test(v.name)||p.test(v.lang));if(f){voice=f;return}}voice=vs[0]||null}
if("speechSynthesis"in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,ev){ev.stopPropagation();if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}

<div class="f b"><span class="n">#${o.i}</span><span class="bd">V + O + V1</span><div class="th" style="margin-top:22px">${o.t}</div><div class="hint" style="font-size:13px;color:var(--ac)">💡 ${nt(o)}</div>
<div class="en" style="font-size:16px">${hl(o)}</div><button class="sp" onclick="say(${JSON.stringify(o.e).replace(/"/g,'&quot;')},event)">🔊 ฟัง</button></div></div></div>`).join("");
tb.innerHTML=L.map(o=>`<tr><td>${o.i}</td><td>${o.e}</td><td>${o.t}</td><td>${tc(o)}</td></tr>`).join("")}
for(let i=0;i<5;i++){const b=document.createElement("button");b.textContent=`Tab ${i+1} (${i*20+1}-${i*20+20})`;b.onclick=()=>show(i);tabs.append(b)}
